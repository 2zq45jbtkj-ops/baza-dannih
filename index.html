  wireKabinetHandlers(s);
}

function wireKabinetHandlers(s){
  const c = document.getElementById('tabContent');

  c.querySelectorAll('[data-kb-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.kbToggle;
      state.kabinetOpen[key] = !state.kabinetOpen[key];
      const btn = document.getElementById('collapseToggleBtn');
      if(btn) btn.textContent = kbAnyOpen() ? 'Свернуть' : 'Развернуть';
      paintKabinet(s);
    };
  });

  c.querySelectorAll('select[data-kb-field]').forEach(el=>{
    el.onchange = ()=> saveKabinet(s, {[el.dataset.kbField]: el.value || null});
  });
  c.querySelectorAll('input[data-kb-field]').forEach(el=>{
    el.onchange = ()=>{
      const key = el.dataset.kbField, type = el.dataset.kbType;
      let v = el.value;
      if(type==='number') v = v===''? null : Number(v);
      saveKabinet(s, {[key]: v});
    };
  });
  c.querySelectorAll('textarea[data-kb-field]').forEach(el=>{
    el.onchange = ()=> saveKabinet(s, {[el.dataset.kbField]: el.value || null});
  });

  const compareBtn = c.querySelector('[data-kb-compare-toggle]');
  if(compareBtn) compareBtn.onclick = ()=>{ state.kabinetCompareOpen = !state.kabinetCompareOpen; paintKabinet(s); };



  // Справочник (Цель обучения / Жанр): open/close, select-toggle, pin,
  // delete-with-confirm, inline add-your-own.
  c.querySelectorAll('[data-kb-dict-toggle]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.dataset.kbDictToggle;
      const dd = state.kabinetDictDD;
      const wasOpen = dd.openKey === key && !dd.adding;
      state.kabinetDictDD = { openKey: wasOpen ? null : key, adding:false, draft:'', error:'', confirm:null };
      paintKabinet(s);
    };
  });

  c.querySelectorAll('[data-kb-dict-select]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.dataset.kbDictSelect;
      const label = el.dataset.kbValue;
      const cache = kbCache(s);
      const cur = cache.intake[key] || [];
      const idx = cur.indexOf(label);
      const next = idx>=0 ? cur.slice(0,idx).concat(cur.slice(idx+1)) : cur.concat([label]);
      saveKabinet(s, {[key]: next});
    };
  });

  c.querySelectorAll('[data-kb-dict-select-one]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.dataset.kbDictSelectOne;
      const label = el.dataset.kbValue;
      state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
      saveKabinet(s, {[key]: key === 'age' ? Number(label) : label});
    };
  });

  c.querySelectorAll('[data-kb-dict-pin]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      kbTogglePin(el.dataset.kbDictPin, el.dataset.kbValue, s);
    };
  });

  c.querySelectorAll('[data-kb-dict-delete-ask]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm: el.dataset.kbDictDeleteAsk + '::' + el.dataset.kbValue});
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-delete-cancel]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm:null});
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-delete-confirm]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      kbDeleteDictOption(el.dataset.kbDictDeleteConfirm, el.dataset.kbValue, s);
    };
  });

  c.querySelectorAll('[data-kb-dict-start-add]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = { openKey: el.dataset.kbDictStartAdd, adding:true, draft:'', error:'', confirm:null };
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-cancel-add]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-draft]').forEach(el=>{
    el.onclick = (e)=> e.stopPropagation();
    el.oninput = ()=>{ state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {draft: el.value, error:''}); };
    el.onkeydown = (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); kbCommitDictAdd(el.dataset.kbDictDraft, s); }
      if(e.key === 'Escape'){ state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null }; paintKabinet(s); }
    };
  });
  c.querySelectorAll('[data-kb-dict-commit]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      kbCommitDictAdd(el.dataset.kbDictCommit, s);
    };
  });


  const resetBtn = c.querySelector('[data-kb-reset-structures]');
  if(resetBtn) resetBtn.onclick = ()=> saveKabinet(s, {structures: kbNeutralStructures()});
  const transferBtn = c.querySelector('[data-kb-transfer]');
  if(transferBtn) transferBtn.onclick = ()=> alert('Раздел «Дневник занятий» ещё не готов — перенос структур в занятие подключим, когда он появится.');

  c.querySelectorAll('[data-kb-structure]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const structures = Object.assign({}, kbNeutralStructures(), cache.intake.structures||{});
      structures[el.dataset.kbStructure] = el.dataset.kbValue;
      saveKabinet(s, {structures});
    };
  });

  c.querySelectorAll('[data-kb-quality]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const qualities = Object.assign({}, cache.intake.qualities||{});
      const key = el.dataset.kbQuality;
      const cur = qualities[key] || 'нет';
      qualities[key] = KB_STATES[(KB_STATES.indexOf(cur)+1) % KB_STATES.length];
      saveKabinet(s, {qualities});
    };
  });
  c.querySelectorAll('[data-kb-mode]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const modes = Object.assign({}, cache.intake.modes||{});
      const key = el.dataset.kbMode;
      const cur = modes[key] || 'нет';
      modes[key] = KB_STATES[(KB_STATES.indexOf(cur)+1) % KB_STATES.length];
      saveKabinet(s, {modes});
    };
  });
  c.querySelectorAll('[data-kb-anchor]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const anchors = Object.assign({}, cache.intake.anchors||{});
      const key = el.dataset.kbAnchor;
      anchors[key] = !anchors[key];
      saveKabinet(s, {anchors});
    };
  });

  const slider = document.getElementById('kbMetallicSlider');
  if(slider){
    slider.oninput = ()=>{
      const v = Number(slider.value);
      const valEl = document.getElementById('kbMetallicValue');
      const noteEl = document.getElementById('kbMetallicNote');
      if(valEl) valEl.textContent = v + '% металла';
      if(noteEl) noteEl.textContent = kbMetallicNote(v);
    };
    slider.onchange = ()=> saveKabinet(s, {metallicPercent: Number(slider.value)});
  }

  const uploadInput = document.getElementById('kbUploadInput');
  if(uploadInput) uploadInput.onchange = (e)=>{
    const file = e.target.files && e.target.files[0];
    if(file) kbUploadFile(s, file);
    e.target.value = '';
  };

  c.querySelectorAll('[data-kb-take-del]').forEach(el=>{
    el.onclick = ()=>{
      const id = Number(el.dataset.kbTakeDel);
      const cache = kbCache(s);
      const takes = (cache.intake.referenceTakes||[]).filter(t=>t.id!==id);
      kbSaveTakes(s, takes);
    };
  });

  const recBtn = document.getElementById('kbRecBtn');
  if(recBtn) recBtn.onclick = ()=>{
    if(state.kabinetRec.active) kbStopRecording(s);
    else kbStartRecording(s);
  };

  const pdfBtn = document.getElementById('kbExportPdfBtn');
  if(pdfBtn) pdfBtn.onclick = ()=> alert('Отправка PDF ученику — в разработке. Нужно решить отдельно: email, ссылка на скачивание или Telegram. Как определимся — подключим.');
}

function kbUploadFile(s, file){
  if(file.size > 4200000){
    alert('Файл слишком большой для сохранения в базе (лимит ~4 МБ на запись). Загрузите файл покороче.');
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    const take = { id: Date.now(), name: file.name, meta: 'загружено · ' + Math.round(file.size/1024) + ' KB', dataUrl: reader.result, createdAt: new Date().toISOString() };
    const cache = kbCache(s);
    const takes = [take].concat(cache.intake.referenceTakes || []);
    kbSaveTakes(s, takes);
  };
  reader.readAsDataURL(file);
}

// Saves referenceTakes and drives the "Сохраняю…/Сохранено" status next to the
// recorder, so a successful save is visibly confirmed instead of relying on the
// take silently appearing in the list (which used to happen even before the
// server call resolved and gave no signal that the save had actually landed).
function kbSaveTakes(s, takes){
  const rec = state.kabinetRec;
  rec.saving = true;
  rec.justSaved = false;
  paintKabinet(s);
  saveKabinet(s, {referenceTakes: takes}).then(ok=>{
    rec.saving = false;
    rec.justSaved = ok;
    paintKabinet(s);
    if(ok){
      setTimeout(()=>{ rec.justSaved = false; paintKabinet(s); }, 2200);
    }
  });
}

function kbPad(n){ return n<10 ? '0'+n : String(n); }

function kbUpdateRecDom(){
  const rec = state.kabinetRec;
  const timerEl = document.getElementById('kbRecTimer');
  if(timerEl) timerEl.textContent = kbPad(Math.floor(rec.seconds/60)) + ':' + kbPad(rec.seconds%60);
  const barsWrap = document.getElementById('kbRecBars');
  if(barsWrap){
    const bars = barsWrap.children;
    const levels = rec.levels;
    for(let i=0;i<bars.length;i++){
      const v = levels[levels.length - bars.length + i] || 0;
      const h = Math.max(3, Math.round(v*38));
      bars[i].style.height = h + 'px';
      bars[i].style.background = '#E0553A';
    }
  }
}

function kbStartRecording(s){
  const rec = state.kabinetRec;
  if(rec.active || rec.saving) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){
    rec.error = 'Браузер не поддерживает запись звука. Откройте страницу в Chrome или Safari.';
    paintKabinet(s);
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    rec.stream = stream;
    const mr = new MediaRecorder(stream);
    rec.chunks = [];
    mr.ondataavailable = e=>{ if(e.data && e.data.size) rec.chunks.push(e.data); };
    mr.onstop = ()=>{
      const blob = new Blob(rec.chunks, {type: mr.mimeType || 'audio/webm'});
      const secs = rec.seconds;
      const d = new Date();
      const fileName = kbPad(d.getDate())+'.'+kbPad(d.getMonth()+1)+'.'+d.getFullYear()+'_'+(s.name||'student').replace(/\s+/g,'_')+'_reference.webm';
      const reader = new FileReader();
      reader.onload = ()=>{
        const dataUrl = reader.result;
        kbTeardownRecorder();
        if(dataUrl.length > 5800000){
          rec.error = 'Запись слишком большая для сохранения в базе (лимит ~4 МБ). Сократите длительность и запишите заново.';
          paintKabinet(s);
          return;
        }
        const take = { id: Date.now(), name: fileName, meta: kbPad(Math.floor(secs/60))+':'+kbPad(secs%60)+' · '+Math.round(blob.size/1024)+' KB', dataUrl, createdAt: new Date().toISOString() };
        const cache = kbCache(s);
        const takes = [take].concat(cache.intake.referenceTakes || []);
        kbSaveTakes(s, takes);
      };
      reader.readAsDataURL(blob);
    };
    rec.mediaRecorder = mr;
    mr.start();
    rec.active = true; rec.seconds = 0; rec.error = ''; rec.levels = [];
    paintKabinet(s);
    rec.timer = setInterval(()=>{ rec.seconds++; kbUpdateRecDom(); }, 1000);
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      ctx.createMediaStreamSource(stream).connect(analyser);
      rec.ctx = ctx;
      const data = new Uint8Array(analyser.frequencyBinCount);
      rec.levelTimer = setInterval(()=>{
        analyser.getByteTimeDomainData(data);
        let peak = 0;
        for(let i=0;i<data.length;i++) peak = Math.max(peak, Math.abs(data[i]-128)/128);
        rec.levels = rec.levels.concat([peak]).slice(-28);
        kbUpdateRecDom();
      }, 90);
    }catch(e){ /* визуализация не критична для работы записи */ }
  }).catch(()=>{
    rec.error = 'Нет доступа к микрофону. Разрешите запись в настройках браузера и попробуйте снова.';
    paintKabinet(s);
  });
}

function kbStopRecording(s){
  const rec = state.kabinetRec;
  if(rec.timer) clearInterval(rec.timer);
  if(rec.levelTimer) clearInterval(rec.levelTimer);
  if(rec.mediaRecorder && rec.mediaRecorder.state !== 'inactive') rec.mediaRecorder.stop();
  else kbTeardownRecorder();
}

function kbTeardownRecorder(){
  const rec = state.kabinetRec;
  if(rec.timer) clearInterval(rec.timer);
  if(rec.levelTimer) clearInterval(rec.levelTimer);
  if(rec.ctx){ try{ rec.ctx.close(); }catch(e){} rec.ctx = null; }
  if(rec.stream){ rec.stream.getTracks().forEach(t=>t.stop()); rec.stream = null; }
  rec.active = false; rec.mediaRecorder = null; rec.timer = null; rec.levelTimer = null;
}

// Close an open Справочник dropdown (Цель обучения / Жанр / Возраст /
// Тип голоса на слух / Жалобы / any future field using this component)
// on any click outside it.
document.addEventListener('click', ()=>{
  if(!state.kabinetDictDD.openKey) return;
  state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
  const s = state.data.students.find(x=>x.id===state.activeStudentId);
  if(s && state.activeTab==='profile') paintKabinet(s);
});

render();
syncStudentsFromServer();
</script>
