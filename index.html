function kbTogglePin(fieldKey, label, s){
  const d = state.kbDicts[fieldKey];
  const isPinned = d.pinned.indexOf(label) >= 0;
  const next = isPinned
    ? { core: d.core, pinned: d.pinned.filter(x=>x!==label), added: d.added.concat([label]) }
    : { core: d.core, pinned: d.pinned.concat([label]), added: d.added.filter(x=>x!==label) };
  state.kbDicts[fieldKey] = next;
  saveFieldDict(fieldKey, next);
  kbRepaintCurrent(s);
}

function kbDeleteDictOption(fieldKey, label, s){
  const d = state.kbDicts[fieldKey];
  const next = { core: d.core, pinned: d.pinned.filter(x=>x!==label), added: d.added.filter(x=>x!==label) };
  state.kbDicts[fieldKey] = next;
  state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm:null});
  saveFieldDict(fieldKey, next);
  kbRepaintCurrent(s);
}

function kbMetallicNote(v){
  if(v<=20) return 'Почти без металла. Голос воздушный и лёгкий, складки смыкаются неплотно, часть выдоха уходит мимо звука. На сцене такой тембр не несёт: без микрофона его перекрывает даже негромкий аккомпанемент, в миксе он тонет за инструментами. Плюс в том, что нагрузка на складки минимальна и голос почти не устаёт, поэтому режим годится для восстановления после перегруза. Минус — динамику и опору на нём не построить: любая попытка добавить громкость выходит через давление, а не через смыкание.';
  if(v<=40) return 'Перевес в воздушность. Металл появляется только тогда, когда добавляется подсвязочное давление, поэтому громкая динамика идёт через форсирование, а не через плотность смыкания. Практически это выглядит так: тихие фразы звучат мягко и красиво, а на подъёме к громкому звук либо срывается в фальцет, либо становится сдавленным. Работать нужно с массой складок и опорой отдельно от громкости: сначала плотное смыкание на комфортной динамике, только потом наращивание объёма. До этого любые попытки бэлта будут закрепляться как пережим.';
  if(v<=60) return 'Рабочий баланс. Металл включается по запросу, а не по случайности: ученик может дать плотный звук и тут же вернуться в воздушный, не меняя опоры. Переход между регистрами держится без срыва, потому что масса складок и наклон щитовидного перестраиваются постепенно, а не рывком. Это то состояние, из которого стоит осваивать новые качества и эффекты: база уже устойчива, а запас по громкости и по мягкости есть в обе стороны. Задача на этом этапе — не ломать баланс при усложнении репертуара.';
  if(v<=80) return 'Металла много. Звук яркий, плотный и несущий, хорошо читается в миксе и на большой сцене без запаса по мощности микрофона. Обратная сторона — высокая нагрузка: складки работают толстой массой почти всё время, поэтому нужно следить за усталостью к концу занятия и за ретракцией ложных складок. Если ретракция теряется, металл быстро превращается в сдавленность, а на следующий день появляется сип. В таком режиме обязательны короткие паузы, воздушные упражнения между подходами и контроль общего голосового пробега за неделю.';
  return 'Максимум металла. Плотный сценический звук на всём диапазоне, ощущение мощи и полного контроля над динамикой. Держится он только на двух вещах: постоянной ретракции ложных складок и рабочих якорях головы, шеи и корпуса. Стоит потерять любую из них — и режим мгновенно уходит в пережим, с болью, сипом и потерей верха на несколько дней. Такой уровень металла не должен быть режимом по умолчанию: это инструмент для отдельных фраз и кульминаций, а базовую работу и разогрев нужно вести на более умеренном балансе.';
}

function renderKabinet(s){
  const c = document.getElementById('tabContent');
  const needDicts = !state.kbDictsLoaded;
  if(state.kabinetCache[s.id] && state.kabinetCache[s.id].lessons && !needDicts){ paintKabinet(s); return; }
  c.innerHTML = `<div class="kb-loading">Загружаю анкету…</div>`;
  const cached = state.kabinetCache[s.id];
  const tasks = [
    cached ? Promise.resolve({intake: cached.intake}) : apiGet('/api/intake?studentId=' + encodeURIComponent(s.id)),
    (cached && cached.lessons) ? Promise.resolve({lessons: cached.lessons}) : apiGet('/api/lessons?studentId=' + encodeURIComponent(s.id))
  ];
  if(needDicts) tasks.push(apiGet('/api/dicts'));
  Promise.all(tasks).then(([intakeRes, lessonsRes, dictsRes])=>{
    state.kabinetCache[s.id] = {
      intake: (intakeRes && intakeRes.intake) || {},
      lessons: (lessonsRes && lessonsRes.lessons) || []
    };
    if(needDicts){
      const server = (dictsRes && dictsRes.dicts) || {};
      Object.keys(state.kbDicts).forEach(k=>{
        const row = server[k];
        if(row) state.kbDicts[k] = Object.assign({}, state.kbDicts[k], {pinned: row.pinned||[], added: row.added||[]});
      });
      state.kbDictsLoaded = true;
    }
    paintKabinet(s);
  }).catch(err=>{
    c.innerHTML = `<div class="card-error">Не удалось загрузить анкету: ${String(err.message||err)}. Проверьте подключение базы Postgres в настройках Vercel.</div>`;
  });
}

function kbCache(s){
  return state.kabinetCache[s.id] || (state.kabinetCache[s.id] = {intake:{}, lessons:[]});
}

function saveKabinet(s, patch){
  const cache = kbCache(s);
  cache.intake = Object.assign({}, cache.intake, patch);
  // Repaint immediately with the optimistic local state so clicks feel
  // instant — the network round-trip below can take a noticeable moment,
  // and the user shouldn't have to wait for it just to see their own click
  // register. kbFlushKabinet() repaints again once the server confirms,
  // reconciling with res.intake (harmless no-op repaint in the common case).
  paintKabinet(s);
  // Two POSTs fired back-to-back can reach Postgres out of order — whichever
  // one physically commits last wins, even if it carries older data. Rapid
  // clicks (e.g. picking several chips in a multi-select in a row) reliably
  // triggered this and silently dropped a selection. Fix: never have more
  // than one save in flight per student — chain every save onto the same
  // per-student promise so they run strictly one after another. Each save
  // still reads cache.intake at the moment it actually fires, so rapid local
  // changes get coalesced into the next flush rather than lost.
  const prevChain = state.kabinetSaveChain[s.id] || Promise.resolve();
  const thisSave = prevChain.then(()=> kbFlushKabinet(s));
  state.kabinetSaveChain[s.id] = thisSave.catch(()=>{});
  return thisSave;
}

function kbFlushKabinet(s){
  const cache = kbCache(s);
  const payload = Object.assign({studentId: s.id}, cache.intake);
  const mySeq = (state.kabinetSaveSeq[s.id] = (state.kabinetSaveSeq[s.id] || 0) + 1);
  return apiSend('/api/intake', 'POST', payload)
    .then(res=>{
      if(state.kabinetSaveSeq[s.id] === mySeq){ cache.intake = res.intake; }
      paintKabinet(s);
      return true;
    })
    .catch(err=>{
      alert('Не удалось сохранить: ' + (err.message||err));
      paintKabinet(s);
      return false;
    });
}

function kbWireFilesRows(s){ const root = document.getElementById('tabContent'); if(!root) return; const cache = kbCache(s); const lessons = cache.lessons || []; lessons.forEach(function(l){ (l.takes||[]).forEach(function(t){ const ownerKey = 'files_' + l.id; const rk = ownerKey + '_' + t.id; const getTakes = function(){ return l.takes || []; }; const setTakes = function(next){ l.takes = next; }; const persist = function(){ dnQueueSave(l.id, {takes: l.takes}, function(lesson){ if(lesson){ const idx = lessons.findIndex(function(x){ return String(x.id)===String(lesson.id); }); if(idx>=0) lessons[idx] = lesson; } }); }; vrWireTakeRow(root, rk, t, getTakes, setTakes, persist, function(){ paintKabinet(s); }, true); }); }); }
  function kbUploadFile(s, file){
  if(file.size > 4200000){
    alert('Файл слишком большой для сохранения в базе (лимит ~4 МБ на запись). Загрузите файл покороче.');
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    const take = { id: Date.now(), name: file.name, meta: 'загружено · ' + Math.round(file.size/1024) + ' KB', dataUrl: reader.result, createdAt: new Date().toISOString() };
    const cache = kbCache(s);
    const takes = [take].concat(cache.intake.referenceTakes || []);
    kbSaveTakes(s, takes);
  };
  reader.readAsDataURL(file);
}

// Saves referenceTakes and drives the "Сохраняю…/Сохранено" status next to the
// recorder, so a successful save is visibly confirmed instead of relying on the
// take silently appearing in the list (which used to happen even before the
// server call resolved and gave no signal that the save had actually landed).
function kbSaveTakes(s, takes){
  const rec = state.kabinetRec;
  const wasSaving = rec.saving;
  if(wasSaving) paintKabinet(s);
  saveKabinet(s, {referenceTakes: takes}).then(ok=>{
    if(!wasSaving) return;
    rec.saving = false;
    rec.justSaved = ok;
    paintKabinet(s);
    if(ok){
      setTimeout(()=>{ rec.justSaved = false; paintKabinet(s); }, 2200);
    }
  });
}

/* ============================================================
   PDF УЧЕНИКА («Карточка ученика · передача») — кнопка в сводке
   Кабинета. Вёрстка скопирована из присланного эталона
   («ПРОМТ — PDF ученика A4.md» + .dc.html), часть данных которых

   предпросмотре перед печатью и сохраняются, чтобы не вводить

   открытое сразу по клику (до await), чтобы не словить блокировку

const PDF_MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const PDF_SONG_STATUSES = ['новая','в работе','готова','на паузе'];

function pdfMonthShort(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  return isNaN(d) ? '' : PDF_MONTHS_SHORT[d.getMonth()];
}
function pdfFmtDateShort(dateStr){
  if(!dateStr) return '';
  const p = String(dateStr).slice(0,10).split('-');
  return p.length===3 ? p[2]+'.'+p[1] : '';
}
function pdfFmtDateFull(dateStr){
  if(!dateStr) return '';
  const p = String(dateStr).slice(0,10).split('-');
  return p.length===3 ? p[2]+'.'+p[1]+'.'+p[0] : '';
}
function pdfEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pdfDurationStr(sec){
  sec = Math.round(Number(sec)||0);
  const m = Math.floor(sec/60), r = sec%60;
  return m+':'+(r<10?'0':'')+r;
}
function pdfProblemCategory(name){
  for(const g of DN_PROBLEM_GROUPS){ if(g.items.indexOf(name)>=0) return g.label; }
  return 'Другое';
}

function pdfBuildProblems(lessons, resolvedProblems){
  const resolvedMap = {};
  (resolvedProblems||[]).forEach(r=>{ if(r && r.name) resolvedMap[r.name] = r.resolvedMonth || ''; });
  const firstSeen = {};
  lessons.slice().sort((a,b)=> String(a.lessonDate||'').localeCompare(String(b.lessonDate||''))).forEach(l=>{
    (l.newProblems||[]).forEach(name=>{ if(name && !firstSeen[name]) firstSeen[name] = l.lessonDate; });
  });
  const open = [], resolved = [];
  Object.keys(firstSeen).forEach(name=>{
    const category = pdfProblemCategory(name);
    const sinceMonth = pdfMonthShort(firstSeen[name]);
    if(Object.prototype.hasOwnProperty.call(resolvedMap, name)){
      resolved.push({ name, category, sinceMonth, toMonth: resolvedMap[name] });
    } else {
      open.push({ name, category, sinceMonth });
    }
  });
  return { open, resolved };
}

function pdfBuildTopics(lessons){
  const graded = lessons.filter(l=>l.grade!=null).slice().sort((a,b)=> String(a.lessonDate||'').localeCompare(String(b.lessonDate||'')));
  function prevGrade(date){
    let prev = null;
    for(const l of graded){ if(String(l.lessonDate||'') < String(date||'')) prev = l; else break; }
    return prev ? prev.grade : null;
  }
  const withTopic = lessons.filter(l=>l.topic).slice().sort((a,b)=> String(b.lessonDate||'').localeCompare(String(a.lessonDate||'')));
  return withTopic.slice(0,5).map(l=>{
    const g = l.grade;
    const pg = g!=null ? prevGrade(l.lessonDate) : null;
    let flag = 'так же';
    if(g!=null && pg!=null) flag = g>pg ? 'лучше' : (g<pg ? 'хуже' : 'так же');
    return { date: pdfFmtDateShort(l.lessonDate), topic: l.topic, comment: l.goal||'', score: g, flag };
  });
}

function pdfCollectLessonTakes(lessons){
  const items = [];
  lessons.forEach(l=>{ (l.takes||[]).forEach(t=>{ items.push({ lessonId: l.id, lessonDate: l.lessonDate, take: t }); }); });
  items.sort((a,b)=> String(a.lessonDate||'').localeCompare(String(b.lessonDate||'')) || String(a.take.createdAt||'').localeCompare(String(b.take.createdAt||'')));
  return items;
}
// Порядок по просьбе Николая: первая запись — с самого первого урока,
// 2 оставшиеся — из последних уроков (не фиксированная тройка
// "референс/середина/последний" из исходного эталона).
function pdfPickRecordings(lessons){
  const items = pdfCollectLessonTakes(lessons);
  if(!items.length) return [];
  const picked = [Object.assign({ label: 'Первый урок' }, items[0])];
  const rest = items.slice(1);
  const recent = rest.slice(-2);
  recent.forEach((it,i)=>{
    const label = (recent.length===2 && i===0) ? ('Урок ' + pdfFmtDateShort(it.lessonDate)) : 'Последний урок';
    picked.push(Object.assign({ label }, it));
  });
  return picked;
}

function pdfQrSvg(url){
  try{
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 1, scalable: true });
  }catch(e){ return ''; }
}

function pdfBuildModel(s, cache){
  const intake = cache.intake || {};
  const lessons = cache.lessons || [];
  let packageLeft = null;
  if(s.packageSize && s.packageStartDate){
    const used = lessons.filter(l=> String(l.lessonDate||'') >= String(s.packageStartDate)).length;
    packageLeft = Math.max(0, Number(s.packageSize) - used);
  }
  return {
    studentId: s.id,
    name: s.name || '',
    lessonsCount: lessons.length,
    packageSize: s.packageSize || null,
    packageStartDate: s.packageStartDate || null,
    packageLeft,
    age: intake.age!=null ? String(intake.age) : '',
    voiceType: intake.voiceType || '',
    goal: (intake.goals && intake.goals[0]) || '',
    genres: (intake.genres||[]).join(', '),
    genreRefs: intake.genreRefs || '',
    experienceLevel: intake.experienceLevel || '',
    priorExperience: intake.priorExperience || '',
    currentFocus: intake.currentFocus || '',
    songs: Array.isArray(intake.repertoireSongs) ? intake.repertoireSongs.map(x=>Object.assign({}, x, {
      comment: Array.isArray(x.comment) ? x.comment.slice() : (x.comment ? [x.comment] : [])
    })) : [],
    topics: pdfBuildTopics(lessons),
    recordings: pdfPickRecordings(lessons),
    problems: pdfBuildProblems(lessons, intake.resolvedProblems),
    diagnosis: intake.diagnosis || '',
    smoking: intake.smoking || '',
    pmsFactor: intake.pmsFactor || '',
    lessonConsiderations: intake.lessonConsiderations || '',
    symptomDuration: intake.symptomDuration || '',
    larStatus: intake.larStatus || '',
    vocalLoadJob: intake.vocalLoadJob || '',
    hydration: intake.hydration || '',
    sleep: intake.sleep || '',
    articulatory: pdfBuildArticulatory(intake),
    _resolvedDirty: []
  };
}

// «Артикуляционные особенности» для PDF — те же данные и тот же каталог
// ART_KB, что в Кабинете, просто компактно: без описаний методов и без
// текстовых полей "что делали/помогло/не сработало" (это рабочая зона
// редактирования, в карточке-передаче достаточно итога — сработало/нет).
function pdfBuildArticulatory(intake){
  const entries = Array.isArray(intake.articulatory) ? intake.articulatory : [];
  return entries.map(entry=>{
    const kb = ART_KB[entry.letter];
    if(!kb) return null;
    const ti = entry.typeIdx || 0;
    const type = kb.types[ti] || kb.types[0];
    const marks = entry.methodMarks || {};
    const methods = type.methods.map((m,mi)=>({ name: m.name, mark: marks[ti+'_'+mi] || null }));
    return {
      badge: kb.badge, defectName: kb.defectName, typeName: type.name, typeNote: type.note || '',
      methods, tried: entry.tried || '', helped: entry.helped || '', nowork: entry.nowork || ''
    };
  }).filter(Boolean);
}

async function pdfOpenPreview(s){
  const cache = kbCache(s);
  if(!cache.lessons){
    try{
      const [intakeRes, lessonsRes] = await Promise.all([
        apiGet('/api/intake?studentId=' + encodeURIComponent(s.id)),
        apiGet('/api/lessons?studentId=' + encodeURIComponent(s.id))
      ]);
      cache.intake = (intakeRes && intakeRes.intake) || {};
      cache.lessons = (lessonsRes && lessonsRes.lessons) || [];
    }catch(e){ alert('Не удалось загрузить данные: ' + (e.message||e)); return; }

  state.pdfPreview = { s, model: pdfBuildModel(s, cache) };
  pdfRenderOverlay();
}

function pdfCloseOverlay(){

function pdfRenderOverlay(){
  let el = document.getElementById('pdfOverlay');

    el.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(20,18,16,0.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px;';
    document.body.appendChild(el);

// «Над чем работаем» у каждой песни — мультивыбор, тот же компонент
// Справочник (чипы + попап + «Добавить свой вариант»), что и везде в
// Кабинете (см. kbSpravochnikControl). Переиспользует общие kbDictRows/
// kbDictChipRow/kbDictAddingHtml/kbTogglePin/kbDeleteDictOption (они уже
// универсальны — читают/пишут только state.kbDicts, без привязки к intake),
// но с собственным открытием/закрытием попапа и выбором (пишет в
// model.songs[i].comment, а не в intake), т.к. это поле — одно на песню,

function pdfSongFocusControl(songIdx, values){
  const selected = Array.isArray(values) ? values : [];
  const dd = state.kabinetDictDD;
  const fieldKey = 'songFocus_' + songIdx;
  const isAdding = dd.openKey === fieldKey && dd.adding;
  const isOpen = dd.openKey === fieldKey && !dd.adding;

  const valueHtml = selected.length
    ? `<span class="kb-multi-chips">${selected.map(v=>`<span class="kb-multi-chip-tag">${pdfEsc(v)}</span>`).join('')}</span>`
    : `<span class="kb-multi-placeholder" style="font-size:13px;">над чем работаем</span>`;

  const addingHtml = kbDictAddingHtml('songFocus', fieldKey);

  const triggerHtml = `
    <button type="button" class="kb-multi-trigger" data-pdf-focus-toggle="${fieldKey}" style="border:1px solid #E4DCD1;border-radius:7px;padding:7px 9px;background:#fff;min-height:auto;">
      ${valueHtml}
      <span class="kb-multi-caret">${isOpen?'▲':'▼'}</span>
    </button>`;

  const rows = kbDictRows('songFocus');
  const dropdownHtml = `
    <div class="kb-dict-dropdown">
      <div class="kb-dict-chip-grid">
        ${rows.map(r=> kbDictChipRow('songFocus', r, selected.indexOf(r.label)>=0, 'data-pdf-focus-select')).join('')}
      </div>
      <div class="kb-dict-divider"></div>
      <button type="button" data-pdf-focus-start-add="${fieldKey}" style="padding:9px 10px;border:none;background:none;border-radius:9px;color:#A8452C;font-size:13.5px;font-weight:700;text-align:left;cursor:pointer;">+ Добавить свой вариант</button>
    </div>`;

  return `<div class="kb-dict-wrap">
    ${isAdding ? addingHtml : triggerHtml}
    ${isOpen ? dropdownHtml : ''}
  </div>`;
}

function pdfCommitSongFocusAdd(){
  const dd = state.kabinetDictDD;
  const raw = (dd.draft || '').trim();
  if(!raw){ state.kabinetDictDD = Object.assign({}, dd, {error:'Пустое значение добавить нельзя.'}); pdfRenderOverlay(); return; }
  const d = state.kbDicts.songFocus;
  const all = d.core.concat(d.pinned, d.added);
  if(all.some(x=>x.toLowerCase()===raw.toLowerCase())){
    state.kabinetDictDD = Object.assign({}, dd, {error:'Такой вариант уже есть в списке.'});
    pdfRenderOverlay();
    return;
  }
  const nextDict = { core: d.core, pinned: d.pinned, added: d.added.concat([raw]) };
  state.kbDicts.songFocus = nextDict;
  saveFieldDict('songFocus', nextDict);
  const idx = Number((dd.openKey||'').split('_')[1]);
  state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
  if(!isNaN(idx) && state.pdfPreview && state.pdfPreview.model.songs[idx]){
    const song = state.pdfPreview.model.songs[idx];
    const cur = song.comment || [];
    if(cur.indexOf(raw)===-1) song.comment = cur.concat([raw]);
  }
  pdfRenderOverlay();
}

function pdfWireOverlay(){
  const el = document.getElementById('pdfOverlay');
  if(!el) return;
  el.onclick = (e)=>{ if(e.target===el) pdfCloseOverlay(); };
  const closeBtn = document.getElementById('pdfCloseBtn'); if(closeBtn) closeBtn.onclick = pdfCloseOverlay;
  const cancelBtn = document.getElementById('pdfCancelBtn'); if(cancelBtn) cancelBtn.onclick = pdfCloseOverlay;
  const confirmBtn = document.getElementById('pdfConfirmBtn'); if(confirmBtn) confirmBtn.onclick = pdfConfirm;

  const addSongBtn = document.getElementById('pdfAddSongBtn');
  if(addSongBtn) addSongBtn.onclick = ()=>{
    state.pdfPreview.model.songs.push({ title:'', artist:'', comment:[], key:'', status:'новая' });
    pdfRenderOverlay();
  };
  el.querySelectorAll('[data-pdf-song-remove]').forEach(btn=>{
    btn.onclick = ()=>{
      state.pdfPreview.model.songs.splice(Number(btn.dataset.pdfSongRemove), 1);
      pdfRenderOverlay();
    };
  });
  el.querySelectorAll('[data-pdf-song-idx]').forEach(row=>{
    const i = Number(row.dataset.pdfSongIdx);
    row.querySelectorAll('[data-pdf-song-field]').forEach(inp=>{
      inp.onchange = ()=>{ state.pdfPreview.model.songs[i][inp.dataset.pdfSongField] = inp.value; };
    });
  });
  el.querySelectorAll('[data-pdf-resolve]').forEach(btn=>{
    btn.onclick = ()=>{
      const name = btn.dataset.pdfResolve;
      const model = state.pdfPreview.model;
      const month = PDF_MONTHS_SHORT[new Date().getMonth()];
      const idx = model.problems.open.findIndex(x=>x.name===name);
      if(idx>=0){
        const p = model.problems.open[idx];
        model.problems.open.splice(idx,1);
        model.problems.resolved.push({ name: p.name, category: p.category, sinceMonth: p.sinceMonth, toMonth: month });
        model._resolvedDirty.push({ name: p.name, resolvedMonth: month });
      }
      pdfRenderOverlay();
    };
  });

  // «Над чем работаем» у песни — мультивыбор (см. pdfSongFocusControl).
  el.querySelectorAll('[data-pdf-focus-toggle]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const key = btn.dataset.pdfFocusToggle;
      const dd = state.kabinetDictDD;
      const wasOpen = dd.openKey === key && !dd.adding;
      state.kabinetDictDD = { openKey: wasOpen ? null : key, adding:false, draft:'', error:'', confirm:null };
      pdfRenderOverlay();
    };
  });
  el.querySelectorAll('[data-pdf-focus-select]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const idx = Number((state.kabinetDictDD.openKey||'').split('_')[1]);
      const song = !isNaN(idx) && state.pdfPreview.model.songs[idx];
      if(!song) return;
      const label = btn.dataset.kbValue;
      const cur = song.comment || [];
      const i2 = cur.indexOf(label);
      song.comment = i2>=0 ? cur.slice(0,i2).concat(cur.slice(i2+1)) : cur.concat([label]);
      pdfRenderOverlay();
    };
  });
  el.querySelectorAll('[data-pdf-focus-start-add]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = { openKey: btn.dataset.pdfFocusStartAdd, adding:true, draft:'', error:'', confirm:null };
      pdfRenderOverlay();
    };
  });
  // Закрепить/удалить вариант из общего словаря songFocus — те же общие
  // функции, что и везде в Кабинете (читают/пишут только state.kbDicts).
  el.querySelectorAll('[data-kb-dict-pin]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); kbTogglePin(btn.dataset.kbDictPin, btn.dataset.kbValue, state.pdfPreview.s); pdfRenderOverlay(); };
  });
  el.querySelectorAll('[data-kb-dict-delete-ask]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm: btn.dataset.kbDictDeleteAsk+'::'+btn.dataset.kbValue}); pdfRenderOverlay(); };
  });
  el.querySelectorAll('[data-kb-dict-delete-cancel]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm:null}); pdfRenderOverlay(); };
  });
  el.querySelectorAll('[data-kb-dict-delete-confirm]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); kbDeleteDictOption(btn.dataset.kbDictDeleteConfirm, btn.dataset.kbValue, state.pdfPreview.s); pdfRenderOverlay(); };
  });
  el.querySelectorAll('[data-kb-dict-draft]').forEach(inp=>{
    inp.onclick = (e)=> e.stopPropagation();
    inp.oninput = ()=>{ state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {draft: inp.value, error:''}); };
    inp.onkeydown = (e)=>{
      if(e.key==='Enter'){ e.preventDefault(); pdfCommitSongFocusAdd(); }
      if(e.key==='Escape'){ state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null }; pdfRenderOverlay(); }
    };
  });
  el.querySelectorAll('[data-kb-dict-commit]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); pdfCommitSongFocusAdd(); };
  });
  el.querySelectorAll('[data-kb-dict-cancel-add]').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null }; pdfRenderOverlay(); };
  });
}

async function pdfConfirm(){
  const { s, model } = state.pdfPreview;
  const confirmBtn = document.getElementById('pdfConfirmBtn');
  if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = 'Готовлю…'; }

  // Открываем вкладку сразу, синхронно по клику — после await её откроет
  // блокировщик всплывающих окон.
  const printWin = window.open('', '_blank');

  const focusInput = document.getElementById('pdfCurrentFocus');
  const considerInput = document.getElementById('pdfConsiderations');
  const packageSizeInput = document.getElementById('pdfPackageSize');
  const packageStartInput = document.getElementById('pdfPackageStart');
  model.currentFocus = focusInput ? focusInput.value.trim() : model.currentFocus;
  model.lessonConsiderations = considerInput ? considerInput.value : model.lessonConsiderations;
  model.packageSize = (packageSizeInput && packageSizeInput.value) ? Number(packageSizeInput.value) : null;
  model.packageStartDate = (packageStartInput && packageStartInput.value) ? packageStartInput.value : null;

  const cache = kbCache(s);
  if(model.packageSize && model.packageStartDate){
    const used = (cache.lessons||[]).filter(l=> String(l.lessonDate||'') >= model.packageStartDate).length;
    model.packageLeft = Math.max(0, model.packageSize - used);
  } else {
    model.packageLeft = null;
  }

  try{
    await apiSend('/api/students?id=' + encodeURIComponent(s.id), 'PATCH', { packageSize: model.packageSize, packageStartDate: model.packageStartDate });
    s.packageSize = model.packageSize; s.packageStartDate = model.packageStartDate;

    const resolvedProblems = (cache.intake.resolvedProblems || []).slice();
    model._resolvedDirty.forEach(r=>{ if(!resolvedProblems.some(x=>x.name===r.name)) resolvedProblems.push(r); });
    await saveKabinet(s, {
      repertoireSongs: model.songs,
      resolvedProblems,
      currentFocus: model.currentFocus,
      lessonConsiderations: model.lessonConsiderations
    });

    for(const rec of model.recordings){
      if(!rec.take.publicToken){
        rec.take.publicToken = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(16).slice(2));
        const lesson = (cache.lessons||[]).find(l=>String(l.id)===String(rec.lessonId));
        if(lesson){
          await new Promise(resolve=>{ dnQueueSave(lesson.id, { takes: lesson.takes }, ()=> resolve()); });
        }
      }
    }
  }catch(e){
    alert('Не удалось сохранить часть правок: ' + (e.message||e) + '\nПечатаю с тем, что успело сохраниться.');
  }

  const html = pdfRenderPrint(model);
  if(printWin){
    printWin.document.open();
    printWin.document.write(html);
    printWin.document.close();
    printWin.onload = ()=> setTimeout(()=> printWin.print(), 300);
  } else {
    alert('Браузер заблокировал открытие вкладки — разреши всплывающие окна для этого сайта и нажми кнопку ещё раз.');
  }
  pdfCloseOverlay();
}

/* ---------- Печатная версия (точная копия эталона) ---------- */

function pdfGenCard(label, value, note, spanCols){
  if(!value) return '';
  return `<div style="background:#FFFFFF;border:1px solid #ECE5DB;border-radius:12px;padding:12px 14px;${spanCols?`grid-column:span ${spanCols};`:''}">
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#A09488;font-weight:700;margin-bottom:4px;">${pdfEsc(label)}</div>
    <div style="font-size:13.5px;font-weight:700;">${pdfEsc(value)}</div>
    ${note ? `<div style="font-size:10.5px;color:#8A7E74;margin-top:3px;">${pdfEsc(note)}</div>` : ''}
  </div>`;
}

function pdfSongStatusStyle(status){
  if(status==='готова') return { bg:'#EFF5EE', color:'#4C7A45' };
  if(status==='в работе') return { bg:'#F6EFE2', color:'#9A6A1F' };
  return { bg:'#F4EEE6', color:'#6E645A' };
}
function pdfFlagStyle(flag){
  if(flag==='лучше') return { bg:'#EFF5EE', color:'#4C7A45' };
  if(flag==='хуже') return { bg:'#F1E7E3', color:'#A8452C' };
  return { bg:'#F4EEE6', color:'#6E645A' };
}

function pdfSongsCard(songs){
  if(!songs.length) return '';
  const rows = songs.map(song=>{
    const st = pdfSongStatusStyle(song.status);
    return `<div class="pdf-row" style="display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #F0EAE1;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:12.5px;"><span style="font-weight:700;">${pdfEsc(song.title)}</span>${song.artist?` <span style="color:#6E645A;">— ${pdfEsc(song.artist)}</span>`:''}</div>
        ${(song.comment&&song.comment.length)?`<div style="font-size:10.5px;color:#8A7E74;margin-top:2px;">${pdfEsc(song.comment.join(', '))}</div>`:''}
      </div>
      <div class="mono" style="font-size:11px;color:#6E645A;width:56px;text-align:right;">${pdfEsc(song.key||'')}</div>
      <div style="width:96px;text-align:right;">${song.status?`<span style="display:inline-block;background:${st.bg};color:${st.color};font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 10px;">${pdfEsc(song.status)}</span>`:''}</div>
    </div>`;
  }).join('');
  return `<div class="sec-title">ПЕСНИ В РАБОТЕ</div><div style="background:#FFFFFF;border:1px solid #ECE5DB;border-radius:12px;padding:0 14px;">${rows}</div>`;
}

function pdfTopicsCard(topics){
  if(!topics.length) return '';
  const rows = topics.map(t=>{
    const fl = pdfFlagStyle(t.flag);
    return `<div class="pdf-row" style="display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #F0EAE1;">
      <div class="mono" style="font-size:11px;color:#8A7E74;width:52px;">${pdfEsc(t.date)}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:12px;font-weight:700;">${pdfEsc(t.topic)}</div>
        ${t.comment?`<div style="font-size:10.5px;color:#8A7E74;margin-top:2px;">${pdfEsc(t.comment)}</div>`:''}
      </div>
      <div class="mono" style="font-size:12px;width:54px;text-align:right;">${t.score!=null?t.score+'/10':''}</div>
      <div style="width:92px;text-align:right;">${t.score!=null?`<span style="display:inline-block;background:${fl.bg};color:${fl.color};font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 10px;">${pdfEsc(t.flag)}</span>`:''}</div>
    </div>`;
  }).join('');
  return `<div class="sec-title">ПОСЛЕДНИЕ 5 ТЕМ И РЕЗУЛЬТАТ</div><div style="background:#FFFFFF;border:1px solid #ECE5DB;border-radius:12px;padding:0 14px;">${rows}</div>`;
}

function pdfRecordingsCard(model){
  if(!model.recordings.length) return '';
  const origin = (typeof location!=='undefined' && location.origin) ? location.origin : '';
  const cards = model.recordings.map(r=>{
    const url = origin + '/api/recording?token=' + encodeURIComponent(r.take.publicToken||'');
    const svg = r.take.publicToken ? pdfQrSvg(url) : '';
    const metaParts = [pdfFmtDateFull(r.lessonDate)];
    if(r.take.durationSec) metaParts.push(pdfDurationStr(r.take.durationSec));
    else if(r.take.meta) metaParts.push(r.take.meta);
    return `<div style="background:#2A2622;border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;">
      <div style="width:62px;height:62px;border-radius:6px;background:#fff;flex-shrink:0;overflow:hidden;">${svg}</div>
      <div style="min-width:0;">
        <div style="font-size:11.5px;font-weight:700;color:#F2EDE5;">${pdfEsc(r.label)}</div>
        <div class="mono" style="font-size:9.5px;color:#A2968A;margin-top:3px;">${pdfEsc(metaParts.join(' · '))}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="sec-title" style="margin-top:0;">ЗАПИСИ ГОЛОСА</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">${cards}</div>`;
}

function pdfProblemsCard(model){
  const { open, resolved } = model.problems;
  if(!open.length && !resolved.length) return '';
  const openRow = p => `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:11px;">
      <span style="font-weight:700;">${pdfEsc(p.name)}</span>
      <span style="color:#A09488;white-space:nowrap;">${pdfEsc(p.category)} · с ${pdfEsc(p.sinceMonth)}</span>
    </div>`;
  const resolvedRow = p => `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:11px;">
      <span style="font-weight:700;color:#5C544C;">${pdfEsc(p.name)}</span>
      <span style="color:#A09488;white-space:nowrap;">${pdfEsc(p.category)} · ${pdfEsc(p.sinceMonth)}→${pdfEsc(p.toMonth)}</span>
    </div>`;
  return `<div class="sec-title">ПРОБЛЕМЫ</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
    <div style="background:#FFFFFF;border:1px solid #ECE5DB;border-radius:12px;padding:12px 14px;">
      <div style="font-size:11px;font-weight:800;color:#A8452C;margin-bottom:6px;">Открытые · ${open.length}</div>
      ${open.map(openRow).join('')}
    </div>
    <div style="background:#FFFFFF;border:1px solid #ECE5DB;border-radius:12px;padding:12px 14px;">
      <div style="font-size:11px;font-weight:800;color:#4C7A45;margin-bottom:6px;">Решённые · ${resolved.length}</div>
      ${resolved.map(resolvedRow).join('')}
    </div>
  </div>`;
}

function pdfAnamnesisCard(label, value){
  if(!value) return '';
  return `<div style="background:#F4EEE6;border-radius:10px;padding:10px 12px;">
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#A09488;font-weight:700;margin-bottom:4px;">${pdfEsc(label)}</div>
    <div style="font-size:12.5px;font-weight:700;">${pdfEsc(value)}</div>
  </div>`;
}

function pdfMedicalSection(model){
  const cards = [
    pdfGenCard('Диагноз', model.diagnosis),
    pdfGenCard('Курение', model.smoking),
    pdfGenCard('ПМС-фактор', model.pmsFactor)
  ].join('');
  const considerations = (model.lessonConsiderations||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const considerCard = considerations.length ? `<div style="background:#FFFFFF;border:1px solid #ECE5DB;border-radius:12px;padding:12px 14px;margin-top:10px;">
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#A09488;font-weight:700;margin-bottom:6px;">ЧТО УЧИТЫВАТЬ НА УРОКЕ</div>
    ${considerations.map(c=>`<div style="font-size:12px;margin-top:4px;">— ${pdfEsc(c)}</div>`).join('')}
  </div>` : '';
  if(!cards && !considerCard) return '';
  return `<div style="border-top:1px solid #E4DCD1;margin-top:26px;padding-top:18px;">
    <div style="font-size:20px;font-weight:800;margin-bottom:12px;">Медицинское и чувствительное</div>
    ${cards ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">${cards}</div>` : ''}
    ${considerCard}
  </div>`;
}

function pdfAnamnesisSection(model){
  const cards = [
    pdfAnamnesisCard('Длительность симптомов', model.symptomDuration),
    pdfAnamnesisCard('ЛОР / фониатр', model.larStatus),
    pdfAnamnesisCard('Нагрузка вне пения', model.vocalLoadJob),
    pdfAnamnesisCard('Гидратация', model.hydration),
    pdfAnamnesisCard('Сон', model.sleep)
  ].join('');
  if(!cards) return '';
  return `<div class="sec-title">ГОЛОСОВОЙ АНАМНЕЗ</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">${cards}</div>`;
}

function pdfArtBadgeFontSize(code){
  const len = (code||'').length;
  if(len<=1) return 14;
  if(len<=3) return 10;
  return 8;
}

function pdfArticulatoryBox(label, value, color){
  return `<div style="background:#F4EEE6;border-radius:7px;padding:5px 7px;flex:1;min-width:0;">
    <div style="font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:${color};font-weight:700;margin-bottom:2px;">${label}</div>
    <div style="font-size:10px;color:#23201D;">${pdfEsc(value || '—')}</div>
  </div>`;
}

function pdfArticulatoryCard(item){
  const methodsRows = item.methods.map(m=>{
    const pill = m.mark==='ok'
      ? '<span style="display:inline-block;background:#EFF5EE;color:#4C7A45;font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px;flex-shrink:0;">помогло</span>'
      : m.mark==='fail'
        ? '<span style="display:inline-block;background:#F1E7E3;color:#A8452C;font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px;flex-shrink:0;">не сработало</span>'
        : '<span style="display:inline-block;background:#F6EFE2;color:#9A6A1F;font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px;flex-shrink:0;">в работе</span>';
    return `<div class="pdf-row" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #F0EAE1;font-size:10.5px;">
      <span style="font-weight:700;">${pdfEsc(m.name)}</span>
      ${pill}
    </div>`;
  }).join('');

  const noteHtml = item.typeNote ? `<div style="background:#F4EEE6;border-left:2px solid #A8452C;border-radius:0 6px 6px 0;padding:5px 8px;font-size:10.5px;">${pdfEsc(item.typeNote)}</div>` : '';

  return `<div style="background:#FFFFFF;border:1px solid #ECE5DB;border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;">
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="width:30px;height:30px;border-radius:50%;background:#8E3324;color:#fff;font-weight:800;letter-spacing:-0.03em;display:flex;align-items:center;justify-content:center;flex-shrink:0;white-space:nowrap;line-height:1;font-size:${pdfArtBadgeFontSize(item.badge)}px;">${pdfEsc(item.badge)}</div>
      <div style="min-width:0;">
        <div style="font-size:12px;font-weight:800;">${pdfEsc(item.defectName)}</div>
        <div style="font-size:10px;color:#8A7E74;">${pdfEsc(item.typeName)}</div>
      </div>
    </div>
    ${noteHtml}
    <div>
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#A09488;font-weight:700;margin-bottom:2px;">МЕТОДЫ ПОСТАНОВКИ</div>
      <div class="pdf-art-methods">${methodsRows}</div>
    </div>
    <div style="display:flex;gap:6px;">
      ${pdfArticulatoryBox('ЧТО ДЕЛАЛИ', item.tried, '#A09488')}
      ${pdfArticulatoryBox('ЧТО ПОМОГЛО', item.helped, '#4C7A45')}
      ${pdfArticulatoryBox('ЧТО НЕ СРАБОТАЛО', item.nowork, '#A8452C')}
    </div>
  </div>`;
}

function pdfArticulatorySection(model){
  if(!model.articulatory.length) return '';
  const cards = model.articulatory.map(pdfArticulatoryCard).join('');
  return `<div class="sec-title" style="margin-top:14px;margin-bottom:8px;">АРТИКУЛЯЦИОННЫЕ ОСОБЕННОСТИ</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start;">${cards}</div>`;
}

function pdfFooter(model, pageLabel){
  return `<div style="position:absolute;left:56px;right:56px;bottom:40px;border-top:1px solid #E4DCD1;padding-top:10px;display:flex;justify-content:space-between;font-size:9.5px;color:#8A7E74;">
    <div>Дата печати: ${pdfEsc(model.printDate)}</div>
    <div class="mono">${pageLabel}</div>
  </div>`;
}

function pdfPrintPage1(model){
  const genCards = [
    pdfGenCard('Возраст', model.age),
    pdfGenCard('Тип голоса на слух', model.voiceType, 'оценка педагога'),
    pdfGenCard('Цель обучения', model.goal),
    pdfGenCard('Жанр и референсы', model.genres, model.genreRefs),
    pdfGenCard('Опыт пения', model.experienceLevel, model.priorExperience, 2)
  ].join('') + pdfGenCard('Цель, с которой работаем сейчас', model.currentFocus, null, 3);

  const badge = (model.packageLeft!=null && model.packageLeft<=1)
    ? `<div style="display:inline-block;margin-top:8px;background:#F1E7E3;color:#A8452C;font-size:10.5px;font-weight:800;border-radius:6px;padding:5px 10px;">Абонемент заканчивается: осталось ${model.packageLeft} ${pluralRu(model.packageLeft, ['занятие','занятия','занятий'])}</div>`
    : '';

  return `<div class="pdf-page">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #E4DCD1;padding-bottom:20px;">
      <div>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#A8452C;font-weight:800;">КАРТОЧКА УЧЕНИКА · ПЕРЕДАЧА</div>
        <div style="font-size:32px;font-weight:800;margin-top:6px;">${pdfEsc(model.name)}</div>
        <div class="mono" style="font-size:11px;color:#8A7E74;margin-top:8px;">${pdfEsc(lessonsLabel(model.lessonsCount))} пройдено</div>
        ${badge}
      </div>
      <div style="text-align:right;font-size:11.5px;color:#23201D;flex-shrink:0;">
        <div style="font-weight:800;">Николай Септ</div>
        <div style="color:#8A7E74;">преподаватель</div>
        <div style="color:#8A7E74;">+7 904 474-87-13 · @nikolaisept</div>
      </div>
    </div>

    <div class="sec-title" style="margin-top:20px;">ОБЩЕЕ</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">${genCards}</div>

    ${pdfSongsCard(model.songs)}
    ${pdfTopicsCard(model.topics)}
    ${pdfFooter(model, '1 / 2')}
  </div>`;
}

function pdfPrintPage2(model){
  return `<div class="pdf-page">
    ${pdfRecordingsCard(model)}
    ${pdfProblemsCard(model)}
    ${pdfArticulatorySection(model)}
    ${pdfMedicalSection(model)}
    ${pdfAnamnesisSection(model)}
    ${pdfFooter(model, '2 / 2')}
  </div>`;
}

function pdfRenderPrint(model){
  model.printDate = pdfFmtDateFull(new Date().toISOString().slice(0,10));
  const css = `
    @page { size: A4; margin: 0; }
    *{box-sizing:border-box;}
    body{margin:0;background:#FBF8F3;font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#23201D;}
    .mono{font-family:'JetBrains Mono',monospace;}
    .pdf-page{width:794px;min-height:1123px;padding:52px 56px 40px;position:relative;page-break-after:always;}
    .pdf-page:last-child{page-break-after:auto;}
    .sec-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:#A09488;margin:20px 0 8px;}
    .pdf-row:last-child{border-bottom:none !important;}
    @media print { body{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
    @media screen { body{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0;} .pdf-page{box-shadow:0 4px 24px rgba(0,0,0,.12);} }
  `;
  return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${pdfEsc(model.name)} — карточка ученика</title><style>${css}</style></head><body>
  ${pdfPrintPage1(model)}
  ${pdfPrintPage2(model)}
  </body></html>`;
}

// Close an open Справочник dropdown (Цель обучения / Жанр / Возраст /
// Тип голоса на слух / Жалобы / any future field using this component)
// on any click outside it.
document.addEventListener('click', ()=>{
  if(!state.kabinetDictDD.openKey) return;
  state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
  if(state.pdfPreview){ pdfRenderOverlay(); return; }
  const s = state.data.students.find(x=>x.id===state.activeStudentId);
  if(!s) return;
  if(state.activeTab==='profile') paintKabinet(s);
  else if(state.activeTab==='card') paintDiary(s);
});

render();
syncStudentsFromServer();
</script>
</body>
</html>
