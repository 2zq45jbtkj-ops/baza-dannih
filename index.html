<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>База данных — Лаборатория звука</title>
<style>
:root{
  --terracotta:#AE5F3F; --terracotta-light:#D6A289; --terracotta-dark:#8A3324; --terracotta-bg:#FBF1EC;
  --blue:#6C91A6; --blue-light:#B8CCD9; --blue-bg:#EAF1F5;
  --cream:#F2ECE7; --ink:#2E2A27; --muted:#8A8078; --line:#E4E0DA; --white:#FFFFFF;
  --bg:var(--cream); --panel:#fff; --text:var(--ink);
  --lvlA:#AE5F3F; --lvlB:#6C91A6; --lvlC:#C9A227; --lvlD:#7A6C9E;
}
body.dark{
  --bg:#1C1A18; --panel:#26221F; --text:#EFE9E3; --line:#3A342F; --muted:#9C9188;
  --cream:#242019; --terracotta-bg:#3A2620; --blue-bg:#20303A;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
.app{display:flex;min-height:100vh;}
.sidebar{width:288px;background:var(--panel);border-right:1px solid var(--line);flex-shrink:0;padding:20px 0;display:flex;flex-direction:column;min-width:210px;max-width:520px;overflow-y:auto;}
.theme-toggle{border:1px solid var(--line);background:var(--bg);border-radius:20px;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;}
.sidebar-search{padding:0 20px 14px;margin-bottom:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sidebar-search input{flex:1;min-width:0;box-sizing:border-box;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;color:var(--text);font-family:inherit;}
.sidebar-search input::placeholder{color:#B8ADA1;}
.sidebar-search input:focus{outline:2px solid #E4C9BE;outline-offset:0;}
.search-meta{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;font-size:12px;color:var(--muted);min-height:16px;flex-shrink:0;}
.search-meta button{border:none;background:none;color:#A8452C;font-size:12px;font-weight:700;cursor:pointer;padding:0;}
.search-meta button:hover{text-decoration:underline;}
.no-students{padding:18px 20px;font-size:13px;color:var(--muted);line-height:1.5;}
.student-list{padding:0 10px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.student-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;}
.student-item:hover{background:var(--bg);}
.student-item.active{background:#EDE3D8;border-color:#E0D2C2;}
.student-item.active .s-name{color:var(--ink);}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.s-name{font-size:15px;font-weight:700;}
.s-status{font-size:12.5px;font-weight:600;color:#9A8E82;}
.s-status.status-color-active{color:#6E8C6A;}
.s-status.status-color-paused{color:#9A8E82;}
.s-status.status-color-trial{color:#C96B5C;}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;}
.dot-active{background:#6FA36F;} .dot-trial{background:var(--blue);} .dot-paused{background:#C7BDB2;}
.add-student-btn{margin:12px 10px 0;width:calc(100% - 20px);padding:10px;border-radius:10px;border:1px dashed var(--terracotta);background:none;color:var(--terracotta-dark);font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;}
.add-student-btn:hover{background:var(--terracotta-bg);}
.resizer{flex:none;width:6px;margin-left:-3px;margin-right:-3px;cursor:col-resize;position:relative;z-index:5;background:transparent;}
.resizer:hover, .resizer:active{background:rgba(168,69,44,0.12);}
.main{flex:1;padding:26px 32px;max-width:1160px;min-width:0;}
.chip{padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);}
.chip.status-active{background:#EAF3EA;color:#3E6B3E;border-color:#CFE4CF;}
.chip.status-trial{background:var(--blue-bg);color:var(--blue);border-color:#D3E2E9;}
.chip.status-paused{background:var(--cream);color:var(--muted);border-color:var(--line);}
.chip.flag{background:var(--terracotta-bg);color:var(--terracotta-dark);border-color:#EFD4C6;}
.editable{cursor:pointer;} .editable:hover{outline:1px dashed var(--terracotta-light);outline-offset:2px;}
.student-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px;}
.student-header-eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A8452C;}
.student-header-name{margin:6px 0 0;font-size:40px;font-weight:800;letter-spacing:-.025em;cursor:pointer;}
.student-header-name:hover{outline:1px dashed var(--terracotta-light);outline-offset:4px;}
.student-header-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.pill-select-wrap{position:relative;display:inline-flex;align-items:center;border-radius:999px;}
.pill-select{appearance:none;-webkit-appearance:none;-moz-appearance:none;border:none;border-radius:999px;padding:8px 28px 8px 15px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;color:inherit;background:transparent;}
.pill-select-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:11px;color:inherit;opacity:.75;}
.status-pill-active{background:#E6F0E3;color:#4E7047;}
.status-pill-trial{background:#F7E3DD;color:#A8452C;}
.status-pill-paused{background:#EFEAE3;color:#8A8078;}
.schedule-pill{background:var(--panel);border:1px solid var(--line);color:var(--text);}
.schedule-pill .pill-select{font-weight:600;}
.save-fab{width:37px;height:37px;border-radius:50%;border:none;background:#A8452C;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;transition:background .15s;}
.save-fab:hover{background:#8E3721;}
.save-fab.saved{background:#4E7047;}
.tabs-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tabs-row .tabs{margin-bottom:0;border-bottom:none;}
.collapse-toggle-btn{margin-left:auto;align-self:center;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
.collapse-toggle-btn:hover{background:var(--bg);}
.intake-placeholder{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;}
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);}
.tab{padding:10px 16px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--terracotta-dark);border-bottom-color:var(--terracotta);}
.section{margin-bottom:26px;}
.section-title{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px;}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.field{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:4px;}
.field select{width:100%;border:none;background:none;font-size:14.5px;font-weight:600;color:var(--text);font-family:inherit;padding:0;appearance:none;cursor:pointer;}
.field select:focus{outline:none;}
.tag-group{margin-bottom:16px;} .tag-group-title{font-size:13.5px;font-weight:600;margin-bottom:8px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.tag{padding:7px 13px;border-radius:20px;font-size:13px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);}
.tag.selected{background:var(--terracotta);color:#fff;border-color:var(--terracotta);}
.admin-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:12px;}
.variant-switcher{display:flex;gap:6px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;}
.variant-btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;}
.variant-btn.active{background:var(--terracotta);color:#fff;}
.level-switcher{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.level-btn{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:6px;}
.level-btn.active{color:#fff;border-color:transparent;}
.level-btn .lvl-swatch{width:9px;height:9px;border-radius:50%;display:inline-block;}
.level-btn .lvl-count{font-weight:400;opacity:.8;}
.date-bar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:20px;flex-wrap:wrap;}
.date-bar .cur-date{font-size:13.5px;font-weight:600;} .date-bar .prev-date{font-size:12.5px;color:var(--muted);}
.pin-btn{margin-left:auto;padding:9px 16px;border-radius:10px;border:none;background:var(--terracotta);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}

.add-topic-wrap{position:relative;margin-bottom:18px;}
.add-topic-plus{width:38px;height:38px;border-radius:50%;border:none;background:var(--terracotta-dark);color:#fff;font-size:19px;font-weight:700;cursor:pointer;line-height:1;}
.add-topic-label{font-size:13px;color:var(--muted);margin-left:10px;}
.topic-popover{position:absolute;top:46px;left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,0.12);padding:14px;width:340px;max-width:90vw;}
.topic-popover-title{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:8px;}
.topic-pick-list{max-height:220px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.topic-pick-item{padding:6px 11px;border-radius:16px;font-size:12.5px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--text);}
.topic-pick-item:hover{border-color:var(--terracotta);background:var(--terracotta-bg);}
.topic-pick-empty{font-size:12.5px;color:var(--muted);font-style:italic;padding:4px 0 10px;}
.custom-topic-row{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px;}
.custom-topic-input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);}
.custom-topic-btn{padding:8px 12px;border-radius:8px;border:none;background:var(--terracotta);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.no-topics-note{font-size:13px;color:var(--muted);padding:8px 0;}

.topic-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.topic-row:last-child{border-bottom:none;}
.topic-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.topic-name{flex:1;font-size:13.5px;font-weight:600;cursor:pointer;}
.topic-score{font-size:14px;font-weight:700;min-width:34px;text-align:right;cursor:pointer;}
.topic-score.low{color:var(--terracotta-dark);} .topic-score.high{color:var(--blue);} .topic-score.none{color:var(--muted);font-weight:400;}
.topic-delta{font-size:11.5px;margin-left:2px;font-weight:600;}
.topic-delta.up{color:#3E6B3E;} .topic-delta.down{color:var(--terracotta-dark);}
.topic-remove{color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;flex-shrink:0;}
.topic-remove:hover{color:var(--terracotta-dark);}
.score-input{width:44px;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;text-align:center;font-family:inherit;background:var(--panel);color:var(--text);flex-shrink:0;-moz-appearance:textfield;}
.score-input::-webkit-outer-spin-button,.score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.score-input.low{color:var(--terracotta-dark);border-color:var(--terracotta-light);}
.score-input.high{color:var(--blue);border-color:var(--blue-light);}
.score-input.none{color:var(--muted);}
.score-input:focus{outline:none;border-color:var(--terracotta);}
.wheel-compare-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap;}
.legend-swatch{display:inline-flex;align-items:center;gap:5px;}
.legend-line{width:16px;height:0;border-top:2px solid var(--terracotta);display:inline-block;}
.legend-line.dashed{border-top:2px dashed var(--muted);}
.level-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 4px;flex-wrap:wrap;}
.bullet-row{margin-bottom:14px;}
.bullet-head{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;margin-bottom:6px;gap:8px;}
.bullet-head .bh-name{cursor:pointer;flex:1;}
.bullet-track{position:relative;background:var(--cream);border-radius:8px;height:22px;overflow:visible;cursor:pointer;}
.bullet-fill{position:absolute;top:0;left:0;bottom:0;border-radius:8px;transition:width .2s;}
.bullet-fill.none{background:var(--line) !important;}
.bullet-prev-marker{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;}
.bullet-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:3px;}
.wheel-wrap{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
.wheel-svg{flex-shrink:0;}
.wheel-legend{flex:1;min-width:280px;max-height:680px;overflow-y:auto;padding-right:6px;}
.srez-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.srez-card.compared{border-color:var(--terracotta);box-shadow:0 0 0 2px var(--terracotta-bg);}
.srez-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.srez-date{font-size:13px;color:var(--text);font-weight:700;}
.srez-actions{display:flex;gap:6px;flex-wrap:wrap;}
.srez-action-btn{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;}
.srez-action-btn.compare-active{background:var(--terracotta);color:#fff;border-color:var(--terracotta);}
.srez-action-btn.danger:hover{border-color:var(--terracotta-dark);color:var(--terracotta-dark);}
.srez-scores{display:flex;flex-wrap:wrap;gap:10px;}
.srez-score-pill{background:var(--cream);border-radius:8px;padding:5px 10px;font-size:12.5px;}
.srez-score-pill b{color:var(--terracotta-dark);}
.rep-block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.rep-block h4{margin:0 0 8px;font-size:14px;}
.song-list{list-style:none;padding:0;margin:0;}
.song-list li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;}
.song-list li:last-child{border-bottom:none;}
textarea.rep-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:14px;min-height:60px;resize:vertical;background:var(--panel);color:var(--text);}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}

/* ---------- CARD TAB (anamnesis + lessons) ---------- */
.card-loading{padding:30px 0;color:var(--muted);font-size:13.5px;}
.intake-empty{padding:14px 16px;background:var(--terracotta-bg);border-radius:12px;color:var(--terracotta-dark);font-size:13px;margin-bottom:16px;}
.card-error{padding:14px 16px;background:#FBEAEA;border:1px solid #EFC9C9;border-radius:12px;color:#A33A3A;font-size:13px;margin-bottom:16px;}
.btn{padding:9px 16px;border-radius:8px;border:none;background:var(--terracotta);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;}
.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);}
.btn:disabled{opacity:.55;cursor:default;}

/* ---------- KABINET (anketa accordion) ---------- */
.kb-loading{padding:30px 0;color:var(--muted);font-size:13.5px;}
.kb-wrap{display:flex;flex-direction:column;gap:34px;}
.kb-summary{display:flex;align-items:center;gap:16px;background:#EDE3D8;border:1px solid #E0D2C2;border-radius:16px;padding:16px 19px;flex-wrap:wrap;}
body.dark .kb-summary{background:#3A2F26;border-color:#4A3B2E;}
.kb-summary-title{font-size:14.5px;font-weight:800;}
.kb-summary-desc{font-size:13px;color:#7A6E62;margin-top:3px;line-height:1.45;}
body.dark .kb-summary-desc{color:#B8ADA1;}
.kb-summary-btn{padding:12px 22px;border:none;border-radius:11px;background:var(--terracotta-dark);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.kb-summary-btn:hover{background:#7A2C1D;}
.kb-sec-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.kb-sec-toggle{display:flex;align-items:center;gap:9px;border:none;background:none;padding:0;cursor:pointer;color:#A09488;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
.kb-chevron{width:20px;height:20px;border-radius:6px;background:var(--bg);color:#8A8076;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
.kb-sec-hint{font-size:12.5px;color:#B8ADA1;}
.kb-sec-actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.kb-ghost-btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
.kb-ghost-btn:hover{background:var(--bg);}
.kb-ghost-btn.active{background:#2C2724;border-color:#2C2724;color:#F7F2EB;}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:10px;}
.kb-grid-row3{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:10px;}
.kb-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;}
.kb-card.span2{grid-column:span 2;}
.kb-card label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A09488;margin-bottom:5px;}
.kb-card-note{font-size:12px;color:var(--muted);margin-top:3px;}
.kb-multi-field{position:relative;}
.kb-dict-wrap{position:relative;}
.kb-multi-trigger{width:100%;min-height:26px;border:none;background:none;padding:0;font-family:inherit;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;}
.kb-multi-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0;}
.kb-multi-chip-tag{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text);line-height:1.3;}
.kb-multi-placeholder{font-size:16px;font-weight:400;color:#B8ADA1;}
.kb-multi-caret{font-size:10px;color:var(--muted);flex-shrink:0;margin-top:4px;}
.kb-dict-dropdown{position:absolute;left:8px;right:8px;min-width:150px;top:100%;z-index:30;margin-top:6px;background:#fff;border:1px solid #E4DCD1;border-radius:12px;box-shadow:0 12px 28px rgba(35,32,29,0.16);padding:6px;display:flex;flex-direction:column;}
.kb-dict-chip-grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;max-height:308px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding:2px 10px 4px 2px;}
.kb-dict-divider{height:1px;background:#EFE7DC;margin:6px 4px;flex:none;}
.kb-chip-item{display:inline-flex;align-items:stretch;flex:none;border-radius:999px;background:transparent;border:1px solid #E4DCD1;overflow:hidden;}
.kb-chip-item.selected{background:#F1EDE5;border-color:#D9CFC2;}
.kb-chip-select{padding:7px 12px;border:none;background:none;cursor:pointer;font-size:13.5px;font-weight:600;color:#23201D;white-space:nowrap;font-family:inherit;}
.kb-chip-item.selected .kb-chip-select{font-weight:700;}
.kb-chip-pin,.kb-chip-del{border:none;border-left:1px solid #E4DCD1;background:none;cursor:pointer;font-size:12px;padding:0 8px;white-space:nowrap;font-family:inherit;}
.kb-chip-pin{color:#A8452C;}
.kb-chip-del{color:#C0B4A6;}
.kb-dict-confirm{flex-basis:100%;padding:8px 10px;background:#F6EAE5;border-radius:9px;}
.kb-select,.kb-input,.kb-textarea{width:100%;border:none;background:none;font-size:16px;font-weight:600;color:var(--text);font-family:inherit;padding:0;appearance:none;cursor:pointer;}
.kb-input,.kb-textarea{cursor:text;}
.kb-textarea{resize:vertical;min-height:44px;line-height:1.45;}
.kb-select:focus,.kb-input:focus,.kb-textarea:focus{outline:none;}

   of viewport width. Scoped to coarse-pointer (touch) devices only, so

@media (pointer: coarse) {

}
/* Native <input type="date"> (Dnevnik zanyatiy "Дата" field) ships its own

   Resetting -webkit-appearance/appearance to none strips that native sizing
   without touching the calendar-picker-indicator icon or the native picker
   dropdown itself, which stay fully functional. */
input[type="date"] {
  -webkit-appearance: none;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.variant==='dial') parsed.variant='wheel';
      parsed.students.forEach(s=>{
        (s.srezy||[]).forEach(sr=>{ if(!sr.id) sr.id = nextSrezId(); });
      });
      return parsed;
    }
  }catch(e){}
  return defaultData();
}

function pluralRu(n, forms){
  const mod10 = n%10, mod100 = n%100;
  if(mod10===1 && mod100!==11) return forms[0];
  if(mod10>=2 && mod10<=4 && !(mod100>=12 && mod100<=14)) return forms[1];
  return forms[2];
}
function lessonsLabel(n){ return n + ' ' + pluralRu(n, ['занятие','занятия','занятий']); }
function invalidateLessonCount(s){
  // Badge count is fetched once and cached; call this after any lesson
  // add/delete so the sidebar and card-header counts stay in sync with
  // the actual rows instead of showing a stale number until page reload.
  delete state.lessonCounts[s.id];
  ensureLessonCounts();
}
function ensureLessonCounts(){
  state.data.students.forEach(s=>{
    if(state.lessonCounts[s.id]!==undefined) return;
    state.lessonCounts[s.id] = null;
    fetch('/api/lessons?studentId=' + encodeURIComponent(s.id))
      .then(r=> r.ok ? r.json() : Promise.reject(new Error('http '+r.status)))
      .then(data=>{
        state.lessonCounts[s.id] = (data.lessons||[]).length;
        renderStudentList();
        if(state.activeStudentId===s.id){
          const eyebrow = document.getElementById('studentEyebrow');
          if(eyebrow) eyebrow.textContent = 'Карточка ученика · ' + lessonsLabel(state.lessonCounts[s.id]);
        }
      })
      .catch(()=>{ delete state.lessonCounts[s.id]; });
  });
}

function scoreClass(score){ if(score===null||score===undefined) return 'none'; return score<5 ? 'low' : 'high'; }
function scoreColor(score){ if(score===null||score===undefined) return '#C7BFB6'; return score<5 ? '#AE5F3F' : '#6C91A6'; }
function lastSrez(s){ return s.srezy.length ? s.srezy[s.srezy.length-1] : null; }
function prevScoreFor(s, name){ const prev = lastSrez(s); if(!prev) return null; const t = prev.topics.find(x=>x.name===name); return t ? t.score : null; }
function topicsForLevel(s, level){
  if(level==='ALL') return s.topics.slice().sort((a,b)=> LEVEL_ORDER.indexOf(a.level)-LEVEL_ORDER.indexOf(b.level));
  return s.topics.filter(t=>t.level===level);
}
function availableToAdd(s, level){
  const added = new Set(s.topics.filter(t=>t.level===level).map(t=>t.name));
  return catalogNames(level).filter(n=>!added.has(n));
}

      state.sidebarWidth = w;
      sidebarEl.style.width = w + 'px';
    }
    function up(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    document.addEventListener('mousemove', move);

  };

async function addStudent(){
  const name = prompt('Имя и фамилия ученика:');
  if(!name || !name.trim()) return;
  const trimmed = name.trim();
  let id = 's' + Date.now();
  try{
    const resp = await apiSend('/api/students', 'POST', { name: trimmed, status: 'trial' });
    if(resp && resp.student && resp.student.id) id = resp.student.id;
  }catch(e){
    alert('Не удалось сохранить ученика в базе данных: ' + (e.message||e) + '\nУченик добавлен только локально и пропадёт при следующей загрузке с другого устройства.');
  }
  state.data.students.push({
    id, name: trimmed, status: 'trial',
    org: { schedule:'—', format:'Онлайн', source:'Прочее', freq:'Пробное занятие' },
    voice: { type:'', vibrato:'', breathType:'', support:'', attack:'', larynx:'' },
    range: { bottom:'', top:'', tessBottom:'', tessTop:'', passaggio1:'', passaggio2:'' },
    timbre: [], problems: [], compensations: [], flags: [],
    topics: [],
    srezDate: null, srezy: [],
    repertoire: { current:'', future:[] }
  });
  state.activeStudentId = id;
  saveData(); render();
}
async function syncStudentsFromServer(){
  try{
    const data = await apiGet('/api/students');
    const serverList = (data && data.students) || [];
    if(!serverList.length) return;
    const localById = {};
    state.data.students.forEach(s=>{ localById[s.id] = s; });
    const merged = serverList.map(srv=>{
      const loc = localById[srv.id];
      if(loc){
        loc.name = srv.name;
        loc.status = srv.status;
        if(srv.schedule){ loc.org.freq = srv.schedule; }
        return loc;
      }
      return {
        id: srv.id, name: srv.name, status: srv.status,
        org: { schedule:'—', format:'Онлайн', source:'Прочее', freq: srv.schedule || 'Пробное занятие' },
        voice: { type:'', vibrato:'', breathType:'', support:'', attack:'', larynx:'' },
        range: { bottom:'', top:'', tessBottom:'', tessTop:'', passaggio1:'', passaggio2:'' },
        timbre: [], problems: [], compensations: [], flags: [],
        topics: [], srezDate: null, srezy: [],
        repertoire: { current:'', future:[] }
      };
    });
    state.data.students = merged;
    if(!state.activeStudentId || !merged.find(s=>s.id===state.activeStudentId)){
      state.activeStudentId = merged[0] ? merged[0].id : null;
    }
    state.lessonCounts = {};
    saveData();
    render();
  }catch(e){
    // БД не подключена или недоступна — остаёмся на локальных/дефолтных данных
  }
}

  const [group, key] = fieldKey.split('-');

    .concat(options.map(o=>`<option value="${o}" ${o===value?'selected':''}>${o}</option>`));
  return `<div class="field"><label>${label}</label><select data-field="${group}|${key}">${opts.join('')}</select></div>`;
}
function textField(label, value, fieldKey){
  const [group, key] = fieldKey.split('-');
  return `<div class="field editable" data-text-field="${group}|${key}" data-label="${label}">
    <label>${label}</label><div>${value || '<span style="color:var(--muted);font-weight:400;">— не указано —</span>'}</div></div>`;
}
function renderTags(options, selected){
  return options.map(o=>`<span class="tag ${selected.includes(o)?'selected':''}" data-val="${o}">${o}</span>`).join('');
}

/* ---------- SREZY TAB ---------- */
function renderSrezy(s){
  const c = document.getElementById('tabContent');
  const prev = lastSrez(s);
  const levelTopics = topicsForLevel(s, state.activeLevel);
  const isAll = state.activeLevel==='ALL';
  const comparedSrezy = s.srezy.filter(sr=>state.compareIds.includes(sr.id));

  let html = `
    <div class="variant-switcher">
      <button class="variant-btn ${state.data.variant==='wheel'?'active':''}" data-v="wheel">Вариант 1 · Колесо</button>
      <button class="variant-btn ${state.data.variant==='scale'?'active':''}" data-v="scale">Вариант 2 · Шкалы</button>
    </div>

    <div class="level-switcher">
      ${LEVEL_ORDER.map(lvl=>{
        const cnt = topicsForLevel(s, lvl).length;
        return `<button class="level-btn ${state.activeLevel===lvl?'active':''}" data-lvl="${lvl}" style="${state.activeLevel===lvl?`background:${LEVEL_COLORS[lvl]};`:''}">
          <span class="lvl-swatch" style="background:${LEVEL_COLORS[lvl]}"></span>${LEVEL_LABELS[lvl]}<span class="lvl-count">(${cnt})</span>
        </button>`;
      }).join('')}
      <button class="level-btn ${isAll?'active':''}" data-lvl="ALL" style="${isAll?'background:var(--terracotta-dark);':''}">
        🔘 Все темы<span class="lvl-count">(${s.topics.length})</span>
      </button>
    </div>

    <div class="date-bar">
      <div>
        <div class="cur-date">Текущий срез: ${s.srezDate ? s.srezDate : '<span style="color:var(--muted);font-weight:400;">дата не закреплена</span>'}</div>
        ${comparedSrezy.length ? `<div class="prev-date">В сравнении: ${comparedSrezy.map(x=>x.date).join(', ')}</div>`
          : (prev ? `<div class="prev-date">Автосравнение с предыдущим срезом от ${prev.date}</div>` : `<div class="prev-date">Предыдущих срезов ещё нет — это будет первая точка отсчёта</div>`)}
      </div>
      <button class="pin-btn" id="pinDateBtn">📌 Закрепить сегодняшнюю дату как срез</button>
    </div>
  `;

  if(!isAll){
    html += renderAddTopicWidget(s, state.activeLevel);
  }

  if(levelTopics.length===0 && !isAll){
    html += `<div class="admin-note">В этом уровне пока нет добавленных тем — нажми «+» выше и выбери или впиши тему.</div>`;
  } else if(levelTopics.length===0 && isAll){
    html += `<div class="admin-note">Пока ни одна тема не добавлена ни в одном уровне.</div>`;
  } else {
    const compareList = comparedSrezy.length ? comparedSrezy : (prev ? [prev] : []);
    const autoMode = comparedSrezy.length===0; // single-dashed auto style when no explicit compare selected
    if(state.data.variant==='wheel') html += renderVariantWheel(s, compareList, levelTopics, isAll, autoMode);
    else html += renderVariantScale(s, compareList, levelTopics, isAll, autoMode);
  }

  html += `
    <div class="section" style="margin-top:30px;">
      <div class="section-title">История срезов</div>
      ${s.srezy.length===0
        ? `<div class="admin-note">Срезов пока нет. Нажми «Закрепить сегодняшнюю дату как срез» выше, когда проведёшь диагностику.</div>`
        : s.srezy.slice().reverse().map(srez=>{
          const isCompared = state.compareIds.includes(srez.id);
          return `
          <div class="srez-card ${isCompared?'compared':''}">
            <div class="srez-top">
              <div class="srez-date">${srez.date}</div>
              <div class="srez-actions">
                <button class="srez-action-btn ${isCompared?'compare-active':''}" data-compare-id="${srez.id}">${isCompared?'✓ В сравнении':'Сравнить'}</button>
                <button class="srez-action-btn" data-restore-id="${srez.id}">↺ Сделать текущим</button>
                <button class="srez-action-btn danger" data-delete-id="${srez.id}">✕ Удалить</button>
              </div>
            </div>
            <div class="srez-scores">
              ${srez.topics.filter(t=> isAll ? true : t.level===state.activeLevel).map(t=>`<div class="srez-score-pill">${t.name}: <b>${t.score===null?'—':t.score}</b></div>`).join('')}
            </div>
          </div>
        `;}).join('')
      }
    </div>
  `;

  c.innerHTML = html;

  c.querySelectorAll('.variant-btn').forEach(el=>{
    el.onclick = ()=>{ state.data.variant = el.dataset.v; state.openSliderTopicIndex=null; saveData(); renderSrezy(s); };
  });
  c.querySelectorAll('.level-btn').forEach(el=>{
    el.onclick = ()=>{ state.activeLevel = el.dataset.lvl; state.openSliderTopicIndex=null; state.topicPickerOpen=false; state.compareIds=[]; renderSrezy(s); };
  });
  document.getElementById('pinDateBtn').onclick = ()=>{
    const today = new Date().toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric'});
    s.srezDate = today;
    s.srezy.push({ id: nextSrezId(), date: today, topics: JSON.parse(JSON.stringify(s.topics)) });
    saveData(); renderSrezy(s);
  };

  c.querySelectorAll('[data-compare-id]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.compareId;
      const idx = state.compareIds.indexOf(id);
      if(idx>-1) state.compareIds.splice(idx,1); else state.compareIds.push(id);
      renderSrezy(s);
    };
  });
  c.querySelectorAll('[data-restore-id]').forEach(el=>{
    el.onclick = ()=>{
      const srez = s.srezy.find(x=>x.id===el.dataset.restoreId);
      if(!srez) return;
      if(!confirm(`Сделать значения из среза ${srez.date} текущими? Текущие оценки будут перезаписаны для совпадающих тем.`)) return;
      srez.topics.forEach(st=>{
        const cur = s.topics.find(t=>t.name===st.name && t.level===st.level);
        if(cur) cur.score = st.score;
      });
      saveData(); renderSrezy(s);
    };
  });
  c.querySelectorAll('[data-delete-id]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.deleteId;
      const srez = s.srezy.find(x=>x.id===id);
      if(!srez) return;
      if(!confirm(`Удалить срез от ${srez.date} из истории? Это действие необратимо.`)) return;
      s.srezy = s.srezy.filter(x=>x.id!==id);
      state.compareIds = state.compareIds.filter(cid=>cid!==id);
      saveData(); renderSrezy(s);
    };
  });

  attachTopicPickerHandlers(s, c);
  attachHandlers(s, c, levelTopics);
}

function attachTopicPickerHandlers(s, c){
  const plusBtn = document.getElementById('addTopicPlus');
  if(plusBtn){
    plusBtn.onclick = ()=>{ state.topicPickerOpen = !state.topicPickerOpen; renderSrezy(s); };
  }
  c.querySelectorAll('[data-pick-name]').forEach(el=>{
    el.onclick = ()=>{
      s.topics.push({name: el.dataset.pickName, level: state.activeLevel, score:null});
      state.topicPickerOpen = false;
      saveData(); renderSrezy(s);
    };
  });
  const customBtn = document.getElementById('customTopicBtn');
  if(customBtn){
    customBtn.onclick = ()=>{
      const input = document.getElementById('customTopicInput');
      const name = input.value.trim();
      if(!name) return;
      if(s.topics.some(t=>t.name===name && t.level===state.activeLevel)){
        alert('Такая тема уже добавлена в этот уровень.');
        return;
      }
      s.topics.push({name, level: state.activeLevel, score:null});
      state.topicPickerOpen = false;
      saveData(); renderSrezy(s);
    };
  }
}

function attachHandlers(s, c, levelTopics){
  c.querySelectorAll('[data-topic-remove]').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      const i = parseInt(el.dataset.topicRemove);
      const topic = levelTopics[i];
      const idx = s.topics.findIndex(t=>t.name===topic.name && t.level===topic.level);
      if(idx>-1) s.topics.splice(idx,1);
      saveData(); renderSrezy(s);
    };
  });
  c.querySelectorAll('[data-num-i]').forEach(el=>{
    el.onchange = ()=>{
      const i = parseInt(el.dataset.numI);
      let v = parseInt(el.value);
      if(isNaN(v)) v = 0;
      v = Math.max(0, Math.min(10, v));
      levelTopics[i].score = v;
      saveData(); renderSrezy(s);
    };
  });
}

function scoreInput(i, score){

  const cls = scoreClass(score);
  return `<input type="number" min="0" max="10" step="1" class="score-input ${cls}" data-num-i="${i}" value="${val}" placeholder="—">`;

/* ---- Variant "wheel" — compareList: array of {date, topics} to overlay ---- */
function renderVariantWheel(s, compareList, levelTopics, isAll, autoMode){
  const title = isAll ? 'Большое колесо — все добавленные темы' : `Колесо баланса — ${LEVEL_LABELS[state.activeLevel]}`;
  return `
    <div class="section">
      <div class="section-title">${title}</div>
      ${isAll ? `<div class="level-legend">${LEVEL_ORDER.map(l=>`<span class="legend-swatch"><span class="legend-line" style="border-top-color:${LEVEL_COLORS[l]};border-top-width:3px;"></span>${LEVEL_LABELS[l]}</span>`).join('')}</div>` : ''}
      <div class="wheel-wrap">
        <div class="wheel-svg">${renderWheelCompare(levelTopics, compareList, isAll)}</div>
        <div class="wheel-legend">
          ${levelTopics.map((t,i)=>{
            const primaryCompare = compareList[0];
            const prevScore = primaryCompare ? (primaryCompare.topics.find(x=>x.name===t.name)?.score ?? null) : null;
            const delta = (t.score!==null && prevScore!==null) ? t.score - prevScore : null;
            return `
            <div class="topic-row">
              <span class="topic-dot" style="background:${isAll ? LEVEL_COLORS[t.level] : scoreColor(t.score)}"></span>
              <span class="topic-name">${t.name}${isAll ? ` <span style="color:var(--muted);font-weight:400;">(${t.level})</span>` : ''}</span>
              ${delta!==null && delta!==0 ? `<span class="topic-delta ${delta>0?'up':'down'}">${delta>0?'▲':'▼'}${Math.abs(delta)}</span>` : ''}
              ${scoreInput(i, t.score)}
              <span class="topic-remove" data-topic-remove="${i}" title="Убрать тему из колеса">✕</span>
            </div>
          `;}).join('')}
        </div>
      </div>
      ${compareList.length ? `<div class="wheel-compare-legend">
        ${compareList.map((cs,idx)=>`<span class="legend-swatch"><span class="legend-line dashed" style="border-top-color:${COMPARE_PALETTE[idx % COMPARE_PALETTE.length]};"></span> срез ${cs.date}</span>`).join('')}
        <span class="legend-swatch"><span class="legend-line"></span> текущее состояние</span>
      </div>` : ''}
    </div>
  `;
}

function renderWheelCompare(topics, compareList, isAll){
  const n = Math.max(topics.length,1);
  const size = isAll ? Math.max(360, n*11) : 280;
  const center = size/2;
  const maxR = isAll ? Math.max(140, n*6.2) : 105;
  const maxScore = 10;
  const angleStep = (2*Math.PI)/n;
  let grid = '', labels = '', dots = '';

  for(let ring=2; ring<=maxScore; ring+=2){
    const r = (ring/maxScore)*maxR;
    grid += `<circle cx="${center}" cy="${center}" r="${r}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  topics.forEach((t,i)=>{
    const angle = -Math.PI/2 + i*angleStep;
    const ex = center + maxR*Math.cos(angle), ey = center + maxR*Math.sin(angle);
    grid += `<line x1="${center}" y1="${center}" x2="${ex}" y2="${ey}" stroke="var(--line)" stroke-width="1"/>`;
    const lx = center + (maxR+20)*Math.cos(angle), ly = center + (maxR+20)*Math.sin(angle);
    const cosA = Math.cos(angle);
    const anchor = cosA > 0.2 ? 'start' : (cosA < -0.2 ? 'end' : 'middle');
    const shortName = shortLabelFor(t);
    labels += `<text x="${lx}" y="${ly}" font-size="9" fill="${isAll?LEVEL_COLORS[t.level]:'var(--muted)'}" font-weight="${isAll?'700':'500'}" text-anchor="${anchor}" dominant-baseline="middle">${shortName}</text>`;
  });

  function pointsFor(list){
    return list.map((t,i)=>{
      const score = t.score ?? 0;
      const r = (score/maxScore)*maxR;
      const angle = -Math.PI/2 + i*angleStep;
      return {x: center + r*Math.cos(angle), y: center + r*Math.sin(angle)};
    });
  }

  const curPts = pointsFor(topics);
  curPts.forEach((p,i)=>{ dots += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${isAll?LEVEL_COLORS[topics[i].level]:scoreColor(topics[i].score)}"/>`; });
  const curPoly = curPts.map(p=>`${p.x},${p.y}`).join(' ');

  let comparePolys = '';
  compareList.forEach((cs,idx)=>{
    const aligned = topics.map(t=> cs.topics.find(pt=>pt.name===t.name) || {name:t.name, score:0});
    const pts = pointsFor(aligned);
    const color = COMPARE_PALETTE[idx % COMPARE_PALETTE.length];
    comparePolys += `<polygon points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-dasharray="5,3"/>`;
  });

  const pad = isAll ? 90 : 70;
  return `<svg width="${size+pad}" height="${size+pad*0.7}" viewBox="-${pad/2} -${pad*0.35} ${size+pad} ${size+pad*0.7}">
    ${grid}${comparePolys}
    <polygon points="${curPoly}" fill="rgba(174,95,63,0.12)" stroke="var(--terracotta)" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

/* ---- Variant "scale" ---- */
function renderVariantScale(s, compareList, levelTopics, isAll, autoMode){
  const title = isAll ? 'Большая шкала — все добавленные темы' : `Шкалы 0–10 — ${LEVEL_LABELS[state.activeLevel]}`;
  return `
    <div class="section">
      <div class="section-title">${title}</div>
      ${levelTopics.map((t,i)=>{
        const val = t.score ?? 0;
        const color = t.score===null ? 'var(--line)' : (isAll ? LEVEL_COLORS[t.level] : scoreColor(t.score));
        const markers = compareList.map((cs,idx)=>{
          const cscore = cs.topics.find(x=>x.name===t.name)?.score;
          if(cscore===null||cscore===undefined) return '';
          const color2 = COMPARE_PALETTE[idx % COMPARE_PALETTE.length];
          return `<div class="bullet-prev-marker" style="left:${cscore*10}%;background:${color2};" title="Срез ${cs.date}: ${cscore}"></div>`;
        }).join('');
        return `
        <div class="bullet-row">
          <div class="bullet-head">
            <span class="bh-name">${t.name}${isAll ? ` <span style="color:${LEVEL_COLORS[t.level]};font-weight:700;">·${t.level}</span>` : ''}</span>
            ${scoreInput(i, t.score)}
            <span class="topic-remove" data-topic-remove="${i}" title="Убрать тему">✕</span>
          </div>
          <div class="bullet-track">
            <div class="bullet-fill ${t.score===null?'none':''}" style="width:${val*10}%;background:${color};"></div>
            ${markers}
          </div>
          <div class="bullet-scale"><span>0</span><span>2</span><span>4</span><span>5</span><span>6</span><span>8</span><span>10</span></div>
        </div>
      `;}).join('')}
      ${compareList.length ? `<div class="wheel-compare-legend">
        ${compareList.map((cs,idx)=>`<span class="legend-swatch"><span style="width:9px;height:9px;border-radius:2px;display:inline-block;background:${COMPARE_PALETTE[idx % COMPARE_PALETTE.length]};"></span> срез ${cs.date}</span>`).join('')}
      </div>` : ''}
    </div>
  `;
}

  document.getElementById('repCurrent').onblur = (e)=>{ s.repertoire.current = e.target.value; saveData(); };
  document.getElementById('addFutureBtn').onclick = ()=>{
    const input = document.getElementById('futureInput');
    if(input.value.trim()){ s.repertoire.future.push(input.value.trim()); saveData(); renderRepertoire(s); }
  };
  c.querySelectorAll('[data-remove-i]').forEach(el=>{
    el.onclick = ()=>{ s.repertoire.future.splice(parseInt(el.dataset.removeI),1); saveData(); renderRepertoire(s); };
  });
}

/* ============================================================
   CARD TAB — Анкета (первичная) + Динамика по занятиям
   Реальный бэкенд: /api/intake и /api/lessons (Postgres)
   ============================================================ */

async function apiGet(url){
  const r = await fetch(url);
  if(!r.ok){ const t = await r.text().catch(()=> ''); throw new Error('HTTP '+r.status+' '+t); }
  return r.json();
}
async function apiSend(url, method, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if(!r.ok){ const t = await r.text().catch(()=> ''); throw new Error('HTTP '+r.status+' '+t); }
  return r.json();
}

function renderDiary(s){
  const c = document.getElementById('tabContent');
  const needDicts = !state.kbDictsLoaded;
  if(state.diaryCache[s.id] && !needDicts){ paintDiary(s); return; }
  c.innerHTML = `<div class="kb-loading">Загружаю дневник занятий…</div>`;
  const cached = state.diaryCache[s.id];
  const tasks = [
    cached ? Promise.resolve({lessons: cached.lessons}) : apiGet('/api/lessons?studentId=' + encodeURIComponent(s.id))
  ];
  if(needDicts) tasks.push(apiGet('/api/dicts'));
  Promise.all(tasks).then(([lessonsRes, dictsRes])=>{
    state.diaryCache[s.id] = { lessons: (lessonsRes && lessonsRes.lessons) || [] };
    if(needDicts){
      const server = (dictsRes && dictsRes.dicts) || {};
      Object.keys(state.kbDicts).forEach(k=>{
        const row = server[k];
        if(row) state.kbDicts[k] = Object.assign({}, state.kbDicts[k], {pinned: row.pinned||[], added: row.added||[]});
      });
      state.kbDictsLoaded = true;
    }
    paintDiary(s);
  }).catch(err=>{
    c.innerHTML = `<div class="card-error">Не удалось загрузить дневник занятий: ${String(err.message||err)}. Проверьте подключение базы Postgres в настройках Vercel.</div>`;
  });
}

function paintDiary(s){
  const c = document.getElementById('tabContent');
  const cache = dnCache(s);
  const lessons = cache.lessons || [];
  const draft = dnDraft(s);
  const editingId = state.diaryEditing[s.id] || null;

    <div class="kb-wrap">
      ${dnFormHtml(s, draft)}
      ${dnTrendSectionHtml(lessons)}
      ${dnHistorySectionHtml(s, lessons, editingId)}
    </div>
  `;
  wireDiaryHandlers(s); vrWireLightRows(s);
}

function dnGradeColor(g){
  if(g>=7) return '#4E7047';
  if(g>=4) return '#8B8177';
  return '#A8452C';
}
function dnGradeBand(g){
  if(g==null) return null;
  if(g>=7) return {color:'#4E7047', bg:'#EFF4ED', border:'#D9E4D5'};
  if(g>=4) return {color:'#8B8177', bg:'#F1EDE6', border:'#E4DCD1'};
  return {color:'#A8452C', bg:'#FBEFEA', border:'#EFD4C6'};
}
function dnTrendSvg(graded){
  const w = 360, h = 90, pad = 10;
  if(!graded.length){
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex:none;"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#EFE7DC" stroke-width="2"/></svg>`;
  }
  const n = graded.length;
  const stepX = n>1 ? (w - pad*2)/(n-1) : 0;
  const yFor = (g)=> h - pad - ((g-1)/9)*(h-pad*2);
  const pts = graded.map((l,i)=> [pad + i*stepX, yFor(l.grade)]);
  const pathD = pts.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const dots = pts.map((p,i)=> `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${dnGradeColor(graded[i].grade)}" />`).join('');
  return `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex:none;">
      <path d="${areaD}" fill="#F1EDE5" stroke="none" />
      <path d="${pathD}" fill="none" stroke="#C9BCAE" stroke-width="1.6" />
      ${dots}
    </svg>
  `;
}
function dnTrendSectionHtml(lessons){
  const graded = (lessons||[]).filter(l=>l.grade!=null).slice().sort((a,b)=> (a.lessonDate||'').localeCompare(b.lessonDate||'') || (a.id-b.id));
  const total = graded.reduce((sum,l)=> sum+(l.grade||0), 0);
  const avg = graded.length ? (total/graded.length) : 0;
  const summary = graded.length
    ? `Накоплено ${total} ${pluralRu(total, ['балл','балла','баллов'])} за ${lessonsLabel(graded.length)}, средняя оценка ${avg.toFixed(1)} из 10.`
    : 'Оценок пока нет — появятся после первых занятий с проставленной «Оценкой занятия».';
  return `
    <section>
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap;">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: #A09488;">Тренд по срезам</div>
        <div style="display: flex; gap: 16px; font-size: 12.5px; color: #9A8E82; font-weight: 600;">
          <span style="color: #4E7047;">● 7–10</span>
          <span style="color: #8B8177;">● 4–6</span>
          <span style="color: #A8452C;">● 1–3</span>
        </div>
      </div>
      <div style="background: #fff; border: 1px solid #ECE5DB; border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap;">
        ${dnTrendSvg(graded)}
        <div style="font-size: 14px; color: #6E645A; line-height: 1.5; flex: 1; min-width: 220px;">${summary}</div>
      </div>
    </section>
  `;
}

function dnFmtDate(d){
  if(!d) return '—';
  const parts = String(d).slice(0,10).split('-');
  return parts.length===3 ? parts[2]+'.'+parts[1]+'.'+parts[0] : d;
}

/* ---- persistence: race-safe per-lesson-id save chain, mirrors
   saveKabinet/kbFlushKabinet's fix for out-of-order POSTs ---- */
function dnQueueSave(lessonId, patch, onResult){
  state.dnPending[lessonId] = Object.assign({}, state.dnPending[lessonId], patch);
  const prevChain = state.dnSaveChain[lessonId] || Promise.resolve();
  const thisSave = prevChain.then(()=> dnFlush(lessonId, onResult));
  state.dnSaveChain[lessonId] = thisSave.catch(()=>{});
  return thisSave;
}
function dnFlush(lessonId, onResult){
  const payload = state.dnPending[lessonId] || {};
  state.dnPending[lessonId] = {};
  const mySeq = (state.dnSaveSeq[lessonId] = (state.dnSaveSeq[lessonId]||0) + 1);
  return apiSend('/api/lessons?id=' + encodeURIComponent(lessonId), 'PATCH', payload)
    .then(res=>{
      if(state.dnSaveSeq[lessonId] === mySeq && onResult){ onResult(res.lesson); }
      return res.lesson;
    })
    .catch(err=>{
      alert('Не удалось сохранить занятие: ' + (err.message||err));
      throw err;
    });
}

function dnDraftToPayload(s, draft){
    return {
          studentId: s.id,
          lessonDate: draft.date,
          topic: draft.topic || null,
          workLow: draft.workLow || null,
          workHigh: draft.workHigh || null,
          goal: draft.goal || null,
          intensity: draft.hard,
          grade: draft.tone,
          lessonSteps: draft.steps || [],
          newProblems: draft.probs || [],
          hwItems: draft.assigned || [],
          hwSent: !!draft.sent,
          takes: draft.takes || []
    };
}
function dnEnsureDraftRow(s){
  const draft = dnDraft(s);
  if(draft.id) return Promise.resolve(draft.id);
  if(draft._creating) return draft._creating;
  draft._creating = apiSend('/api/lessons', 'POST', dnDraftToPayload(s, draft)).then(res=>{
    draft.id = res.lesson.id;
    draft._creating = null;
    invalidateLessonCount(s);
    return draft.id;
  }).catch(err=>{
    draft._creating = null;
    throw err;
  });
  return draft._creating;
}
function dnAutosave(s, patch){
  const draft = dnDraft(s);
  Object.assign(draft, patch);
  dnEnsureDraftRow(s).then(lessonId=>{
    dnQueueSave(lessonId, patch, ()=>{});
  }).catch(err=>{ alert('Не удалось создать запись занятия: ' + (err.message||err)); });
}

function dnFinalizeSave(s){
  const draft = dnDraft(s);
  const btn = document.querySelector('[data-dn-save-lesson]');
  if(btn) btn.disabled = true;
  const finish = (lesson)=>{
    const cache = dnCache(s);
    cache.lessons = [lesson].concat((cache.lessons||[]).filter(l=>String(l.id)!==String(lesson.id)));
    delete state.diaryDrafts[s.id];
    delete state.diaryRec[s.id];
    delete state.kabinetCache[s.id];
    invalidateLessonCount(s);
    paintDiary(s);
  };
  if(draft.id){
    dnQueueSave(draft.id, dnDraftToPayload(s, draft), finish).catch(()=>{ if(btn) btn.disabled=false; });
  } else {
    apiSend('/api/lessons', 'POST', dnDraftToPayload(s, draft)).then(res=> finish(res.lesson))
      .catch(err=>{ alert('Не удалось сохранить занятие: ' + (err.message||err)); if(btn) btn.disabled=false; });
  }
}

function vrBlankRec(){ return { active:false, paused:false, saving:false, justSaved:false, seconds:0, error:'', levels:[], peaks:[], markers:[], pendingTake:null, visibleToStudent:true, mediaRecorder:null, stream:null, chunks:[], ctx:null, timer:null, levelTimer:null }; }
function vrDeviceId(){ try{ return localStorage.getItem('vrInputDeviceId')||''; }catch(e){ return ''; } }
function vrSetDeviceId(id){ try{ localStorage.setItem('vrInputDeviceId', id||''); }catch(e){} }
function vrListInputDevices(selectEl){ if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return; navigator.mediaDevices.enumerateDevices().then(list=>{ const mics = list.filter(d=>d.kind==='audioinput'); const cur = vrDeviceId(); selectEl.innerHTML = mics.length ? mics.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>${d.label || ('Микрофон '+(i+1))}</option>`).join('') : `<option value="">Микрофон по умолчанию</option>`; }).catch(()=>{}); }
function vrUid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function vrNewMarker(t){ return { id: vrUid(), t: Math.round(t*10)/10, label: '', createdAt: new Date().toISOString() }; }
function vrMarkerTime(m){ return m.t!=null ? m.t : (m.sec||0); }
function vrSortedMarkers(markers){ return (markers||[]).slice().sort((a,b)=> vrMarkerTime(a)-vrMarkerTime(b)); }
function vrFindNearMarker(markers, t, thresh){ thresh = thresh||0.3; let best=-1, bestD=Infinity; (markers||[]).forEach((m,i)=>{ const d=Math.abs(vrMarkerTime(m)-t); if(d<thresh && d<bestD){ bestD=d; best=i; } }); return best; }
function vrCreateOrEditMarker(rk, take, t, persistFn, repaintFn){
  const nearIdx = vrFindNearMarker(take.markers, t, 0.3);
  if(nearIdx>=0){
    window.__vrPendingEditMarker = { rk: rk, markerId: (take.markers||[])[nearIdx].id };
    repaintFn();
    return;
  }
  const m = vrNewMarker(t);
  take.markers = (take.markers||[]).concat([m]);
  const sorted = vrSortedMarkers(take.markers);
  const idx = sorted.findIndex(function(x){ return x.id===m.id; });
  m.label = 'Метка ' + (idx+1);
  persistFn();
  window.__vrPendingEditMarker = { rk: rk, markerId: m.id };
  repaintFn();
}
function vrDownsample(peaks, n){
  peaks = peaks||[];
  if(!peaks.length) return Array.from({length:n}).map(()=>0);
  const out = [];
  const bucket = peaks.length/n;
  for(let i=0;i<n;i++){
    const start = Math.floor(i*bucket), end = Math.max(start+1, Math.floor((i+1)*bucket));
    let m = 0;
    for(let j=start;j<end && j<peaks.length;j++){ m = Math.max(m, peaks[j]); }
    out.push(m);
  }
  const max = Math.max(0.0001, Math.max.apply(null, out));
  return out.map(v=>v/max);
}
function vrFmtTime(sec){ sec = Math.max(0, Math.floor(sec||0)); return kbPad(Math.floor(sec/60))+':'+kbPad(sec%60); }
window.__vrAudios = window.__vrAudios || {};
function vrStopOtherAudio(exceptKey){ Object.keys(window.__vrAudios).forEach(k=>{ if(k!==exceptKey){ const a = window.__vrAudios[k]; if(a && !a.paused) a.pause(); } }); }
function vrShowUndoToast(message, onUndo, onFinal){
  const el = document.createElement('div');

  el.innerHTML = '<span>'+message+'</span><button type="button" style="background:none;border:none;color:#C97B62;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit;">Отменить</button>';
  document.body.appendChild(el);
  let done = false;
  const finish = (undo)=>{ if(done) return; done = true; el.remove(); if(undo){ onUndo(); } else { onFinal(); } };
  el.querySelector('button').onclick = ()=> finish(true);
  const timer = setTimeout(()=> finish(false), 10000);
  return { cancel: ()=>{ clearTimeout(timer); finish(true); } };
}

document.addEventListener('keydown', function(e){
  if(e.key!=='m' && e.key!=='M') return;
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if(tag==='input' || tag==='textarea' || (document.activeElement && document.activeElement.isContentEditable)) return;
  let targetKey = null, targetAudio = null;
  for(const k in window.__vrAudios){ const a = window.__vrAudios[k]; if(a && !a.paused){ targetKey = k; targetAudio = a; break; } }
  if(!targetKey) return;
  const ctx = window.__vrTakeCtx && window.__vrTakeCtx[targetKey];

  vrCreateOrEditMarker(targetKey, ctx.take, targetAudio.currentTime, ctx.persistFn, ctx.repaintFn);
});

function dnStartRecording(recKey, rec, opts){
  if(rec.active || rec.saving) return;

  const devSel = document.querySelector(`[data-vr-device="${recKey}"]`);
  const deviceId = (devSel && devSel.value) || vrDeviceId();
  const constraints = deviceId ? {audio:{deviceId:{exact:deviceId}}} : {audio:true};
  navigator.mediaDevices.getUserMedia(constraints).then(stream=>{
    rec.stream = stream;
    rec.hint = '';
    rec.silenceStreak = 0;
    vrRegisterRec(rec);
    const track = stream.getAudioTracks()[0];
    if(track){
      track.onended = ()=>{
        if(!rec.active) return;
        rec.paused = true;
        if(rec.mediaRecorder && rec.mediaRecorder.state==='recording' && rec.mediaRecorder.pause) rec.mediaRecorder.pause();
        rec.error = 'Микрофон отключён — выберите другой источник и продолжите.';
        opts.onRepaint();
      };
    }
    const mr = new MediaRecorder(stream);
    rec.chunks = [];
    mr.ondataavailable = e=>{ if(e.data && e.data.size) rec.chunks.push(e.data); };
    mr.onstop = ()=>{
      vrUnregisterRec(rec);
      if(rec._discard){ rec._discard = false; dnTeardownRecorder(rec); opts.onRepaint(); return; }
      const blob = new Blob(rec.chunks, {type: mr.mimeType || 'audio/webm'});
      const secs = rec.seconds;
      const d = new Date();
      const dateLabel = kbPad(d.getDate())+'.'+kbPad(d.getMonth()+1)+'.'+d.getFullYear();
      const fileName = dateLabel+'_'+opts.fileTag+'.webm';
      const displayName = (opts.studentName || 'Голос ученика') + ' · ' + dateLabel;
      const reader = new FileReader();
      reader.onload = ()=>{
        const dataUrl = reader.result;
        const wasLimitStop = !!rec._limitStop; rec._limitStop = false;
        const markers = vrSortedMarkers(rec.markers);
        const peaks = vrDownsample(rec.peaks, 200);
        const visibleToStudent = rec.visibleToStudent !== false;
        dnTeardownRecorder(rec);
        if(dataUrl.length > 5800000){ rec.error = 'Запись слишком большая для сохранения в базе (лимит ~4 МБ). Сократите длительность и запишите заново.'; opts.onRepaint(); return; }

        if(wasLimitStop){ opts.onSaveTake(take); } else { rec.pendingTake = take; opts.onRepaint(); }
      };
      reader.readAsDataURL(blob);
    };
    rec.mediaRecorder = mr;
    mr.start();
    rec.active = true; rec.paused = false; rec.seconds = 0; rec.error = ''; rec.levels = []; rec.peaks = []; rec.markers = []; rec.pendingTake = null;
    opts.onRepaint();
    rec.timer = setInterval(()=>{
      if(rec.paused) return;
      rec.seconds++;
      dnUpdateRecDom(recKey, rec);
    }, 1000);
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.65;
      ctx.createMediaStreamSource(stream).connect(analyser);
      rec.ctx = ctx;
      const data = new Uint8Array(analyser.fftSize);
      rec.levelTimer = setInterval(()=>{
        if(rec.paused) return;
        analyser.getByteTimeDomainData(data);
        let sumSq = 0;
        for(let i=0;i<data.length;i++){ const v = (data[i]-128)/128; sumSq += v*v; }
        const rms = Math.sqrt(sumSq/data.length);
        const amplitude = Math.min(1, rms*3.4);
        rec.levels = rec.levels.concat([amplitude]).slice(-60);
        rec.peaks.push(amplitude);
        if(amplitude < 0.02){ rec.silenceStreak = (rec.silenceStreak||0) + 1; } else { rec.silenceStreak = 0; if(rec.hint){ rec.hint=''; opts.onRepaint(); } }

        dnUpdateRecDom(recKey, rec);

    }catch(e){ /* визуализация не критична для работы записи */ }

function dnStopRecording(rec){ if(rec.timer) clearInterval(rec.timer); if(rec.levelTimer) clearInterval(rec.levelTimer); if(rec.mediaRecorder && rec.mediaRecorder.state !== 'inactive') rec.mediaRecorder.stop(); else dnTeardownRecorder(rec); }

function dnConfirmSaveTake(rec, opts){

  rec.pendingTake = null;
  rec.saving = true;
  rec.savingPhase = 0;

function dnApplyDictValue(s, ctx, fieldKey, label){
  if(fieldKey === 'dnTool'){
    if(ctx === 'new:newstep'){
      dnAutosave(s, {newTool: label});
    } else if(ctx && ctx.indexOf('new:step:')===0){
      const i = Number(ctx.slice(9));
      const draft = dnDraft(s);
      const steps = draft.steps.map((x,j)=> j===i ? Object.assign({}, x, {tool: label}) : x);
      dnAutosave(s, {steps: steps, lessonSteps: steps});
    }
    paintDiary(s);
    return;
  }
  if(fieldKey === 'dnHwTopic'){
    if(ctx === 'new'){
      dnAutosave(s, {hwPick: label});
      const draft = dnDraft(s);
      draft.dueWarn = false;
    }
    paintDiary(s);
    return;
  }
  const shortKey = fieldKey==='dnWorkLow'?'workLow':fieldKey==='dnWorkHigh'?'workHigh':'newProblem';
  if(ctx==='new'){
    dnAutosave(s, {[shortKey]: label});
  } else if(ctx && ctx.indexOf('edit:')===0){
    dnEditDraft(ctx.slice(5))[shortKey] = label;
  }
  paintDiary(s);
}

function dnCommitDictAdd(fieldKey, s){
  const dd = state.kabinetDictDD;
  const raw = (dd.draft || '').trim();
  if(!raw){ state.kabinetDictDD = Object.assign({}, dd, {error:'Пустое значение добавить нельзя.'}); paintDiary(s); return; }
  const d = state.kbDicts[fieldKey];
  const all = d.core.concat(d.pinned, d.added);
  if(all.some(x=>x.toLowerCase()===raw.toLowerCase())){
    state.kabinetDictDD = Object.assign({}, dd, {error:'Такой вариант уже есть в списке.'});
    paintDiary(s);
    return;
  }
  const wrap = document.querySelector(`[data-kb-dict-draft="${fieldKey}"]`);
  const ctxEl = wrap && wrap.closest('[data-dn-ctx]');
  const ctx = ctxEl ? ctxEl.dataset.dnCtx : 'new';
  const nextDict = { core: d.core, pinned: d.pinned, added: d.added.concat([raw]) };
  state.kbDicts[fieldKey] = nextDict;
  state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
  saveFieldDict(fieldKey, nextDict);
  dnApplyDictValue(s, ctx, fieldKey, raw);
}

function vrOpenMarkerEditor(rk, markerId, take, persistFn, repaintFn){

  let done = false;

    if(done) return; done = true;

}
function vrWireTakeRow(root, rk, take, getTakes, setTakes, persistFn, repaintFn, isLight){

function vrWireLightRows(s){

  if(!root) return;
  const cache = dnCache(s);
  const lessons = cache.lessons || [];
  lessons.forEach(function(l){

    (l.takes||[]).forEach(function(t){
      const rk = 'light_' + l.id + '_' + t.id;
      const getTakes = function(){ return l.takes || []; };
      const setTakes = function(next){ l.takes = next; };
      const persist = function(){
        dnQueueSave(l.id, {takes: l.takes}, function(lesson){
          if(lesson){ const idx = lessons.findIndex(function(x){ return String(x.id)===String(lesson.id); }); if(idx>=0) lessons[idx] = lesson; }
        });
      };
      vrWireTakeRow(root, rk, t, getTakes, setTakes, persist, function(){ paintDiary(s); }, true);
    });
  });
}
function dnRecorderWire(s, recKey, rec, ctx, getTakesArr, setTakesArr, syncAfterSave, opts){
  opts = opts || {};
  const root = document.getElementById('tabContent');
  if(!root) return;
  const fileTag = (s.name||'student').replace(/\s+/g,'_') + (opts.fileTagSuffix || '_zanyatie');
  const repaint = function(){ return opts.repaint ? opts.repaint() : paintDiary(s); };
  const persistTakes = function(){
    if(ctx==='kabinet'){ opts.onKabinetSave(getTakesArr()); return; }
    if(ctx==='new'){ const draft = dnDraft(s); if(draft.id) dnQueueSave(draft.id, {takes: getTakesArr()}, function(){}); return; }
    if(ctx && ctx.indexOf('edit:')===0){ dnQueueSave(ctx.slice(5), {takes: getTakesArr()}, function(lesson){ if(lesson) syncAfterSave(lesson); }); return; }
  };
  const doSaveTake = function(take){
    if(ctx==='kabinet'){
      take._fresh = true;
      setTimeout(function(){ take._fresh=false; repaint(); }, 6000);
      const next = [take].concat(getTakesArr()||[]);
      setTakesArr(next);
      opts.onKabinetSave(next);
      return;
    }
    const ensureFn = ctx==='new' ? (function(){ return dnEnsureDraftRow(s); }) : (function(){ return Promise.resolve(ctx.slice(5)); });
    dnSaveTakes(rec, ensureFn,
      function(){
        take._fresh = true;
        setTimeout(function(){ take._fresh=false; repaint(); }, 6000);
        const next = [take].concat(getTakesArr()||[]);
        setTakesArr(next);
        return next;
      },
      function(lesson){ if(lesson) syncAfterSave(lesson); },
      repaint
    );
  };
  const engOpts = { fileTag: fileTag, studentName: s.name, onRepaint: repaint, onSaveTake: doSaveTake };
  const btn = root.querySelector('[data-vr-rec-btn="'+recKey+'"]');
  if(btn) btn.onclick = function(){ if(rec.active){ dnStopRecording(rec); } else { dnStartRecording(recKey, rec, engOpts); } };
  const pauseBtn = root.querySelector('[data-vr-pause="'+recKey+'"]');
  if(pauseBtn) pauseBtn.onclick = function(){ dnPauseToggle(rec, recKey, engOpts); };
  const markerBtn = root.querySelector('[data-vr-marker="'+recKey+'"]');
  if(markerBtn) markerBtn.onclick = function(){ dnAddMarker(rec, recKey, engOpts); };
  const discardBtn = root.querySelector('[data-vr-discard="'+recKey+'"]');
  if(discardBtn) discardBtn.onclick = function(){ dnDiscardRecording(rec, engOpts); };
  const saveBtn = root.querySelector('[data-vr-save="'+recKey+'"]');
  if(saveBtn) saveBtn.onclick = function(){ dnConfirmSaveTake(rec, engOpts); };
  const discardPendingBtn = root.querySelector('[data-vr-discard-pending="'+recKey+'"]');
  if(discardPendingBtn) discardPendingBtn.onclick = function(){ dnDiscardPendingTake(rec, engOpts); };
  const deviceSel = root.querySelector('[data-vr-device="'+recKey+'"]');
  if(deviceSel){ vrListInputDevices(deviceSel); deviceSel.onchange = function(){ vrSetDeviceId(deviceSel.value); }; }
  const visibleChk = root.querySelector('[data-vr-visible="'+recKey+'"]');
  if(visibleChk) visibleChk.onclick = function(){ rec.visibleToStudent = rec.visibleToStudent===false ? true : false; repaint(); };
  const uploadInput = root.querySelector('[data-vr-upload="'+recKey+'"]');
  if(uploadInput) uploadInput.onchange = function(e){ const file = e.target.files && e.target.files[0]; if(file && opts.onUpload) opts.onUpload(file); e.target.value = ''; };
  (getTakesArr()||[]).forEach(function(t){
    vrWireTakeRow(root, recKey+'_'+t.id, t, getTakesArr, setTakesArr, persistTakes, repaint, false);
  });
}

    }
  
    // Домашнее задание в мини-приложении
    c.querySelectorAll('[data-dn-level]').forEach(el=>{
          el.onclick = ()=>{
                  const draft = dnDraft(s);
                  draft.level = el.dataset.dnLevel;
                  draft.hwPick = '';
                  paintDiary(s);
          };
    });
    const hwPickEl = c.querySelector('[data-dn-hw-pick]');
    if(hwPickEl) hwPickEl.onchange = ()=>{
          const draft = dnDraft(s);
          draft.hwPick = hwPickEl.value;
          draft.dueWarn = false;
          paintDiary(s);
    };
    const hwDueEl = c.querySelector('[data-dn-hw-due]');
    if(hwDueEl) hwDueEl.onchange = ()=>{
          const draft = dnDraft(s);
          draft.hwDue = hwDueEl.value;
          draft.dueWarn = false;
          paintDiary(s);
    };
    c.querySelectorAll('[data-dn-add-hw]').forEach(el=>{
          el.onclick = ()=>{
                  const draft = dnDraft(s);
                  if(!draft.hwPick) return;
                  if(!draft.hwDue){ draft.dueWarn = true; paintDiary(s); return; }
                  const assigned = draft.assigned.concat([{ level: draft.level, title: draft.hwPick, due: draft.hwDue, status: 'в приложении: не начато' }]);
                  draft.hwPick = '';
                  draft.dueWarn = false;
                  draft.sent = false;
                  dnAutosave(s, {assigned: assigned, hwItems: assigned, sent: false, hwSent: false});
                  paintDiary(s);
          };
    });
    c.querySelectorAll('[data-dn-hw-remove]').forEach(el=>{
          el.onclick = ()=>{
                  const i = Number(el.dataset.dnHwRemove);
                  const draft = dnDraft(s);
                  const assigned = draft.assigned.filter((x,j)=>j!==i);
                  draft.sent = false;
                  dnAutosave(s, {assigned: assigned, hwItems: assigned, sent: false, hwSent: false});
                  paintDiary(s);
          };
    });
    c.querySelectorAll('[data-dn-send-hw]').forEach(el=>{
          el.onclick = ()=>{
                  const draft = dnDraft(s);
                  if(!draft.assigned.length) return;
                  dnAutosave(s, {sent: true, hwSent: true});
                  paintDiary(s);
          };
    });
  
    // рекордер новой записи
  const draft = dnDraft(s);
  dnRecorderWire(s, 'new_'+s.id, dnRec(s), 'new',
    ()=> dnDraft(s).takes,
    (next)=>{ dnDraft(s).takes = next; },
    ()=>{}
  );

  // рекордер текущей открытой инлайн-редакции (если есть)
  const editingId = state.diaryEditing[s.id];
  if(editingId){
    dnRecorderWire(s, 'edit_'+editingId, dnEditRec(editingId), 'edit:'+editingId,
      ()=> dnEditDraft(editingId).takes,
      (next)=>{ dnEditDraft(editingId).takes = next; },
      (lesson)=>{
        const cache = dnCache(s);
        cache.lessons = (cache.lessons||[]).map(l=> String(l.id)===String(lesson.id) ? lesson : l);
      }
    );
  }

  // «Сохранить занятие» — финальный флаш новой записи + сброс формы
  const saveBtn = c.querySelector('[data-dn-save-lesson]');
  if(saveBtn) saveBtn.onclick = ()=> dnFinalizeSave(s);

  // история: редактировать / отмена / сохранить изменения / удалить
  c.querySelectorAll('[data-dn-edit-start]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.dnEditStart;
      const cache = dnCache(s);
      const lesson = (cache.lessons||[]).find(l=>String(l.id)===String(id));
      if(!lesson) return;
      state.diaryEditDrafts[id] = dnLessonToEditDraft(lesson);
      state.diaryEditing[s.id] = id;
      paintDiary(s);
    };
  });
  c.querySelectorAll('[data-dn-edit-cancel]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.dnEditCancel;
      delete state.diaryEditDrafts[id];
      delete state.diaryEditRec[id];
      state.diaryEditing[s.id] = null;
      paintDiary(s);
    };
  });
  c.querySelectorAll('[data-dn-edit-save]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.dnEditSave;
      const ed = dnEditDraft(id);
      el.disabled = true;
      dnQueueSave(id, {
        lessonDate: ed.date, topic: ed.topic||null, workLow: ed.workLow||null, workHigh: ed.workHigh||null,
        goal: ed.goal||null, structures: ed.structures||[], intensity: ed.intensity, grade: ed.grade,
        cvtModes: ed.cvtModes||[], anchors: ed.anchors||[], newProblem: ed.newProblem||null, hw: ed.hw||null
      }, (lesson)=>{
        const cache = dnCache(s);
        cache.lessons = (cache.lessons||[]).map(l=> String(l.id)===String(lesson.id) ? lesson : l);
        delete state.diaryEditDrafts[id];
        delete state.diaryEditRec[id];
        delete state.kabinetCache[s.id];
        state.diaryEditing[s.id] = null;
        paintDiary(s);
      }).catch(()=>{ el.disabled=false; });
    };
  });
  c.querySelectorAll('[data-dn-delete]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.dnDelete;
      if(!confirm('Удалить это занятие?')) return;
      apiSend('/api/lessons?id='+encodeURIComponent(id), 'DELETE', {}).then(()=>{
        const cache = dnCache(s);
        cache.lessons = (cache.lessons||[]).filter(l=>String(l.id)!==String(id));
        delete state.diaryEditDrafts[id];
        delete state.diaryEditRec[id];
        if(state.diaryEditing[s.id]===id) state.diaryEditing[s.id] = null;
        delete state.kabinetCache[s.id];
        invalidateLessonCount(s);
        paintDiary(s);
      }).catch(err=> alert('Не удалось удалить занятие: ' + (err.message||err)));
    };
  });
}

// Core control only (trigger + dropdown), no card/label wrapper — reusable
// both inside a .kb-card grid cell (kbSpravochnikField below) and inside a
// custom container that has its own label styling (e.g. Жалобы's
// .kb-block-title inside .kb-anamnesis-box).
// Shared option-row renderer for both the multi-select (kbSpravochnikControl)
// and single-select (kbSpravochnikSingleControl) Справочник variants —
// compact wrapping chip/button, not a full-width row, so lists like Жалобы
// (16 items) or Возраст (21 items) stay to ~3 visible rows instead of one
// giant vertical list. Keeps pin-to-ОСНОВНОЕ and delete-with-confirm
// exactly as before; only "основное" items skip pin/delete (unchanged
// behaviour). Two callers share this so the component can't drift out of
// sync with itself the way goal/goals did.
function kbDictChipRow(fieldKey, r, isSelected, selectAttrName){
  const dd = state.kabinetDictDD;
  const confirming = dd.confirm === fieldKey + '::' + r.label;
  if(confirming){
    const inUse = isSelected;
    return `
      <div class="kb-dict-confirm">
        <div style="font-size:12.5px;color:#A8452C;font-weight:600;line-height:1.35;">${inUse ? 'Удалить «'+r.label+'»? Значение стоит в карточке — оно останется там обычным текстом.' : 'Удалить «'+r.label+'» из справочника?'}</div>

      </div>`;
  }
  return `
    <div class="kb-chip-item${isSelected?' selected':''}">
      <button type="button" ${selectAttrName}="${fieldKey}" data-kb-value="${r.label}" class="kb-chip-select">${r.label}</button>

    </div>`;
}

function kbSpravochnikControl(fieldKey, values){
  const selected = Array.isArray(values) ? values : [];

  const valueHtml = selected.length
    ? `<span class="kb-multi-chips">${selected.map(v=>`<span class="kb-multi-chip-tag">${v}</span>`).join('')}</span>`
    : `<span class="kb-multi-placeholder">— выбрать —</span>`;

  const addingHtml = kbDictAddingHtml(fieldKey);

  const triggerHtml = `
    <button type="button" class="kb-multi-trigger" data-kb-dict-toggle="${fieldKey}">
      ${valueHtml}
      <span class="kb-multi-caret">${isOpen?'▲':'▼'}</span>
    </button>
  `;

  const rows = kbDictRows(fieldKey);
  const dropdownHtml = `
    <div class="kb-dict-dropdown">
      <div class="kb-dict-chip-grid">

function kbCommitDictAdd(fieldKey, s){
  const dd = state.kabinetDictDD;
  const raw = (dd.draft || '').trim();
  if(!raw){ state.kabinetDictDD = Object.assign({}, dd, {error:'Пустое значение добавить нельзя.'}); paintKabinet(s); return; }
  if(fieldKey === 'age' && !/^\d{1,3}$/.test(raw)){
    state.kabinetDictDD = Object.assign({}, dd, {error:'Введите возраст числом.'});
    paintKabinet(s);
    return;
  }
  const d = state.kbDicts[fieldKey];
  const all = d.core.concat(d.pinned, d.added);
  if(all.some(x=>x.toLowerCase()===raw.toLowerCase())){
    state.kabinetDictDD = Object.assign({}, dd, {error:'Такой вариант уже есть в списке.'});
    paintKabinet(s);
    return;
  }
  const nextDict = { core: d.core, pinned: d.pinned, added: d.added.concat([raw]) };
  state.kbDicts[fieldKey] = nextDict;
  state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
  saveFieldDict(fieldKey, nextDict);
  const cache = kbCache(s);
  if(KB_SINGLE_DICT_FIELDS.has(fieldKey)){
    saveKabinet(s, {[fieldKey]: fieldKey === 'age' ? Number(raw) : raw});
  } else {
    const cur = cache.intake[fieldKey] || [];
    if(cur.indexOf(raw) === -1){
      saveKabinet(s, {[fieldKey]: cur.concat([raw])});
    } else {
      paintKabinet(s);
    }
  }
}

function kbRepaintCurrent(s){

function kbTogglePin(fieldKey, label, s){
  const d = state.kbDicts[fieldKey];
  const isPinned = d.pinned.indexOf(label) >= 0;
  const next = isPinned
    ? { core: d.core, pinned: d.pinned.filter(x=>x!==label), added: d.added.concat([label]) }
    : { core: d.core, pinned: d.pinned.concat([label]), added: d.added.filter(x=>x!==label) };
  state.kbDicts[fieldKey] = next;
  saveFieldDict(fieldKey, next);
  kbRepaintCurrent(s);
}

function kbDeleteDictOption(fieldKey, label, s){
  const d = state.kbDicts[fieldKey];
  const next = { core: d.core, pinned: d.pinned.filter(x=>x!==label), added: d.added.filter(x=>x!==label) };
  state.kbDicts[fieldKey] = next;
  state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm:null});

}

function kbMetallicNote(v){
  if(v<=20) return 'Почти без металла. Голос воздушный и лёгкий, складки смыкаются неплотно, часть выдоха уходит мимо звука. На сцене такой тембр не несёт: без микрофона его перекрывает даже негромкий аккомпанемент, в миксе он тонет за инструментами. Плюс в том, что нагрузка на складки минимальна и голос почти не устаёт, поэтому режим годится для восстановления после перегруза. Минус — динамику и опору на нём не построить: любая попытка добавить громкость выходит через давление, а не через смыкание.';
  if(v<=40) return 'Перевес в воздушность. Металл появляется только тогда, когда добавляется подсвязочное давление, поэтому громкая динамика идёт через форсирование, а не через плотность смыкания. Практически это выглядит так: тихие фразы звучат мягко и красиво, а на подъёме к громкому звук либо срывается в фальцет, либо становится сдавленным. Работать нужно с массой складок и опорой отдельно от громкости: сначала плотное смыкание на комфортной динамике, только потом наращивание объёма. До этого любые попытки бэлта будут закрепляться как пережим.';
  if(v<=60) return 'Рабочий баланс. Металл включается по запросу, а не по случайности: ученик может дать плотный звук и тут же вернуться в воздушный, не меняя опоры. Переход между регистрами держится без срыва, потому что масса складок и наклон щитовидного перестраиваются постепенно, а не рывком. Это то состояние, из которого стоит осваивать новые качества и эффекты: база уже устойчива, а запас по громкости и по мягкости есть в обе стороны. Задача на этом этапе — не ломать баланс при усложнении репертуара.';
  if(v<=80) return 'Металла много. Звук яркий, плотный и несущий, хорошо читается в миксе и на большой сцене без запаса по мощности микрофона. Обратная сторона — высокая нагрузка: складки работают толстой массой почти всё время, поэтому нужно следить за усталостью к концу занятия и за ретракцией ложных складок. Если ретракция теряется, металл быстро превращается в сдавленность, а на следующий день появляется сип. В таком режиме обязательны короткие паузы, воздушные упражнения между подходами и контроль общего голосового пробега за неделю.';
  return 'Максимум металла. Плотный сценический звук на всём диапазоне, ощущение мощи и полного контроля над динамикой. Держится он только на двух вещах: постоянной ретракции ложных складок и рабочих якорях головы, шеи и корпуса. Стоит потерять любую из них — и режим мгновенно уходит в пережим, с болью, сипом и потерей верха на несколько дней. Такой уровень металла не должен быть режимом по умолчанию: это инструмент для отдельных фраз и кульминаций, а базовую работу и разогрев нужно вести на более умеренном балансе.';
}
