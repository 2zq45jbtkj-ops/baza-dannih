  return `<div class="field"><label>${label}</label><select data-field="${group}|${key}">${opts.join('')}</select></div>`;
}
function textField(label, value, fieldKey){
  const [group, key] = fieldKey.split('-');
  return `<div class="field editable" data-text-field="${group}|${key}" data-label="${label}">
    <label>${label}</label><div>${value || '<span style="color:var(--muted);font-weight:400;">— не указано —</span>'}</div></div>`;
}
function renderTags(options, selected){
  return options.map(o=>`<span class="tag ${selected.includes(o)?'selected':''}" data-val="${o}">${o}</span>`).join('');
}

/* ---------- SREZY TAB ---------- */
function renderSrezy(s){
  const c = document.getElementById('tabContent');
  const prev = lastSrez(s);
  const levelTopics = topicsForLevel(s, state.activeLevel);
  const isAll = state.activeLevel==='ALL';
  const comparedSrezy = s.srezy.filter(sr=>state.compareIds.includes(sr.id));

  let html = `
    <div class="variant-switcher">
      <button class="variant-btn ${state.data.variant==='wheel'?'active':''}" data-v="wheel">Вариант 1 · Колесо</button>
      <button class="variant-btn ${state.data.variant==='scale'?'active':''}" data-v="scale">Вариант 2 · Шкалы</button>
    </div>

    <div class="level-switcher">
      ${LEVEL_ORDER.map(lvl=>{
        const cnt = topicsForLevel(s, lvl).length;
        return `<button class="level-btn ${state.activeLevel===lvl?'active':''}" data-lvl="${lvl}" style="${state.activeLevel===lvl?`background:${LEVEL_COLORS[lvl]};`:''}">
          <span class="lvl-swatch" style="background:${LEVEL_COLORS[lvl]}"></span>${LEVEL_LABELS[lvl]}<span class="lvl-count">(${cnt})</span>
        </button>`;
      }).join('')}
      <button class="level-btn ${isAll?'active':''}" data-lvl="ALL" style="${isAll?'background:var(--terracotta-dark);':''}">
        🔘 Все темы<span class="lvl-count">(${s.topics.length})</span>
      </button>
    </div>

    <div class="date-bar">
      <div>
        <div class="cur-date">Текущий срез: ${s.srezDate ? s.srezDate : '<span style="color:var(--muted);font-weight:400;">дата не закреплена</span>'}</div>
        ${comparedSrezy.length ? `<div class="prev-date">В сравнении: ${comparedSrezy.map(x=>x.date).join(', ')}</div>`
          : (prev ? `<div class="prev-date">Автосравнение с предыдущим срезом от ${prev.date}</div>` : `<div class="prev-date">Предыдущих срезов ещё нет — это будет первая точка отсчёта</div>`)}
      </div>
      <button class="pin-btn" id="pinDateBtn">📌 Закрепить сегодняшнюю дату как срез</button>
    </div>
  `;

  if(!isAll){
    html += renderAddTopicWidget(s, state.activeLevel);
  }

  if(levelTopics.length===0 && !isAll){
    html += `<div class="admin-note">В этом уровне пока нет добавленных тем — нажми «+» выше и выбери или впиши тему.</div>`;
  } else if(levelTopics.length===0 && isAll){
    html += `<div class="admin-note">Пока ни одна тема не добавлена ни в одном уровне.</div>`;
  } else {
    const compareList = comparedSrezy.length ? comparedSrezy : (prev ? [prev] : []);
    const autoMode = comparedSrezy.length===0; // single-dashed auto style when no explicit compare selected
    if(state.data.variant==='wheel') html += renderVariantWheel(s, compareList, levelTopics, isAll, autoMode);
    else html += renderVariantScale(s, compareList, levelTopics, isAll, autoMode);
  }

  html += `
    <div class="section" style="margin-top:30px;">
      <div class="section-title">История срезов</div>
      ${s.srezy.length===0
        ? `<div class="admin-note">Срезов пока нет. Нажми «Закрепить сегодняшнюю дату как срез» выше, когда проведёшь диагностику.</div>`
        : s.srezy.slice().reverse().map(srez=>{
          const isCompared = state.compareIds.includes(srez.id);
          return `
          <div class="srez-card ${isCompared?'compared':''}">
            <div class="srez-top">
              <div class="srez-date">${srez.date}</div>
              <div class="srez-actions">
                <button class="srez-action-btn ${isCompared?'compare-active':''}" data-compare-id="${srez.id}">${isCompared?'✓ В сравнении':'Сравнить'}</button>
                <button class="srez-action-btn" data-restore-id="${srez.id}">↺ Сделать текущим</button>
                <button class="srez-action-btn danger" data-delete-id="${srez.id}">✕ Удалить</button>
              </div>
            </div>
            <div class="srez-scores">
              ${srez.topics.filter(t=> isAll ? true : t.level===state.activeLevel).map(t=>`<div class="srez-score-pill">${t.name}: <b>${t.score===null?'—':t.score}</b></div>`).join('')}
            </div>
          </div>
        `;}).join('')
      }
    </div>
  `;

  c.innerHTML = html;

  c.querySelectorAll('.variant-btn').forEach(el=>{
    el.onclick = ()=>{ state.data.variant = el.dataset.v; state.openSliderTopicIndex=null; saveData(); renderSrezy(s); };
  });
  c.querySelectorAll('.level-btn').forEach(el=>{
    el.onclick = ()=>{ state.activeLevel = el.dataset.lvl; state.openSliderTopicIndex=null; state.topicPickerOpen=false; state.compareIds=[]; renderSrezy(s); };
  });
  document.getElementById('pinDateBtn').onclick = ()=>{
    const today = new Date().toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric'});
    s.srezDate = today;
    s.srezy.push({ id: nextSrezId(), date: today, topics: JSON.parse(JSON.stringify(s.topics)) });
    saveData(); renderSrezy(s);
  };

  c.querySelectorAll('[data-compare-id]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.compareId;
      const idx = state.compareIds.indexOf(id);
      if(idx>-1) state.compareIds.splice(idx,1); else state.compareIds.push(id);
      renderSrezy(s);
    };
  });
  c.querySelectorAll('[data-restore-id]').forEach(el=>{
    el.onclick = ()=>{
      const srez = s.srezy.find(x=>x.id===el.dataset.restoreId);
      if(!srez) return;
      if(!confirm(`Сделать значения из среза ${srez.date} текущими? Текущие оценки будут перезаписаны для совпадающих тем.`)) return;
      srez.topics.forEach(st=>{
        const cur = s.topics.find(t=>t.name===st.name && t.level===st.level);
        if(cur) cur.score = st.score;
      });
      saveData(); renderSrezy(s);
    };
  });
  c.querySelectorAll('[data-delete-id]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.deleteId;
      const srez = s.srezy.find(x=>x.id===id);
      if(!srez) return;
      if(!confirm(`Удалить срез от ${srez.date} из истории? Это действие необратимо.`)) return;
      s.srezy = s.srezy.filter(x=>x.id!==id);
      state.compareIds = state.compareIds.filter(cid=>cid!==id);
      saveData(); renderSrezy(s);
    };
  });

  attachTopicPickerHandlers(s, c);
  attachHandlers(s, c, levelTopics);
}

function renderAddTopicWidget(s, level){
  const options = availableToAdd(s, level);
  return `
    <div class="add-topic-wrap">
      <button class="add-topic-plus" id="addTopicPlus" title="Добавить тему">+</button>
      <span class="add-topic-label">Добавить тему в ${LEVEL_LABELS[level]}</span>
      ${state.topicPickerOpen ? `
        <div class="topic-popover">
          <div class="topic-popover-title">Из каталога методики</div>
          ${options.length
            ? `<div class="topic-pick-list">${options.map(n=>`<span class="topic-pick-item" data-pick-name="${n}">${n}</span>`).join('')}</div>`
            : `<div class="topic-pick-empty">Все темы каталога уже добавлены.</div>`
          }
          <div class="custom-topic-row">
            <input type="text" class="custom-topic-input" id="customTopicInput" placeholder="Своя тема (если нужной нет в списке)">
            <button class="custom-topic-btn" id="customTopicBtn">Добавить</button>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function attachTopicPickerHandlers(s, c){
  const plusBtn = document.getElementById('addTopicPlus');
  if(plusBtn){
    plusBtn.onclick = ()=>{ state.topicPickerOpen = !state.topicPickerOpen; renderSrezy(s); };
  }
  c.querySelectorAll('[data-pick-name]').forEach(el=>{
    el.onclick = ()=>{
      s.topics.push({name: el.dataset.pickName, level: state.activeLevel, score:null});
      state.topicPickerOpen = false;
      saveData(); renderSrezy(s);
    };
  });
  const customBtn = document.getElementById('customTopicBtn');
  if(customBtn){
    customBtn.onclick = ()=>{
      const input = document.getElementById('customTopicInput');
      const name = input.value.trim();
      if(!name) return;
      if(s.topics.some(t=>t.name===name && t.level===state.activeLevel)){
        alert('Такая тема уже добавлена в этот уровень.');
        return;
      }
      s.topics.push({name, level: state.activeLevel, score:null});
      state.topicPickerOpen = false;
      saveData(); renderSrezy(s);
    };
  }
}

function attachHandlers(s, c, levelTopics){
  c.querySelectorAll('[data-topic-remove]').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      const i = parseInt(el.dataset.topicRemove);
      const topic = levelTopics[i];
      const idx = s.topics.findIndex(t=>t.name===topic.name && t.level===topic.level);
      if(idx>-1) s.topics.splice(idx,1);
      saveData(); renderSrezy(s);
    };
  });
  // Ввод оценки темы одной цифрой: нажатие 0-9 сразу ставит значение и
  // переводит фокус на следующую тему — без Enter и без риска напечатать
  // "45" вместо "5". "10" собирается из "1"+"0" в окне ~450мс, иначе "1"
  // фиксируется сам по себе, а следующая цифра обрабатывается уже как
  // новый ввод (в то же или уже следующее поле).
  const applyScoreDigit = (el, v)=>{
    const i = parseInt(el.dataset.numI);
    levelTopics[i].score = v;
    saveData();
    renderSrezy(s);
    const next = document.querySelector(`[data-num-i="${i+1}"]`);
    if(next) next.focus();
  };
  const handleDigitKey = (el, key)=>{
    if(scorePendingOne && scorePendingOne.el===el){
      clearTimeout(scorePendingOne.timer);
      const wasEl = scorePendingOne.el;
      scorePendingOne = null;
      if(key==='0'){ applyScoreDigit(wasEl, 10); return; }
      applyScoreDigit(wasEl, 1);
      const nextFocused = document.activeElement;
      if(nextFocused && nextFocused.matches('[data-num-i]')) handleDigitKey(nextFocused, key);
      return;
    }
    if(key==='1'){
      el.value = '1';
      scorePendingOne = { el, timer: setTimeout(()=>{ scorePendingOne=null; applyScoreDigit(el, 1); }, 450) };
      return;
    }
    applyScoreDigit(el, parseInt(key, 10));
  };
  c.querySelectorAll('[data-num-i]').forEach(el=>{
    el.onfocus = ()=>{
      // Если фокус пришёл не от навигации стрелками (а кликом/табом) —
      // режим перехода стрелками сбрасывается.
      if(scoreNavMode && !el.classList.contains('nav-mode')){
        scoreNavMode = false;
        document.querySelectorAll('.score-input.nav-mode').forEach(n=>n.classList.remove('nav-mode'));
      }
    };
    el.onblur = ()=>{
      if(scorePendingOne && scorePendingOne.el===el){
        clearTimeout(scorePendingOne.timer);
        const wasEl = scorePendingOne.el;
        scorePendingOne = null;
        applyScoreDigit(wasEl, 1);
      }
    };
    el.onkeydown = (ev)=>{
      // Enter включает/выключает режим перехода по темам стрелками ↑/↓
      // (вместо ввода цифры) — удобно, если нужно перепрыгнуть на другую
      // тему без ввода оценки в каждой по пути.
      if(ev.key==='Enter'){
        ev.preventDefault();
        scoreNavMode = !scoreNavMode;
        el.classList.toggle('nav-mode', scoreNavMode);
        return;
      }
      if(scoreNavMode && (ev.key==='ArrowUp' || ev.key==='ArrowDown')){
        ev.preventDefault();
        const i = parseInt(el.dataset.numI);
        const target = document.querySelector(`[data-num-i="${ev.key==='ArrowUp' ? i-1 : i+1}"]`);
        if(target){
          el.classList.remove('nav-mode');
          target.classList.add('nav-mode');
          target.focus();
        }
        return;
      }
      if(/^[0-9]$/.test(ev.key)){
        ev.preventDefault();
        scoreNavMode = false;
        el.classList.remove('nav-mode');
        handleDigitKey(el, ev.key);
        return;
      }
      if(ev.key==='Backspace' || ev.key==='Delete'){
        ev.preventDefault();
        const i = parseInt(el.dataset.numI);
        levelTopics[i].score = null;
        saveData(); renderSrezy(s);
        const again = document.querySelector(`[data-num-i="${i}"]`);
        if(again) again.focus();
        return;
      }
      if(ev.key!=='Tab') ev.preventDefault();
    };
  });
}
let scorePendingOne = null;
let scoreNavMode = false;

function renderWheelCompare(topics, compareList, isAll){
  const n = Math.max(topics.length,1);
  const size = isAll ? Math.max(360, n*11) : 280;
  const center = size/2;
  const maxR = isAll ? Math.max(140, n*6.2) : 105;
  const maxScore = 10;
  const angleStep = (2*Math.PI)/n;
  let grid = '', labels = '', dots = '';

  for(let ring=2; ring<=maxScore; ring+=2){
    const r = (ring/maxScore)*maxR;
    grid += `<circle cx="${center}" cy="${center}" r="${r}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  // Считаем позиции подписей заранее и разводим их по вертикали внутри
  // каждой стороны (лево/право/верх/низ), чтобы при плотной раскладке
  // (много тем) соседние подписи не наезжали друг на друга текстом —
  // чистая радиальная расстановка на это не рассчитана.
  const labelPos = topics.map((t,i)=>{
    const angle = -Math.PI/2 + i*angleStep;
    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    const anchor = cosA > 0.2 ? 'start' : (cosA < -0.2 ? 'end' : 'middle');
    const r2 = maxR + 20;
    return { t, i, angle, anchor, sinA, lx: center + r2*Math.cos(angle), ly: center + r2*Math.sin(angle) };
  });
  if(isAll){
    const minGap = 12;
    const declutter = (group)=>{
      group.sort((a,b)=>a.ly-b.ly);
      for(let k=1;k<group.length;k++){
        if(group[k].ly - group[k-1].ly < minGap) group[k].ly = group[k-1].ly + minGap;
      }
    };
    declutter(labelPos.filter(p=>p.anchor==='start'));
    declutter(labelPos.filter(p=>p.anchor==='end'));
    declutter(labelPos.filter(p=>p.anchor==='middle' && p.sinA<0));
    declutter(labelPos.filter(p=>p.anchor==='middle' && p.sinA>=0));
  }
  // Декluttер двигает подписи только по вертикали и может затолкать их
  // обратно к центру — подстраховка: ни одна подпись не должна оказаться
  // ближе к центру, чем кольцо колеса (иначе текст залезает на диаграмму).
  const minLabelR = maxR + 14;
  labelPos.forEach(p=>{
    const dx = p.lx - center, dy = p.ly - center;
    const dist = Math.hypot(dx, dy);
    if(dist > 0 && dist < minLabelR){
      const scale = minLabelR / dist;
      p.lx = center + dx*scale;
      p.ly = center + dy*scale;
    }
  });
  labelPos.forEach(({t,i,angle,anchor,lx,ly})=>{
    const ex = center + maxR*Math.cos(angle), ey = center + maxR*Math.sin(angle);
    grid += `<line x1="${center}" y1="${center}" x2="${ex}" y2="${ey}" stroke="var(--line)" stroke-width="1"/>`;
    const shortName = shortLabelFor(t);
    labels += `<text x="${lx}" y="${ly}" font-size="9" fill="${isAll?LEVEL_COLORS[t.level]:'var(--muted)'}" font-weight="${isAll?'700':'500'}" text-anchor="${anchor}" dominant-baseline="middle">${shortName}</text>`;
  });

  function pointsFor(list){
    return list.map((t,i)=>{
      const score = t.score ?? 0;
      const r = (score/maxScore)*maxR;
      const angle = -Math.PI/2 + i*angleStep;
      return {x: center + r*Math.cos(angle), y: center + r*Math.sin(angle)};
    });
  }

  const curPts = pointsFor(topics);
  curPts.forEach((p,i)=>{ dots += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${isAll?LEVEL_COLORS[topics[i].level]:scoreColor(topics[i].score)}"/>`; });
  const curPoly = curPts.map(p=>`${p.x},${p.y}`).join(' ');

  let comparePolys = '';
  compareList.forEach((cs,idx)=>{
    const aligned = topics.map(t=> cs.topics.find(pt=>pt.name===t.name) || {name:t.name, score:0});
    const pts = pointsFor(aligned);
    const color = COMPARE_PALETTE[idx % COMPARE_PALETTE.length];
    comparePolys += `<polygon points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-dasharray="5,3"/>`;
  });

  const pad = isAll ? 320 : 100;
  return `<svg width="100%" height="auto" style="display:block;max-width:${size+pad}px;" viewBox="-${pad/2} -${pad*0.35} ${size+pad} ${size+pad*0.7}">
    ${grid}${comparePolys}
    <polygon points="${curPoly}" fill="rgba(174,95,63,0.12)" stroke="var(--terracotta)" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

/* ============================================================
   REPERTOIRE TAB — список песен ученика с тёмным плеером
   (раздельные дорожки «Голос»/«Музыка», метки, текст песни).
   Собрано строго по присланному эталону (Репертуар.dc.html) и ПРОМТу.
   Бэкенд: /api/player-tracks (Postgres, таблица player_tracks).
   Аудио хранится как data: URL (base64), как и остальные записи в
   проекте — переход на Vercel Blob сознательно отложен (см. ПРОМТ).
   ============================================================ */
const REP_STATUS = {
  work: ['в работе', '#9A6A1F', '#F6EFE2'],
  ready: ['готова', '#4C7A45', '#EFF5EE'],
  hold: ['отложена', '#8A7E74', '#F0EAE1']
};
const REP_SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];

// Дорожки воспроизведения — два постоянных элемента вне цикла рендера,
// чтобы полный перерисовка карточки (смена полей, статуса, меток) не
// прерывала воспроизведение. <video>, а не <audio>: на iOS Safari <audio>
// заглушается аппаратным переключателем «Звонок/Бесшумно», видео — нет
// (тот же приём, что и vrTakeRowDark/Light в плеере записей урока).
let repVideoVoice = null, repVideoMusic = null;
function repVideoFor(kind){
  if(kind==='voice'){
    if(!repVideoVoice){
      repVideoVoice = document.createElement('video');
      repVideoVoice.setAttribute('playsinline',''); repVideoVoice.setAttribute('webkit-playsinline','');
      repVideoVoice.preload = 'metadata'; repVideoVoice.style.display = 'none';
      document.body.appendChild(repVideoVoice);
    }
    return repVideoVoice;
  }
  if(!repVideoMusic){
    repVideoMusic = document.createElement('video');
    repVideoMusic.setAttribute('playsinline',''); repVideoMusic.setAttribute('webkit-playsinline','');
    repVideoMusic.preload = 'metadata'; repVideoMusic.style.display = 'none';
    document.body.appendChild(repVideoMusic);
  }
  return repVideoMusic;
}
// Безопасно вызывать на каждый тик — не трогает src/currentTime, если
// дорожка уже указывает на этот же файл этой же песни.
function repSyncVideoSrc(song, kind){
  const url = (song[kind] && song[kind].url) || '';
  if(!url) return null;
  const v = repVideoFor(kind);
  const tag = song.id + '::' + url;
  if(v.dataset.repTag !== tag){
    v.pause();
    v.src = url;
    v.dataset.repTag = tag;
  }
  return v;
}
function repPauseAll(){
  if(repVideoVoice) repVideoVoice.pause();
  if(repVideoMusic) repVideoMusic.pause();
}

function repCache(s){ return state.repCache[s.id] || (state.repCache[s.id] = {songs: null}); }

function renderRepertoire(s){
  const c = document.getElementById('tabContent');
  const cache = repCache(s);
  if(cache.songs){ repRenderAll(s); return; }
  c.innerHTML = `<div class="kb-loading">Загружаю репертуар…</div>`;
  apiGet('/api/player-tracks?studentId=' + encodeURIComponent(s.id)).then(res=>{
    cache.songs = res.songs || [];
    if(!state.repSel[s.id] && cache.songs.length) state.repSel[s.id] = cache.songs[0].id;
    repRenderAll(s);
  }).catch(err=>{
    c.innerHTML = `<div class="card-error">Не удалось загрузить репертуар: ${String(err.message||err)}. Проверьте подключение базы Postgres в настройках Vercel.</div>`;
  });
}

function repFmt(t){ t = Math.max(0, Math.round(t||0)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); }
function repMmss(t){ t = Math.max(0, Math.floor(t||0)); return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0'); }
function repDur(song){ return Math.max(song.voice ? song.voice.durationSec||0 : 0, song.music ? song.music.durationSec||0 : 0); }
function repPlural(n){ const a = n%10, b = n%100; return n + ' ' + (a===1 && b!==11 ? 'строка' : a>=2 && a<=4 && (b<12||b>14) ? 'строки' : 'строк'); }

function repPatch(s, song, patch){
  Object.assign(song, patch);
  const chain = (state.repSaveChain[song.id] || Promise.resolve()).then(()=>
    apiSend('/api/player-tracks?id=' + encodeURIComponent(song.id), 'PATCH', patch).then(res=>{
      if(res && res.song) Object.assign(song, res.song);
    }).catch(err=>{ alert('Не удалось сохранить: ' + (err.message||err)); })
  );
  state.repSaveChain[song.id] = chain.catch(()=>{});
  return chain;
}

function repAddSong(s){
  apiSend('/api/player-tracks', 'POST', {studentId: s.id}).then(res=>{
    const cache = repCache(s);
    cache.songs = (cache.songs||[]).concat([res.song]);
    state.repSel[s.id] = res.song.id;
    state.repConfirmDelete = null;
    repRenderAll(s);
  }).catch(err=> alert('Не удалось создать песню: ' + (err.message||err)));
}

function repDeleteClick(s, song){
  if(state.repConfirmDelete !== song.id){ state.repConfirmDelete = song.id; repRenderAll(s); return; }
  if(state.repPlay.id === song.id){ repPauseAll(); state.repPlay = {id:null, on:false, pos:0}; }
  apiSend('/api/player-tracks?id=' + encodeURIComponent(song.id), 'DELETE', {}).then(()=>{
    const cache = repCache(s);
    cache.songs = (cache.songs||[]).filter(x=>x.id!==song.id);
    state.repConfirmDelete = null;
    const first = cache.songs[0];
    state.repSel[s.id] = first ? first.id : null;
    repRenderAll(s);
  }).catch(err=> alert('Не удалось удалить: ' + (err.message||err)));
}

async function repRecomputePeaks(s, song){
  const urls = ['voice','music'].map(k=> song[k] && song[k].url).filter(Boolean);
  let peaks = [];
  if(urls.length){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const N = 90, out = new Array(N).fill(0);
      for(const u of urls){
        const buf = await ctx.decodeAudioData(await (await fetch(u)).arrayBuffer());
        const ch = buf.getChannelData(0);
        const step = Math.floor(ch.length/N) || 1;
        for(let i=0;i<N;i++){
          let m = 0;
          for(let j=i*step; j<(i+1)*step && j<ch.length; j+=16) m = Math.max(m, Math.abs(ch[j]));
          out[i] = Math.max(out[i], m);
        }
      }
      ctx.close();
      const mx = Math.max(...out) || 1;
      peaks = out.map(v=> v/mx);
    } catch(e){ peaks = []; }
  }
  await repPatch(s, song, {peaks});
  repRenderAll(s);
}

function repUploadTrack(s, song, kind){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      const probe = document.createElement('audio');
      probe.preload = 'metadata';
      probe.onloadedmetadata = ()=>{
        const durationSec = probe.duration || 0;
        if(state.repPlay.id === song.id){ repPauseAll(); state.repPlay = {id:null, on:false, pos:0}; }
        repPatch(s, song, {[kind]: {name: f.name, url: dataUrl, durationSec}}).then(()=>{
          repRenderAll(s);
          repRecomputePeaks(s, song);
        });
      };
      probe.src = dataUrl;
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}
function repRemoveTrack(s, song, kind){
  if(state.repPlay.id === song.id){ repPauseAll(); state.repPlay = {id:null, on:false, pos:0}; }
  repPatch(s, song, {[kind]: null}).then(()=>{
    repRenderAll(s);
    repRecomputePeaks(s, song);
  });
}

function repToggle(song){
  if(!song.voice && !song.music) return;
  const p = state.repPlay;
  const vv = repSyncVideoSrc(song,'voice'), vm = repSyncVideoSrc(song,'music');
  const vol = song.volumes || {voice:80, music:80};
  const rate = state.repRates[song.id] || 1;
  if(vv){ vv.playbackRate = rate; vv.volume = (vol.voice!=null?vol.voice:80)/100; }
  if(vm){ vm.playbackRate = rate; vm.volume = (vol.music!=null?vol.music:80)/100; }
  if(p.id === song.id && p.on){
    repPauseAll();
    state.repPlay = {...p, on:false};
    repPaintPlayback(song);
    return;
  }
  repPauseAll();
  const pos = p.id === song.id ? p.pos : 0;
  if(vv){ vv.currentTime = pos; vv.play().catch(()=>{}); }
  if(vm){ vm.currentTime = pos; vm.play().catch(()=>{}); }
  state.repPlay = {id: song.id, on:true, pos};
  repPaintPlayback(song);
  repStartTimer();
}
function repSeekTo(song, pos){
  const vv = repSyncVideoSrc(song,'voice'), vm = repSyncVideoSrc(song,'music');
  if(vv) vv.currentTime = pos;
  if(vm) vm.currentTime = pos;
  const p = state.repPlay;
  if(p.id !== song.id && p.on) repPauseAll();
  state.repPlay = {id: song.id, on: p.id===song.id ? p.on : false, pos};
  repPaintPlayback(song);
}
function repSeekFromEvent(song, e){
  const d = repDur(song); if(!d) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pos = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width)) * d;
  repSeekTo(song, pos);
}
function repStartTimer(){
  clearInterval(state.repTimerHandle);
  state.repTimerHandle = setInterval(()=>{
    const p = state.repPlay;
    if(!p.on){ clearInterval(state.repTimerHandle); return; }
    const s = state.data.students.find(x=>x.id===state.activeStudentId);
    if(!s){ clearInterval(state.repTimerHandle); return; }
    const cache = repCache(s);
    const song = (cache.songs||[]).find(x=>x.id===p.id);
    if(!song){ repPauseAll(); state.repPlay = {id:null, on:false, pos:0}; clearInterval(state.repTimerHandle); return; }
    const vv = song.voice ? repSyncVideoSrc(song,'voice') : null;
    const vm = song.music ? repSyncVideoSrc(song,'music') : null;
    const pos = vv ? vv.currentTime : (vm ? vm.currentTime : p.pos);
    const d = repDur(song);
    if(d && pos >= d - 0.05){
      repPauseAll();
      state.repPlay = {id: song.id, on:false, pos:0};
      repPaintPlayback(song);
      clearInterval(state.repTimerHandle);
      return;
    }
    state.repPlay = {...p, pos};
    repPaintPlayback(song);
  }, 200);
}
// Точечное обновление волны/времени/кнопки play — без перерисовки всей
// карточки, чтобы тик таймера (5 раз/сек) не дёргал DOM лишний раз.
function repPaintPlayback(song){
  const wave = document.getElementById('repWave');
  if(!wave || wave.getAttribute('data-song-id') !== song.id) return;
  const p = state.repPlay;
  const mine = p.id === song.id;
  const d = repDur(song);
  const prog = d && mine ? p.pos/d : 0;
  const peaks = (song.peaks && song.peaks.length===90) ? song.peaks : new Array(90).fill(0);
  const bars = wave.querySelectorAll('.rep-bar');
  bars.forEach((bar,i)=>{
    const played = d>0 && (i+0.5)/peaks.length <= prog;
    bar.style.background = played ? '#C97B62' : '#5E554C';
  });
  const timeEl = document.getElementById('repTimeText');
  if(timeEl) timeEl.textContent = repFmt(mine?p.pos:0) + ' / ' + repMmss(d);
  const btn = document.getElementById('repPlayBtn');
  if(btn){
    btn.textContent = (mine && p.on) ? '❚❚' : '▶';
    btn.style.background = (song.voice||song.music) ? '#A8452C' : '#CFC4B8';
  }
}

function repAddMarker(s, song){
  const d = repDur(song); if(!d) return;
  const mine = state.repPlay.id === song.id;
  const t = Math.round((mine?state.repPlay.pos:0)*10)/10;
  const markers = (song.markers||[]).concat([{t, label:'Метка ' + ((song.markers||[]).length+1)}]).sort((a,b)=>a.t-b.t);
  repPatch(s, song, {markers}).then(()=> repRenderAll(s));
}
function repRemoveMarker(s, song, idx){
  const markers = (song.markers||[]).filter((_,i)=>i!==idx);
  repPatch(s, song, {markers}).then(()=> repRenderAll(s));
}

function repSetRate(s, song, r){
  state.repRates[song.id] = r;
  if(repVideoVoice && repVideoVoice.dataset.repTag && repVideoVoice.dataset.repTag.indexOf(song.id+'::')===0) repVideoVoice.playbackRate = r;
  if(repVideoMusic && repVideoMusic.dataset.repTag && repVideoMusic.dataset.repTag.indexOf(song.id+'::')===0) repVideoMusic.playbackRate = r;
  repRenderAll(s);
}

function repSetStatus(s, song, status){
  repPatch(s, song, {status});
  state.repStatusOpen = null;
  repRenderAll(s);
}

function repCardHtml(song){
  const d = repDur(song);
  const peaks = (song.peaks && song.peaks.length===90) ? song.peaks : new Array(90).fill(0);
  const p = state.repPlay;
  const mine = p.id === song.id;
  const prog = d && mine ? p.pos/d : 0;
  const bars = peaks.map((v,i)=>{
    const h = Math.max(8, Math.round(v*47)) + 'px';
    const played = d>0 && (i+0.5)/peaks.length <= prog;
    return `<div class="rep-bar" style="height:${h};background:${played?'#C97B62':'#5E554C'};"></div>`;
  }).join('');
  const pins = d ? (song.markers||[]).map(m=> `<div class="rep-pin" style="left:${Math.min(100,(m.t/d)*100)}%;"></div>`).join('') : '';
  const timeText = repFmt(mine?p.pos:0) + ' / ' + repMmss(d);
  const playIcon = (mine && p.on) ? '❚❚' : '▶';
  const playBg = (song.voice||song.music) ? '#A8452C' : '#CFC4B8';
  const rate = state.repRates[song.id] || 1;
  const speedBtns = REP_SPEEDS.map(r=>{
    const on = rate===r;
    return `<button type="button" class="rep-speed-btn${on?' on':''}" data-rep-speed="${r}">${r}×</button>`;
  }).join('');
  const chips = (song.markers||[]).map((m,i)=> `
    <div class="rep-chip">
      <button type="button" class="rep-chip-text" data-rep-marker-seek="${i}">${repMmss(m.t)} ${m.label}</button>
      <button type="button" class="rep-chip-remove" data-rep-marker-remove="${i}" title="Удалить метку">✕</button>
    </div>`).join('');

  const all = song.lyrics ? song.lyrics.split('\n') : [];
  const nonEmptyCount = all.filter(l=>l.trim()).length;
  const open = !!state.repOpenLyrics[song.id];
  const editing = !!state.repEditLyrics[song.id];
  const lines = (open ? all : all.slice(0,3)).map(t=> `<div class="rep-lyrics-line">${t}</div>`).join('');
  const editLabel = editing ? 'Готово' : (nonEmptyCount ? 'Изменить текст' : 'Вставить текст');
  const delConfirm = state.repConfirmDelete === song.id;

  return `
    <div class="rep-card">
      <div class="rep-player">
        <div class="rep-player-head">
          <div style="flex:1;min-width:0;">
            <input class="rep-title-input" id="repTitleInput" value="${song.title||''}" placeholder="Название песни">
            <input class="rep-artist-input" id="repArtistInput" value="${song.artist||''}" placeholder="Имя артиста">
          </div>
          <div class="rep-key-wrap">
            <div class="rep-key-label">Тональность</div>
            <div class="rep-key-val">${song.key || '—'}</div>
          </div>
        </div>
        <div class="rep-controls">
          <div class="rep-transport">
            <button type="button" class="rep-play-btn" id="repPlayBtn" style="background:${playBg};">${playIcon}</button>
            <div class="rep-wave" id="repWave" data-song-id="${song.id}">${bars}${pins}</div>
          </div>
          <div class="rep-sub-row">
            <span class="rep-time" id="repTimeText">${timeText}</span>
            ${speedBtns}
          </div>
          <div class="rep-markers-row">
            ${chips}
            <button type="button" class="rep-marker-add" id="repMarkerAdd">+ Метка</button>
          </div>
        </div>
        <div class="rep-tracks">
          ${repTrackRowHtml(song,'voice','ГОЛОС')}
          ${repTrackRowHtml(song,'music','МУЗЫКА')}
        </div>
      </div>

      <div class="rep-fields">
        <label class="rep-field-label">
          <span>Тональность</span>
          <input class="rep-field-input" id="repKeyInput" value="${song.key||''}" placeholder="напр. Am">
        </label>
        <label class="rep-field-label">
          <span>Дата начала</span>
          <input class="rep-field-input date" id="repStartInput" type="date" lang="ru" value="${song.startDate||''}">
        </label>
        <label class="rep-field-label">
          <span>Ссылка на Moises</span>
          <div class="rep-link-row">
            <input class="rep-link-input" id="repLinkInput" value="${song.moisesLink||''}" placeholder="https://studio.moises.ai/…">
            ${song.moisesLink ? `<a class="rep-link-badge" href="${song.moisesLink}" target="_blank" rel="noopener">Moises ↗</a>` : ''}
          </div>
        </label>
      </div>

      <div class="rep-lyrics">
        <div class="rep-lyrics-head">
          <div class="rep-lyrics-title">Текст песни · ${nonEmptyCount ? repPlural(nonEmptyCount) : 'пусто'}</div>
          <button type="button" class="rep-lyrics-edit-btn" id="repLyricsEditBtn">${editLabel}</button>
        </div>
        ${editing ? `
          <textarea class="rep-lyrics-textarea" id="repLyricsTextarea" rows="12" placeholder="Вставьте текст песни. Каждая строка с новой строки, куплеты разделяйте пустой строкой.">${song.lyrics||''}</textarea>
          <div class="rep-lyrics-hint">Этот текст увидит ученик в приложении.</div>
        ` : (nonEmptyCount ? `
          <div class="rep-lyrics-box">
            <div class="rep-lyrics-lines">${lines}</div>
            ${all.length>3 ? `<button type="button" class="rep-lyrics-more" id="repLyricsMore">${open?'Свернуть':'Показать весь текст'}</button>` : ''}

        <textarea class="rep-notes-textarea" id="repNotesInput" rows="3" placeholder="Сложные места, на что обратить внимание…">${song.notes||''}</textarea>
      </label>

      <div class="rep-delete-row">
        <button type="button" class="rep-delete-btn${delConfirm?' confirm':''}" id="repDeleteBtn">${delConfirm?'Точно удалить песню? Нажмите ещё раз':'Удалить песню'}</button>

}

function repRenderAll(s){
  const c = document.getElementById('tabContent');
  const cache = repCache(s);
  const songs = cache.songs || [];
  const selId = state.repSel[s.id];
  const song = songs.find(x=>x.id===selId) || songs[0] || null;
  if(song && state.repSel[s.id] !== song.id) state.repSel[s.id] = song.id;
  c.innerHTML = `<div class="rep-grid">${repListHtml(songs, song)}${song ? repCardHtml(song) : '<div class="rep-empty">Песен пока нет. Нажмите «+ Добавить песню».</div>'}</div>`;
  repWireList(s, songs);
  if(song) repWireCard(s, song);
}

function repWireList(s, songs){
  const c = document.getElementById('tabContent');
  const addBtn = document.getElementById('repAddBtn');
  if(addBtn) addBtn.onclick = ()=> repAddSong(s);
  songs.forEach(song=>{
    const row = c.querySelector(`[data-rep-row="${song.id}"]`);
    if(row) row.onclick = (e)=>{
      if(e.target.closest('.rep-status-wrap')) return;
      state.repSel[s.id] = song.id;
      state.repConfirmDelete = null;
      state.repStatusOpen = null;
      repRenderAll(s);
    };
    const statusBtn = c.querySelector(`[data-rep-status-btn="${song.id}"]`);
    if(statusBtn) statusBtn.onclick = (e)=>{
      e.stopPropagation();
      state.repStatusOpen = state.repStatusOpen===song.id ? null : song.id;
      repRenderAll(s);
    };
    c.querySelectorAll(`[data-rep-status-opt="${song.id}"]`).forEach(btn=>{
      btn.onclick = (e)=>{ e.stopPropagation(); repSetStatus(s, song, btn.dataset.status); };
    });
  });
}

function repWireCard(s, song){
  const c = document.getElementById('tabContent');
  const titleInp = document.getElementById('repTitleInput');
  if(titleInp) titleInp.onblur = e=>{ repPatch(s, song, {title: e.target.value}).then(()=> repRenderAll(s)); };
  const artistInp = document.getElementById('repArtistInput');
  if(artistInp) artistInp.onblur = e=>{ repPatch(s, song, {artist: e.target.value}).then(()=> repRenderAll(s)); };
  const keyInp = document.getElementById('repKeyInput');
  if(keyInp) keyInp.onblur = e=>{ repPatch(s, song, {key: e.target.value}).then(()=> repRenderAll(s)); };
  const startInp = document.getElementById('repStartInput');
  if(startInp) startInp.onchange = e=>{ repPatch(s, song, {startDate: e.target.value}); };
  const linkInp = document.getElementById('repLinkInput');
  if(linkInp) linkInp.onblur = e=>{ repPatch(s, song, {moisesLink: e.target.value}).then(()=> repRenderAll(s)); };
  const notesInp = document.getElementById('repNotesInput');
  if(notesInp) notesInp.onblur = e=>{ repPatch(s, song, {notes: e.target.value}); };

  const playBtn = document.getElementById('repPlayBtn');
  if(playBtn) playBtn.onclick = ()=> repToggle(song);
  const wave = document.getElementById('repWave');
  if(wave) wave.onclick = e=> repSeekFromEvent(song, e);

  c.querySelectorAll('[data-rep-speed]').forEach(btn=>{
    btn.onclick = ()=> repSetRate(s, song, parseFloat(btn.dataset.repSpeed));
  });
  const markerAdd = document.getElementById('repMarkerAdd');
  if(markerAdd) markerAdd.onclick = ()=> repAddMarker(s, song);
  c.querySelectorAll('[data-rep-marker-seek]').forEach(btn=>{
    btn.onclick = ()=>{ const m = (song.markers||[])[parseInt(btn.dataset.repMarkerSeek)]; if(m) repSeekTo(song, m.t); };
  });
  c.querySelectorAll('[data-rep-marker-remove]').forEach(btn=>{
    btn.onclick = ()=> repRemoveMarker(s, song, parseInt(btn.dataset.repMarkerRemove));
  });

  ['voice','music'].forEach(kind=>{
    const uploadBtn = c.querySelector(`[data-rep-upload="${kind}"]`);
    if(uploadBtn) uploadBtn.onclick = ()=> repUploadTrack(s, song, kind);
    const removeBtn = c.querySelector(`[data-rep-remove="${kind}"]`);
    if(removeBtn) removeBtn.onclick = ()=> repRemoveTrack(s, song, kind);
    const volInp = c.querySelector(`[data-rep-vol="${kind}"]`);
    if(volInp){
      volInp.oninput = e=>{
        const v = parseInt(e.target.value);
        const video = kind==='voice' ? repVideoVoice : repVideoMusic;
        if(video) video.volume = v/100;
        const valEl = document.getElementById('repVolVal_'+kind);
        if(valEl) valEl.textContent = v + '%';
      };
      volInp.onchange = e=>{
        const v = parseInt(e.target.value);
        const volumes = Object.assign({voice:80,music:80}, song.volumes, {[kind]: v});
        repPatch(s, song, {volumes});
      };
    }
  });

  const lyricsEditBtn = document.getElementById('repLyricsEditBtn');
  if(lyricsEditBtn) lyricsEditBtn.onclick = ()=>{
    const wasEditing = !!state.repEditLyrics[song.id];
    if(wasEditing){
      const ta = document.getElementById('repLyricsTextarea');
      const lyrics = ta ? ta.value : song.lyrics;
      repPatch(s, song, {lyrics});
    }
    state.repEditLyrics[song.id] = !wasEditing;
    repRenderAll(s);
  };
  const lyricsAdd = document.getElementById('repLyricsAdd');
  if(lyricsAdd) lyricsAdd.onclick = ()=>{ state.repEditLyrics[song.id] = true; repRenderAll(s); };
  const lyricsMore = document.getElementById('repLyricsMore');
  if(lyricsMore) lyricsMore.onclick = ()=>{ state.repOpenLyrics[song.id] = !state.repOpenLyrics[song.id]; repRenderAll(s); };

  const deleteBtn = document.getElementById('repDeleteBtn');
  if(deleteBtn) deleteBtn.onclick = ()=> repDeleteClick(s, song);

  repPaintPlayback(song);
}

/* ============================================================
   CARD TAB — Анкета (первичная) + Динамика по занятиям
   Реальный бэкенд: /api/intake и /api/lessons (Postgres)
   ============================================================ */

async function apiGet(url){
  const r = await fetch(url);
  if(!r.ok){ const t = await r.text().catch(()=> ''); throw new Error('HTTP '+r.status+' '+t); }
  return r.json();
}
async function apiSend(url, method, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if(!r.ok){ const t = await r.text().catch(()=> ''); throw new Error('HTTP '+r.status+' '+t); }
  return r.json();
}

/* ============================================================
   РАСПЕВКИ — вкладка «Распевки»: общая библиотека разогревочных
   упражнений, ОДНА ДЛЯ ВСЕХ учеников (не привязана к studentId).
   Реальный бэкенд: /api/warmups. Аудио хранится как data: URL —
   тот же приём, что и везде в проекте (takes/player_tracks), пики
   волны считаются один раз при добавлении аудио через
   AudioContext.decodeAudioData (как в Репертуаре).
   Темп меняется реально (playbackRate + preservesPitch — скорость
   без изменения высоты тона). Тональность (семитоны) пока только
   показывает ноту в UI и не трогает сам звук — независимый
   pitch-shift без смены темпа требует отдельного DSP (фазовый
   вокодер), осознанно не реализован в этой итерации.
   ============================================================ */

const WU_LEVELS = [
  { k:'A', name:'Уровень A', hint:'База: дыхание, разогрев, ретракция', color:'var(--lvlA)' },
  { k:'B', name:'Уровень B', hint:'Контроль: опора, переходы, твэнг', color:'var(--lvlB)' },
  { k:'C', name:'Уровень C', hint:'Сцена: микст, динамика, стаккато', color:'var(--lvlC)' },
  { k:'D', name:'Уровень D', hint:'Репертуар: текст, подача, запись', color:'var(--lvlD)' }
];
const WU_TOPICS = ['Дыхание','Разогрев','Ретракция','Опора','Переходы','Твэнг','Микст','Динамика','Стаккато','Подача'];
const WU_KEYS = ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];

function wuFmt(sec){ sec = Math.max(0, Math.floor(sec||0)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function wuPlural(n, a, b, c){ const m10=n%10, m100=n%100; return m10===1 && m100!==11 ? a : (m10>=2&&m10<=4&&(m100<10||m100>=20)) ? b : c; }
function wuUid(){ return 'wa'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function wuEsc(str){ return (str||'').replace(/"/g,'&quot;'); }

function loadWarmupsLib(){
  if(state.warmupsLib) return Promise.resolve(state.warmupsLib);
  if(state._warmupsLoading) return state._warmupsLoading;
  state._warmupsLoading = apiGet('/api/warmups').then(res=>{
    state.warmupsLib = res.warmups || [];
    state._warmupsLoading = null;
    return state.warmupsLib;
  }).catch(err=>{ state._warmupsLoading = null; throw err; });
  return state._warmupsLoading;
}

function renderWarmups(s){
  const c = document.getElementById('tabContent');
  if(state.warmupsLib){ paintWarmups(s); return; }
  c.innerHTML = `<div class="kb-loading">Загружаю распевки…</div>`;
  loadWarmupsLib().then(()=> paintWarmups(s)).catch(err=>{
    c.innerHTML = `<div class="card-error">Не удалось загрузить распевки: ${String(err.message||err)}. Проверьте подключение базы Postgres в настройках Vercel.</div>`;
  });
}
function paintWarmupsActive(){
  const s = state.data.students.find(x=>x.id===state.activeStudentId);
  if(s && state.activeTab==='warm') paintWarmups(s);
}

function wuByLevel(k){ return (state.warmupsLib||[]).filter(w=>w.level===k).sort((a,b)=> (a.sortOrder-b.sortOrder) || String(a.id).localeCompare(String(b.id))); }
function wuFindEx(id){ return (state.warmupsLib||[]).find(w=>w.id===id) || null; }
function wuFindAudio(id){ for(const ex of (state.warmupsLib||[])) for(const a of (ex.audios||[])) if(a.id===id) return {ex, au:a}; return null; }

function wuPatch(ex, patch){
  Object.assign(ex, patch);
  const chain = (state.warmSaveChain[ex.id] || Promise.resolve()).then(()=>
    apiSend('/api/warmups?id=' + encodeURIComponent(ex.id), 'PATCH', patch).then(res=>{
      if(res && res.warmup) Object.assign(ex, res.warmup);
    }).catch(err=>{ alert('Не удалось сохранить распевку: ' + (err.message||err)); })
  );
  state.warmSaveChain[ex.id] = chain.catch(()=>{});
  return chain;
}

function wuAddExercise(level){
  apiSend('/api/warmups', 'POST', {level, topics: state.warmFilter.slice()}).then(res=>{
    state.warmupsLib = (state.warmupsLib||[]).concat([res.warmup]);
    state.warmClosed[level] = false;
    paintWarmupsActive();
  }).catch(err=> alert('Не удалось создать распевку: ' + (err.message||err)));
}

function wuDeleteExercise(ex){
  if((ex.audios||[]).some(a=>a.id===state.warmPlay.id)){ wuPauseAll(); state.warmPlay = {id:null, on:false, pos:0}; }
  apiSend('/api/warmups?id=' + encodeURIComponent(ex.id), 'DELETE', {}).then(()=>{
    state.warmupsLib = (state.warmupsLib||[]).filter(w=>w.id!==ex.id);
    state.warmDelConfirm = null;
    paintWarmupsActive();
  }).catch(err=> alert('Не удалось удалить распевку: ' + (err.message||err)));
}

function wuMove(ex, dir){
  const list = wuByLevel(ex.level);
  const i = list.findIndex(x=>x.id===ex.id);
  const j = i + dir;
  if(i<0 || j<0 || j>=list.length) return;
  const a = list[i], b = list[j];
  const ao = a.sortOrder, bo = b.sortOrder;
  wuPatch(a, {sortOrder: bo});
  wuPatch(b, {sortOrder: ao});
  paintWarmupsActive();
}

function wuRenameEx(ex, title){ wuPatch(ex, {title}); }
function wuAddTopic(ex, topic){
  if((ex.topics||[]).includes(topic)){ state.warmTopicMenu=null; paintWarmupsActive(); return; }
  const topics = (ex.topics||[]).concat([topic]);
  state.warmTopicMenu = null;
  wuPatch(ex, {topics}).then(()=> paintWarmupsActive());
}
function wuRemoveTopic(ex, topic){
  const topics = (ex.topics||[]).filter(t=>t!==topic);
  wuPatch(ex, {topics}).then(()=> paintWarmupsActive());
}

function wuAddAudioToEx(ex, data){
  const au = { id: wuUid(), name: data.name || ('Запись '+((ex.audios||[]).length+1)), dataUrl: data.dataUrl, durationSec: data.durationSec||0, bpm:90, key:'C', starred:false, peaks:[] };
  const audios = (ex.audios||[]).concat([au]);
  wuPatch(ex, {audios}).then(()=>{ paintWarmupsActive(); wuRecomputePeaks(ex.id, au.id); });
}

async function wuRecomputePeaks(exId, auId){
  const found = wuFindAudio(auId); if(!found) return;
  const au = found.au;
  let peaks = [];
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const buf = await ctx.decodeAudioData(await (await fetch(au.dataUrl)).arrayBuffer());
    const ch = buf.getChannelData(0);
    const N = 60, out = new Array(N).fill(0);
    const step = Math.floor(ch.length/N) || 1;
    for(let i=0;i<N;i++){
      let m=0; for(let j=i*step;j<(i+1)*step && j<ch.length;j+=16) m = Math.max(m, Math.abs(ch[j]));
      out[i]=m;
    }
    ctx.close();
    const mx = Math.max(...out)||1;
    peaks = out.map(v=> v/mx);
  } catch(e){ peaks = []; }
  const ex = wuFindEx(exId); if(!ex) return;
  const audios = (ex.audios||[]).map(a=> a.id===auId ? Object.assign({}, a, {peaks}) : a);
  wuPatch(ex, {audios}).then(()=> paintWarmupsActive());
}

function wuUploadAudio(ex){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const dataUrl = reader.result;
      const probe = document.createElement('audio');
      probe.preload = 'metadata';
      probe.onloadedmetadata = ()=>{ wuAddAudioToEx(ex, {dataUrl, durationSec: Math.max(1, Math.round(probe.duration||30)), name: f.name.replace(/\.[^.]+$/,'')}); };
      probe.onerror = ()=>{ wuAddAudioToEx(ex, {dataUrl, durationSec: 30, name: f.name.replace(/\.[^.]+$/,'')}); };
      probe.src = dataUrl;
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}

async function wuStartRec(ex){
  if(state.warmRec) return;
  state.warmAddMenu = null;
  const rec = { exId: ex.id, seconds:0, mediaRecorder:null, stream:null, chunks:[], timer:null };
  state.warmRec = rec;
  paintWarmupsActive();
  if(!navigator.mediaDevices || !window.MediaRecorder){
    alert('Браузер не поддерживает запись звука. Откройте страницу в Chrome или Safari.');
    state.warmRec = null; paintWarmupsActive(); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    if(state.warmRec !== rec){ stream.getTracks().forEach(t=>t.stop()); return; }
    rec.stream = stream;
    const mr = new MediaRecorder(stream);
    rec.mediaRecorder = mr;
    mr.ondataavailable = e=>{ if(e.data && e.data.size) rec.chunks.push(e.data); };
    mr.start();
    rec.timer = setInterval(()=>{ if(state.warmRec===rec){ rec.seconds += 0.25; const el = document.querySelector('[data-wu-rec-time]'); if(el) el.textContent = wuFmt(rec.seconds); } }, 250);
  } catch(err){
    alert('Не удалось получить доступ к микрофону: ' + (err.message||err));
    state.warmRec = null;
    paintWarmupsActive();
  }
}
function wuCancelRec(){
  const rec = state.warmRec; if(!rec) return;
  if(rec.timer) clearInterval(rec.timer);
  if(rec.mediaRecorder && rec.mediaRecorder.state!=='inactive') rec.mediaRecorder.stop();
  if(rec.stream) rec.stream.getTracks().forEach(t=>t.stop());
  state.warmRec = null;
  paintWarmupsActive();
}
function wuStopRec(){
  const rec = state.warmRec; if(!rec) return;
  const ex = wuFindEx(rec.exId);
  if(rec.timer) clearInterval(rec.timer);
  const finish = (dataUrl)=>{
    if(rec.stream) rec.stream.getTracks().forEach(t=>t.stop());
    state.warmRec = null;
    if(ex && dataUrl) wuAddAudioToEx(ex, {dataUrl, durationSec: Math.max(1, Math.round(rec.seconds)), name: 'Запись'});
    else paintWarmupsActive();
  };
  if(rec.mediaRecorder && rec.mediaRecorder.state!=='inactive'){
    rec.mediaRecorder.onstop = ()=>{
      if(!rec.chunks.length){ finish(null); return; }
      const blob = new Blob(rec.chunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onload = ()=> finish(reader.result);
      reader.readAsDataURL(blob);
    };
    rec.mediaRecorder.stop();
  } else finish(null);
}

function wuSetBaseKey(ex, au, key){

/* ---- воспроизведение: одно общее <video> на строку аудио (как и
   остальные плееры в проекте — <video> вместо <audio>, чтобы играть
   даже при включённом безмолвном переключателе на iOS) ---- */
function wuVideoFor(auId){ return document.querySelector('[data-wu-video="'+auId+'"]'); }
function wuPauseAll(){ document.querySelectorAll('[data-wu-video]').forEach(v=>{ if(!v.paused) v.pause(); }); }
function wuRateOf(au){ const bpm = state.warmBpm[au.id] || au.bpm || 90; return bpm/(au.bpm||90); }

function wuToggle(au){
  if(!au.dataUrl) return;
  const p = state.warmPlay;
  const v = wuVideoFor(au.id);
  if(!v) return;
  if(v.dataset.wuTag !== au.id){ v.src = au.dataUrl; v.dataset.wuTag = au.id; }
  if(p.id===au.id && p.on){
    v.pause();
    state.warmPlay = Object.assign({}, p, {on:false});
    wuPaintPlayback(au);
    return;
  }
  wuPauseAll();
  const pos = p.id===au.id ? p.pos : 0;
  try{ v.preservesPitch = true; v.webkitPreservesPitch = true; v.mozPreservesPitch = true; }catch(e){}
  v.playbackRate = wuRateOf(au);
  v.currentTime = pos;
  v.play().catch(()=>{});
  state.warmPlay = {id:au.id, on:true, pos};
  wuPaintPlayback(au);
  wuStartTimer();
}
function wuSeekFromEvent(au, e){
  const d = au.durationSec||0; if(!d) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pos = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width)) * d;
  const v = wuVideoFor(au.id);
  if(v && v.dataset.wuTag===au.id) v.currentTime = pos;
  const p = state.warmPlay;
  if(p.id!==au.id && p.on) wuPauseAll();
  state.warmPlay = {id:au.id, on: p.id===au.id?p.on:false, pos};
  wuPaintPlayback(au);
}
function wuStartTimer(){
  clearInterval(state.warmTimerHandle);
  state.warmTimerHandle = setInterval(()=>{
    const p = state.warmPlay;
    if(!p.on){ clearInterval(state.warmTimerHandle); return; }
    const found = wuFindAudio(p.id);
    if(!found){ wuPauseAll(); state.warmPlay={id:null,on:false,pos:0}; clearInterval(state.warmTimerHandle); return; }
    const au = found.au;
    const v = wuVideoFor(au.id);
    const pos = v ? v.currentTime : p.pos;
    const d = au.durationSec||0;
    if(d && pos >= d-0.05){
      wuPauseAll();
      state.warmPlay = {id:au.id, on:false, pos:0};
      wuPaintPlayback(au);
      clearInterval(state.warmTimerHandle);
      return;
    }
    state.warmPlay = Object.assign({}, p, {pos});
    wuPaintPlayback(au);
  }, 200);
}
// Точечное обновление волны/времени/кнопки play — без перерисовки всей
// вкладки, чтобы тик таймера (5 раз/сек) не дёргал DOM лишний раз.
function wuPaintPlayback(au){
  const row = document.querySelector('[data-wu-row="'+au.id+'"]');
  if(!row) return;
  const p = state.warmPlay;
  const mine = p.id === au.id;
  const d = au.durationSec||0;
  const prog = d && mine ? p.pos/d : 0;
  const peaks = (au.peaks && au.peaks.length) ? au.peaks : new Array(60).fill(0.3);
  row.querySelectorAll('.wu-bar').forEach((bar,i)=>{
    bar.classList.toggle('played', d>0 && (i+0.5)/peaks.length <= prog);
  });
  const timeEl = row.querySelector('.wu-audio-time');
  if(timeEl) timeEl.textContent = (mine && (p.on||p.pos>0)) ? wuFmt(p.pos) : wuFmt(d);
  const btn = row.querySelector('.wu-play-btn');
  if(btn) btn.textContent = (mine && p.on) ? '❚❚' : '▶';
}
// То же самое для слайдеров темпа/тональности — тянуть ползунок не
// должно перерисовывать всю вкладку (сбивало бы фокус и дёргало DOM).
function wuPaintGearVals(auId){
  const found = wuFindAudio(auId); if(!found) return;
  const au = found.au;
  const row = document.querySelector('[data-wu-row="'+auId+'"]'); if(!row) return;
  const bpm = state.warmBpm[auId] || au.bpm || 90;
  const sh = state.warmShift[auId] || 0;
  const ki = WU_KEYS.indexOf(au.key||'C');
  const curKey = ki<0 ? (au.key||'C') : WU_KEYS[((ki+sh)%12+12)%12];
  const shiftLabel = sh===0 ? '0 пт' : (sh>0?'+':'−')+Math.abs(sh)+' пт';
  const vals = row.querySelectorAll('.wu-gear-val');
  if(vals[0]) vals[0].textContent = bpm + ' BPM';
  if(vals[1]) vals[1].textContent = curKey + ' ' + shiftLabel;
  const bpmRange = row.querySelector('[data-wu-bpm-set]'); if(bpmRange && document.activeElement!==bpmRange) bpmRange.value = bpm;
  const shiftRange = row.querySelector('[data-wu-shift-set]'); if(shiftRange && document.activeElement!==shiftRange) shiftRange.value = sh;
}
function wuSetBpm(au, v){
  const base = au.bpm||90;
  v = Math.round(Math.min(base*2, Math.max(Math.round(base/2), v)));
  state.warmBpm[au.id] = v;
  if(state.warmPlay.id===au.id && state.warmPlay.on){ const vid = wuVideoFor(au.id); if(vid) vid.playbackRate = v/base; }
  wuPaintGearVals(au.id);
}
function wuSetShift(au, v){
  v = Math.max(-6, Math.min(6, v));
  state.warmShift[au.id] = v;
  wuPaintGearVals(au.id);
}

function paintWarmups(s){
  const c = document.getElementById('tabContent');
  c.innerHTML = wuHtml();
  wireWarmupsHandlers(s);
}

function wuHtml(){
  const filt = state.warmFilter;
  const match = ex => !filt.length || (ex.topics||[]).some(t=>filt.includes(t));
  const total = (state.warmupsLib||[]).length;
  let shown = 0;
  const levelsHtml = WU_LEVELS.map(m=>{
    const list = wuByLevel(m.k);
    const vis = list.filter(match);
    shown += vis.length;
    const open = !state.warmClosed[m.k];
    const countLabel = filt.length ? (vis.length+' из '+list.length) : (list.length ? list.length+' '+wuPlural(list.length,'распевка','распевки','распевок') : 'пусто');
    return `
      <div class="wu-level-card">
        <div class="wu-level-head" data-wu-level-toggle="${m.k}">
          <div class="wu-level-badge" style="background:${m.color};">${m.k}</div>
          <div class="wu-level-name">${m.name}</div>
          <div class="wu-level-hint">${m.hint}</div>
          <div style="flex:1;"></div>
          <div class="wu-level-count">${countLabel}</div>
          <div class="wu-level-caret">${open?'▾':'▸'}</div>
        </div>
        ${open ? `
          <div class="wu-level-body">
            ${vis.map(ex=> wuExerciseHtml(ex)).join('')}

            <button type="button" class="wu-add-ex-btn" data-wu-add-ex="${m.k}">+ Новая распевка</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
  const totalLabel = filt.length ? ('показано '+shown+' из '+total) : (total+' '+wuPlural(total,'распевка','распевки','распевок'));
  return `
    <div class="kb-wrap">
      <section style="background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;">
        <div class="wu-filter-row">
          <span class="wu-filter-label">Темы уроков</span>
          <button type="button" class="wu-filter-chip ${!filt.length?'on':''}" data-wu-filter-clear="1">Все</button>
          ${WU_TOPICS.map(t=>`<button type="button" class="wu-filter-chip ${filt.includes(t)?'on':''}" data-wu-filter-toggle="${t}">${t}</button>`).join('')}
        </div>
        <div class="wu-total">Общая библиотека для всех учеников · ${totalLabel}</div>
        <div class="wu-levels">${levelsHtml}</div>
      </section>
    </div>
  `;
}

function wireWarmupsHandlers(s){

  c.querySelectorAll('[data-wu-filter-clear]').forEach(el=>{ el.onclick = ()=>{ state.warmFilter=[]; paintWarmups(s); }; });
  c.querySelectorAll('[data-wu-filter-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const t = el.dataset.wuFilterToggle;
      const i = state.warmFilter.indexOf(t);
      state.warmFilter = i>=0 ? state.warmFilter.filter(x=>x!==t) : state.warmFilter.concat([t]);
      paintWarmups(s);
    };
  });
  c.querySelectorAll('[data-wu-level-toggle]').forEach(el=>{
    el.onclick = ()=>{ const k = el.dataset.wuLevelToggle; state.warmClosed[k] = !state.warmClosed[k]; paintWarmups(s); };

  c.querySelectorAll('[data-wu-shift-step]').forEach(el=>{

  c.querySelectorAll('[data-wu-shift-set]').forEach(el=>{

    el.onclick = ()=>{ const [exId,auId] = el.dataset.wuRemoveAudio.split(':'); const ex = wuFindEx(exId); const au = ex && (ex.audios||[]).find(a=>a.id===auId); if(ex&&au) wuRemoveAudio(ex, au); };

function renderDiary(s){ const c = document.getElementById('tabContent'); const needDicts = !state.kbDictsLoaded; state.kabinetIntakeLoaded = state.kabinetIntakeLoaded || {}; const needIntake = !state.kabinetIntakeLoaded[s.id]; const needWarmups = !state.warmupsLib; if(state.diaryCache[s.id] && !needDicts && !needIntake && !needWarmups){ paintDiary(s); return; } c.innerHTML = `<div class="kb-loading">Загружаю дневник занятий…</div>`; const cached = state.diaryCache[s.id]; const tasks = [ (cached && cached.lessons) ? Promise.resolve({lessons: cached.lessons}) : apiGet('/api/lessons?studentId=' + encodeURIComponent(s.id)), needIntake ? apiGet('/api/intake?studentId=' + encodeURIComponent(s.id)) : Promise.resolve(null) ]; if(needDicts) tasks.push(apiGet('/api/dicts')); if(needWarmups) tasks.push(loadWarmupsLib().catch(()=>null)); Promise.all(tasks).then(([lessonsRes, intakeRes, dictsRes])=>{ state.diaryCache[s.id] = { lessons: (lessonsRes && lessonsRes.lessons) || [] }; if(needIntake){ state.kabinetCache[s.id] = Object.assign({}, state.kabinetCache[s.id], { intake: (intakeRes && intakeRes.intake) || {} }); state.kabinetIntakeLoaded[s.id] = true; } if(needDicts){ const server = (dictsRes && dictsRes.dicts) || {}; Object.keys(state.kbDicts).forEach(k=>{ const row = server[k]; if(row) state.kbDicts[k] = Object.assign({}, state.kbDicts[k], {pinned: row.pinned||[], added: row.added||[]}); }); state.kbDictsLoaded = true; } paintDiary(s); }).catch(err=>{ c.innerHTML = `<div class="card-error">Не удалось загрузить дневник занятий: ${String(err.message||err)}. Проверьте подключение базы Postgres в настройках Vercel.</div>`; }); }

function paintDiary(s){
  const c = document.getElementById('tabContent');
  const cache = dnCache(s);
  const lessons = cache.lessons || [];
  const draft = dnDraft(s);
  const editingId = state.diaryEditing[s.id] || null;

      ${dnTrendSectionHtml(lessons)}
      ${dnHistorySectionHtml(s, lessons, editingId)}

  `;
  wireDiaryHandlers(s); vrWireLightRows(s);
}

function dnTrendSvg(graded){
  const w = 360, h = 90, pad = 10;
  if(!graded.length){
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex:none;"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" class="dn-trend-line" stroke="#EFE7DC" stroke-width="2"/></svg>`;
  }
  const n = graded.length;
  const stepX = n>1 ? (w - pad*2)/(n-1) : 0;
  const yFor = (g)=> h - pad - ((g-1)/9)*(h-pad*2);
  const pts = graded.map((l,i)=> [pad + i*stepX, yFor(l.grade)]);
  const pathD = pts.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const dots = pts.map((p,i)=> `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${dnGradeColor(graded[i].grade)}" />`).join('');
  return `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex:none;">
      <path d="${areaD}" class="dn-trend-area" fill="#F1EDE5" stroke="none" />
      <path d="${pathD}" class="dn-trend-line" fill="none" stroke="#C9BCAE" stroke-width="1.6" />
      ${dots}
    </svg>
  `;
}

/* ---- persistence: race-safe per-lesson-id save chain, mirrors
   saveKabinet/kbFlushKabinet's fix for out-of-order POSTs ---- */
function dnQueueSave(lessonId, patch, onResult){
  state.dnPending[lessonId] = Object.assign({}, state.dnPending[lessonId], patch);
  const prevChain = state.dnSaveChain[lessonId] || Promise.resolve();
  const thisSave = prevChain.then(()=> dnFlush(lessonId, onResult));
  state.dnSaveChain[lessonId] = thisSave.catch(()=>{});
  return thisSave;
}
function dnFlush(lessonId, onResult){
  const payload = state.dnPending[lessonId] || {};
  state.dnPending[lessonId] = {};
  const mySeq = (state.dnSaveSeq[lessonId] = (state.dnSaveSeq[lessonId]||0) + 1);
  return apiSend('/api/lessons?id=' + encodeURIComponent(lessonId), 'PATCH', payload)
    .then(res=>{
      if(state.dnSaveSeq[lessonId] === mySeq && onResult){ onResult(res.lesson); }
      return res.lesson;
    })
    .catch(err=>{
      alert('Не удалось сохранить занятие: ' + (err.message||err));
      throw err;
    });
}

function dnDraftToPayload(s, draft){
    return {
          studentId: s.id,
          lessonDate: draft.date,
          topic: draft.topic || null,
          workLow: draft.workLow || null,
          workHigh: draft.workHigh || null,
          goal: draft.goal || null,
          intensity: draft.hard,
          grade: draft.tone,
          lessonSteps: draft.steps || [],
          newProblems: draft.probs || [],
          hwItems: draft.assigned || [],
          hwSent: !!draft.sent,
          takes: draft.takes || [],
          warmupIds: draft.warmupIds || []
    };
}
function dnEnsureDraftRow(s){
  const draft = dnDraft(s);
  if(draft.id) return Promise.resolve(draft.id);
  if(draft._creating) return draft._creating;
  draft._creating = apiSend('/api/lessons', 'POST', dnDraftToPayload(s, draft)).then(res=>{
    draft.id = res.lesson.id;
    draft._creating = null;
    invalidateLessonCount(s);
    return draft.id;
  }).catch(err=>{
    draft._creating = null;
    throw err;
  });
  return draft._creating;
}
function dnAutosave(s, patch){
  const draft = dnDraft(s);
  Object.assign(draft, patch);
  dnEnsureDraftRow(s).then(lessonId=>{
    dnQueueSave(lessonId, patch, ()=>{});
  }).catch(err=>{ alert('Не удалось создать запись занятия: ' + (err.message||err)); });
}

function dnFinalizeSave(s){
  const draft = dnDraft(s);
  const btn = document.querySelector('[data-dn-save-lesson]');
  if(btn) btn.disabled = true;
  const finish = (lesson)=>{
    const cache = dnCache(s);
    cache.lessons = [lesson].concat((cache.lessons||[]).filter(l=>String(l.id)!==String(lesson.id)));
    delete state.diaryDrafts[s.id];
    delete state.diaryRec[s.id];
    if(state.kabinetCache[s.id]) delete state.kabinetCache[s.id].lessons;
    invalidateLessonCount(s);
    paintDiary(s);
  };
  if(draft.id){
    dnQueueSave(draft.id, dnDraftToPayload(s, draft), finish).catch(()=>{ if(btn) btn.disabled=false; });
  } else {
    apiSend('/api/lessons', 'POST', dnDraftToPayload(s, draft)).then(res=> finish(res.lesson))
      .catch(err=>{ alert('Не удалось сохранить занятие: ' + (err.message||err)); if(btn) btn.disabled=false; });
  }
}

function vrUid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function vrMarkerTime(m){ return m.t!=null ? m.t : (m.sec||0); }
function vrSortedMarkers(markers){ return (markers||[]).slice().sort((a,b)=> vrMarkerTime(a)-vrMarkerTime(b)); }
function vrFindNearMarker(markers, t, thresh){ thresh = thresh||0.3; let best=-1, bestD=Infinity; (markers||[]).forEach((m,i)=>{ const d=Math.abs(vrMarkerTime(m)-t); if(d<thresh && d<bestD){ bestD=d; best=i; } }); return best; }
function vrCreateOrEditMarker(rk, take, t, persistFn, repaintFn){
  const nearIdx = vrFindNearMarker(take.markers, t, 0.3);
  if(nearIdx>=0){
    window.__vrPendingEditMarker = { rk: rk, markerId: (take.markers||[])[nearIdx].id };
    repaintFn();
    return;
  }
  const m = vrNewMarker(t);
  take.markers = (take.markers||[]).concat([m]);
  const sorted = vrSortedMarkers(take.markers);
  const idx = sorted.findIndex(function(x){ return x.id===m.id; });
  m.label = 'Метка ' + (idx+1);
  persistFn();
  window.__vrPendingEditMarker = { rk: rk, markerId: m.id };
  repaintFn();
}
function vrDownsample(peaks, n){
  peaks = peaks||[];
  if(!peaks.length) return Array.from({length:n}).map(()=>0);
  const out = [];
  const bucket = peaks.length/n;
  for(let i=0;i<n;i++){
    const start = Math.floor(i*bucket), end = Math.max(start+1, Math.floor((i+1)*bucket));
    let m = 0;
    for(let j=start;j<end && j<peaks.length;j++){ m = Math.max(m, peaks[j]); }
    out.push(m);
  }
  const max = Math.max(0.0001, Math.max.apply(null, out));
  return out.map(v=>v/max);
}
function vrFmtTime(sec){ sec = Math.max(0, Math.floor(sec||0)); return kbPad(Math.floor(sec/60))+':'+kbPad(sec%60); }
window.__vrAudios = window.__vrAudios || {};
function vrStopOtherAudio(exceptKey){ Object.keys(window.__vrAudios).forEach(k=>{ if(k!==exceptKey){ const a = window.__vrAudios[k]; if(a && !a.paused) a.pause(); } }); }
function vrShowUndoToast(message, onUndo, onFinal){
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#23201D;color:#F7F3EC;padding:12px 18px;border-radius:10px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.3);font-family:inherit;';
  el.innerHTML = '<span>'+message+'</span><button type="button" style="background:none;border:none;color:#C97B62;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit;">Отменить</button>';
  document.body.appendChild(el);
  let done = false;
  const finish = (undo)=>{ if(done) return; done = true; el.remove(); if(undo){ onUndo(); } else { onFinal(); } };
  el.querySelector('button').onclick = ()=> finish(true);
  const timer = setTimeout(()=> finish(false), 10000);
  return { cancel: ()=>{ clearTimeout(timer); finish(true); } };
}

  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if(tag==='input' || tag==='textarea' || (document.activeElement && document.activeElement.isContentEditable)) return;
  let targetKey = null, targetAudio = null;
  for(const k in window.__vrAudios){ const a = window.__vrAudios[k]; if(a && !a.paused){ targetKey = k; targetAudio = a; break; } }

  const ctx = window.__vrTakeCtx && window.__vrTakeCtx[targetKey];
  if(!ctx) return;
  vrCreateOrEditMarker(targetKey, ctx.take, targetAudio.currentTime, ctx.persistFn, ctx.repaintFn);
});

function vrTakeMetaLine(t){
  const d = t.createdAt ? new Date(t.createdAt) : null;
  const dateStr = d ? (kbPad(d.getDate())+'.'+kbPad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' '+kbPad(d.getHours())+':'+kbPad(d.getMinutes())) : '';
  const sizeMatch = (t.meta||'').match(/([\d.,]+ ?(KB|MB))/i);
  const sizeStr = sizeMatch ? sizeMatch[1] : '';
  const dur = t.durationSec!=null ? vrFmtTime(t.durationSec) : '';
  const vis = t.visibleToStudent!==false ? 'виден ученику' : 'только педагог';
  return [dateStr, dur, sizeStr, vis].filter(Boolean).join(' · ');
}

function dnUpdateRecDom(recKey, rec){
  const timerEl = document.querySelector(`[data-vr-timer="${recKey}"]`);
  if(timerEl){ timerEl.textContent = kbPad(Math.floor(rec.seconds/60)) + ':' + kbPad(rec.seconds%60); }
  const barsWrap = document.querySelector(`[data-vr-bars="${recKey}"]`);
  if(barsWrap){ const bars = barsWrap.children; const levels = rec.levels; for(let i=0;i<bars.length;i++){ const v = levels[levels.length - bars.length + i] || 0; bars[i].style.height = Math.max(3, Math.round(v*44)) + 'px'; } }
  const markerCountEl = document.querySelector(`[data-vr-marker="${recKey}"] .vr-marker-count`);
  if(markerCountEl) markerCountEl.textContent = (rec.markers||[]).length;
}
function dnStartRecording(recKey, rec, opts){
  if(rec.active || rec.saving) return;
  if(!navigator.mediaDevices || !window.MediaRecorder){ rec.error = 'Браузер не поддерживает запись звука. Откройте страницу в Chrome или Safari.'; opts.onRepaint(); return; }
  const devSel = document.querySelector(`[data-vr-device="${recKey}"]`);
  const deviceId = (devSel && devSel.value) || vrDeviceId();
  const constraints = deviceId ? {audio:{deviceId:{exact:deviceId}}} : {audio:true};
  navigator.mediaDevices.getUserMedia(constraints).then(stream=>{
    rec.stream = stream;
    rec.hint = '';
    rec.silenceStreak = 0;
    vrRegisterRec(rec);
    const track = stream.getAudioTracks()[0];
    if(track){
      track.onended = ()=>{
        if(!rec.active) return;
        rec.paused = true;
        if(rec.mediaRecorder && rec.mediaRecorder.state==='recording' && rec.mediaRecorder.pause) rec.mediaRecorder.pause();
        rec.error = 'Микрофон отключён — выберите другой источник и продолжите.';
        opts.onRepaint();
      };
    }
    const mr = new MediaRecorder(stream);
    rec.chunks = [];
    mr.ondataavailable = e=>{ if(e.data && e.data.size) rec.chunks.push(e.data); };
    mr.onstop = ()=>{
      vrUnregisterRec(rec);
      if(rec._discard){ rec._discard = false; dnTeardownRecorder(rec); opts.onRepaint(); return; }
      const blob = new Blob(rec.chunks, {type: mr.mimeType || 'audio/webm'});
      const secs = rec.seconds;
      const d = new Date();
      const dateLabel = kbPad(d.getDate())+'.'+kbPad(d.getMonth()+1)+'.'+d.getFullYear();
      const fileName = dateLabel+'_'+opts.fileTag+'.webm';
      const displayName = (opts.studentName || 'Голос ученика') + ' · ' + dateLabel;
      const reader = new FileReader();
      reader.onload = ()=>{
        const dataUrl = reader.result;
        const wasLimitStop = !!rec._limitStop; rec._limitStop = false;
        const markers = vrSortedMarkers(rec.markers);
        const peaks = vrDownsample(rec.peaks, 200);
        const visibleToStudent = false;
        dnTeardownRecorder(rec);
        if(dataUrl.length > 5800000){ rec.error = 'Запись слишком большая для сохранения в базе (лимит ~4 МБ). Сократите длительность и запишите заново.'; opts.onRepaint(); return; }
        const take = { id: Date.now(), name: displayName, fileName: fileName, meta: kbPad(Math.floor(secs/60))+':'+kbPad(secs%60)+' · '+Math.round(blob.size/1024)+' KB', dataUrl, createdAt: new Date().toISOString(), durationSec: secs, markers, peaks, visibleToStudent };
        if(wasLimitStop){ opts.onSaveTake(take); } else { rec.pendingTake = take; opts.onRepaint(); }
      };
      reader.readAsDataURL(blob);
    };
    rec.mediaRecorder = mr;
    mr.start();
    rec.active = true; rec.paused = false; rec.seconds = 0; rec.error = ''; rec.levels = []; rec.peaks = []; rec.markers = []; rec.pendingTake = null;
    opts.onRepaint();
    rec.timer = setInterval(()=>{
      if(rec.paused) return;
      rec.seconds++;
      dnUpdateRecDom(recKey, rec);
    }, 1000);
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.65;
      ctx.createMediaStreamSource(stream).connect(analyser);
      rec.ctx = ctx;
      const data = new Uint8Array(analyser.fftSize);
      rec.levelTimer = setInterval(()=>{
        if(rec.paused) return;
        analyser.getByteTimeDomainData(data);
        let sumSq = 0;
        for(let i=0;i<data.length;i++){ const v = (data[i]-128)/128; sumSq += v*v; }
        const rms = Math.sqrt(sumSq/data.length);
        const amplitude = Math.min(1, rms*3.4);
        rec.levels = rec.levels.concat([amplitude]).slice(-60);
        rec.peaks.push(amplitude);
        if(amplitude < 0.02){ rec.silenceStreak = (rec.silenceStreak||0) + 1; } else { rec.silenceStreak = 0; if(rec.hint){ rec.hint=''; opts.onRepaint(); } }
        if(rec.silenceStreak === 200){ rec.hint = 'Похоже, микрофон не ловит звук.'; opts.onRepaint(); }
        dnUpdateRecDom(recKey, rec);
      }, 50);
    }catch(e){ /* визуализация не критична для работы записи */ }
  }).catch(()=>{ rec.error = 'Микрофон недоступен: разрешите доступ в браузере и попробуйте снова.'; opts.onRepaint(); });
}
function dnStopRecording(rec){ if(rec.timer) clearInterval(rec.timer); if(rec.levelTimer) clearInterval(rec.levelTimer); if(rec.mediaRecorder && rec.mediaRecorder.state !== 'inactive') rec.mediaRecorder.stop(); else dnTeardownRecorder(rec); }
function dnTeardownRecorder(rec){ vrUnregisterRec(rec); if(rec.timer) clearInterval(rec.timer); if(rec.levelTimer) clearInterval(rec.levelTimer); if(rec.ctx){ try{ rec.ctx.close(); }catch(e){} rec.ctx = null; } if(rec.stream){ rec.stream.getTracks().forEach(t=>{ t.onended=null; t.stop(); }); rec.stream = null; } rec.active = false; rec.paused = false; rec.hint=''; rec.mediaRecorder = null; rec.timer = null; rec.levelTimer = null; }
function dnPauseToggle(rec, recKey, opts){ if(!rec.active) return; if(!rec.paused){ if(rec.mediaRecorder && rec.mediaRecorder.state==='recording' && rec.mediaRecorder.pause) rec.mediaRecorder.pause(); rec.paused = true; } else { if(rec.mediaRecorder && rec.mediaRecorder.state==='paused' && rec.mediaRecorder.resume) rec.mediaRecorder.resume(); rec.paused = false; rec.error=''; } opts.onRepaint(); }
function dnAddMarker(rec, recKey, opts){ if(!rec.active || rec.paused) return; rec.markers = rec.markers || []; rec.markers.push(vrNewMarker(rec.seconds)); opts.onRepaint(); }
function dnDiscardRecording(rec, opts){ if(!rec.active) return; if(rec.seconds > 10 && !confirm('Удалить текущую запись? Отменить будет нельзя.')) return; rec._discard = true; if(rec.mediaRecorder && rec.mediaRecorder.state !== 'inactive') rec.mediaRecorder.stop(); else dnTeardownRecorder(rec); opts.onRepaint(); }
function dnConfirmSaveTake(rec, opts){
  if(!rec.pendingTake || rec.saving) return;
  const take = rec.pendingTake;
  rec.pendingTake = null;
  rec.saving = true;
  rec.savingPhase = 0;
  rec.savingPct = 0;
  opts.onRepaint();
  const stepMs = 60;
  const steps = 22;
  let i = 0;
  const timer = setInterval(function(){
    i++;
    rec.savingPct = Math.min(100, Math.round(i/steps*100));
    rec.savingPhase = rec.savingPct >= 67 ? 2 : (rec.savingPct >= 34 ? 1 : 0);
    opts.onRepaint();
    if(i>=steps){
      clearInterval(timer);
      opts.onSaveTake(take);
    }
  }, stepMs);
}
function dnDiscardPendingTake(rec, opts){ rec.pendingTake = null; rec.markers = []; opts.onRepaint(); }
function dnSaveTakes(rec, ensureRowFn, getTakes, applyTakes, repaint){
  rec.saving = true; rec.justSaved = false; repaint();
  ensureRowFn().then(lessonId=>{
    const takes = getTakes();
    return dnQueueSave(lessonId, {takes}, applyTakes);
  }).then(()=>{
    rec.saving = false; rec.justSaved = true; repaint();
    setTimeout(()=>{ rec.justSaved = false; repaint(); }, 2200);
  }).catch(err=>{
    rec.saving = false; rec.error = 'Не удалось сохранить запись: ' + (err.message||err);
    repaint();
  });
}

function dnApplyDictValue(s, ctx, fieldKey, label){
  if(fieldKey === 'dnTool'){
    if(ctx === 'new:newstep'){
      dnAutosave(s, {newTool: label});
    } else if(ctx && ctx.indexOf('new:step:')===0){
      const i = Number(ctx.slice(9));
      const draft = dnDraft(s);
      const steps = draft.steps.map((x,j)=> j===i ? Object.assign({}, x, {tool: label}) : x);
      dnAutosave(s, {steps: steps, lessonSteps: steps});

    paintDiary(s);
    return;
  }
  const shortKey = fieldKey==='dnWorkLow'?'workLow':fieldKey==='dnWorkHigh'?'workHigh':'newProblem';
  if(ctx==='new'){
    dnAutosave(s, {[shortKey]: label});

function dnCommitDictAdd(fieldKey, s){
  const dd = state.kabinetDictDD;
  const raw = (dd.draft || '').trim();
  if(!raw){ state.kabinetDictDD = Object.assign({}, dd, {error:'Пустое значение добавить нельзя.'}); paintDiary(s); return; }
  const d = state.kbDicts[fieldKey];
  const all = d.core.concat(d.pinned, d.added);
  if(all.some(x=>x.toLowerCase()===raw.toLowerCase())){
    state.kabinetDictDD = Object.assign({}, dd, {error:'Такой вариант уже есть в списке.'});
    paintDiary(s);
    return;
  }
  const wrap = document.querySelector(`[data-kb-dict-draft="${fieldKey}"]`);
  const ctxEl = wrap && wrap.closest('[data-dn-ctx]');
  const ctx = ctxEl ? ctxEl.dataset.dnCtx : 'new';
  const nextDict = { core: d.core, pinned: d.pinned, added: d.added.concat([raw]) };
  state.kbDicts[fieldKey] = nextDict;

}

        delete state.diaryEditRec[id];
        if(state.diaryEditing[s.id]===id) state.diaryEditing[s.id] = null;
        delete state.kabinetCache[s.id];
        invalidateLessonCount(s);
        paintDiary(s);
      }).catch(err=> alert('Не удалось удалить занятие: ' + (err.message||err)));
    };
  });
}

// .kb-block-title inside .kb-anamnesis-box).
// Shared option-row renderer for both the multi-select (kbSpravochnikControl)
// and single-select (kbSpravochnikSingleControl) Справочник variants —
// compact wrapping chip/button, not a full-width row, so lists like Жалобы
// (16 items) or Возраст (21 items) stay to ~3 visible rows instead of one
// giant vertical list. Keeps pin-to-ОСНОВНОЕ and delete-with-confirm
// exactly as before; only "основное" items skip pin/delete (unchanged
// behaviour). Two callers share this so the component can't drift out of
// sync with itself the way goal/goals did.
function kbDictChipRow(fieldKey, r, isSelected, selectAttrName){
  const dd = state.kabinetDictDD;
  const confirming = dd.confirm === fieldKey + '::' + r.label;
  if(confirming){
    const inUse = isSelected;
    return `
      <div class="kb-dict-confirm">
        <div style="font-size:12.5px;color:#A8452C;font-weight:600;line-height:1.35;">${inUse ? 'Удалить «'+r.label+'»? Значение стоит в карточке — оно останется там обычным текстом.' : 'Удалить «'+r.label+'» из справочника?'}</div>

  return `

function kbCommitDictAdd(fieldKey, s){
  const dd = state.kabinetDictDD;
  const raw = (dd.draft || '').trim();
  if(!raw){ state.kabinetDictDD = Object.assign({}, dd, {error:'Пустое значение добавить нельзя.'}); paintKabinet(s); return; }
  if(fieldKey === 'age' && !/^\d{1,3}$/.test(raw)){
    state.kabinetDictDD = Object.assign({}, dd, {error:'Введите возраст числом.'});
    paintKabinet(s);
    return;
  }
  const d = state.kbDicts[fieldKey];
  const all = d.core.concat(d.pinned, d.added);
  if(all.some(x=>x.toLowerCase()===raw.toLowerCase())){
    state.kabinetDictDD = Object.assign({}, dd, {error:'Такой вариант уже есть в списке.'});
    paintKabinet(s);
    return;
  }
  const nextDict = { core: d.core, pinned: d.pinned, added: d.added.concat([raw]) };
  state.kbDicts[fieldKey] = nextDict;
  state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
  saveFieldDict(fieldKey, nextDict);
  const cache = kbCache(s);
  if(KB_SINGLE_DICT_FIELDS.has(fieldKey)){
    saveKabinet(s, {[fieldKey]: fieldKey === 'age' ? Number(raw) : raw});
  } else {
    const cur = cache.intake[fieldKey] || [];
    if(cur.indexOf(raw) === -1){
      saveKabinet(s, {[fieldKey]: cur.concat([raw])});
    } else {
      paintKabinet(s);
    }
  }
}
