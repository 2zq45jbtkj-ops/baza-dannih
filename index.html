function renderKabinet(s){
  const c = document.getElementById('tabContent');
  const needDicts = !state.kbDictsLoaded;
  if(state.kabinetCache[s.id] && !needDicts){ paintKabinet(s); return; }
  c.innerHTML = `<div class="kb-loading">Загружаю анкету…</div>`;
  const cached = state.kabinetCache[s.id];
  const tasks = [
    cached ? Promise.resolve({intake: cached.intake}) : apiGet('/api/intake?studentId=' + encodeURIComponent(s.id)),
    cached ? Promise.resolve({lessons: cached.lessons}) : apiGet('/api/lessons?studentId=' + encodeURIComponent(s.id))
  ];
  if(needDicts) tasks.push(apiGet('/api/dicts'));
  Promise.all(tasks).then(([intakeRes, lessonsRes, dictsRes])=>{
    state.kabinetCache[s.id] = {
      intake: (intakeRes && intakeRes.intake) || {},
      lessons: (lessonsRes && lessonsRes.lessons) || []
    };
    if(needDicts){
      const server = (dictsRes && dictsRes.dicts) || {};
      Object.keys(state.kbDicts).forEach(k=>{
        const row = server[k];
        if(row) state.kbDicts[k] = Object.assign({}, state.kbDicts[k], {pinned: row.pinned||[], added: row.added||[]});
      });
      state.kbDictsLoaded = true;
    }
    paintKabinet(s);
  }).catch(err=>{
    c.innerHTML = `<div class="card-error">Не удалось загрузить анкету: ${String(err.message||err)}. Проверьте подключение базы Postgres в настройках Vercel.</div>`;
  });
}

function kbCache(s){
  return state.kabinetCache[s.id] || (state.kabinetCache[s.id] = {intake:{}, lessons:[]});
}

function saveKabinet(s, patch){
  const cache = kbCache(s);
  cache.intake = Object.assign({}, cache.intake, patch);
  // Two POSTs fired back-to-back can reach Postgres out of order — whichever
  // one physically commits last wins, even if it carries older data. Rapid
  // clicks (e.g. picking several chips in a multi-select in a row) reliably
  // triggered this and silently dropped a selection. Fix: never have more
  // than one save in flight per student — chain every save onto the same
  // per-student promise so they run strictly one after another. Each save
  // still reads cache.intake at the moment it actually fires, so rapid local
  // changes get coalesced into the next flush rather than lost.
  const prevChain = state.kabinetSaveChain[s.id] || Promise.resolve();
  const thisSave = prevChain.then(()=> kbFlushKabinet(s));
  state.kabinetSaveChain[s.id] = thisSave.catch(()=>{});
  return thisSave;
}

function kbFlushKabinet(s){
  const cache = kbCache(s);
  const payload = Object.assign({studentId: s.id}, cache.intake);
  const mySeq = (state.kabinetSaveSeq[s.id] = (state.kabinetSaveSeq[s.id] || 0) + 1);
  return apiSend('/api/intake', 'POST', payload)
    .then(res=>{
      if(state.kabinetSaveSeq[s.id] === mySeq){ cache.intake = res.intake; }
      paintKabinet(s);
      return true;
    })
    .catch(err=>{
      alert('Не удалось сохранить: ' + (err.message||err));
      paintKabinet(s);
      return false;
    });
}

          <div class="kb-modes-title-row"><div class="kb-modes-title">Инструменты из CVT</div><span class="kb-modes-badge">оставлено</span></div>
          <div class="kb-modes-desc">Моды и effort как рабочий ярлык поверх EVT-структур.</div>
          <div class="kb-modes-subtitle">Моды на старте</div>
          <div class="kb-modes-list">
            ${KB_MODE_KEYS.map(k=>{
              const st = modes[k] || 'нет';
              const col = KB_STATE_COLORS[st];
              return `<button type="button" class="kb-state-row" style="background:${col[0]};border-color:${col[1]};" data-kb-mode="${k}">
                <span class="kb-state-name">${k}</span><span class="kb-state-badge" style="color:${col[2]};">${st}</span>
              </button>`;
            }).join('')}
          </div>
        </div>
        <div class="kb-metallic-card">
          <div class="kb-metallic-top"><div class="kb-metallic-title">Metallic / non-metallic (CVT)</div><div class="kb-metallic-value" id="kbMetallicValue">${metallic}% металла</div></div>
          <input type="range" class="kb-metal" min="0" max="100" step="1" value="${metallic}" id="kbMetallicSlider">
          <div class="kb-metallic-scale"><span>non-metallic</span><span>metallic</span></div>
          <div class="kb-metallic-note" id="kbMetallicNote">${kbMetallicNote(metallic)}</div>
        </div>
      </div>
    </div>` : ''}
  `;

  const rec = state.kabinetRec; const takes = intake.referenceTakes || []; const recordHtml = ` ${kbSection('record','РЕФЕРЕНС-ЗАПИСЬ НА ВХОДЕ','записывается здесь, в браузере', '')} ${open.record ? vrRecorderHtml('kabinet_'+s.id, rec, takes, {showUpload:true}) : ''} `;
// Каждое занятие теперь может содержать несколько записей («takes» из
  // рекордера в Дневнике занятий) — разворачиваем их в отдельные строки.
  // Старые занятия (сделанные ещё прежней версией вкладки) хранят одну
  // ссылку в mediaUrl — показываем и её тоже, для обратной совместимости.
  const files = [];
  lessons.forEach(l=>{
    const dateStr = (l.lessonDate||'').split('-').reverse().join('.');
    const topic = l.topic || l.rangeWorked || l.whatWorked || '—';
    (l.takes||[]).forEach(t=>{
      files.push({ name: t.name || (dateStr+'_'+(s.name||'').replace(/\s+/g,'_')+'.webm'), topic, url: t.dataUrl, hasAudio: true });
    });
    if(l.mediaUrl){
      files.push({ name: dateStr+'_'+(s.name||'').replace(/\s+/g,'_')+'.webm', topic, url: l.mediaUrl, hasAudio: true });
    }
  });
  const filesHtml = `
    ${kbSection('files','ЗАПИСИ С УРОКОВ','дата_имя ученика')}
    ${open.files ? `
    <div class="kb-files-box">
      ${files.length ? files.map(f=>`
        <div class="kb-file-row">
          <div class="kb-file-name">${f.name}</div>
          <div class="kb-file-topic">${f.topic}</div>
          ${f.hasAudio ? `<audio controls src="${f.url}" style="height:34px;"></audio>` : `<span class="kb-file-missing">запись не приложена</span>`}
        </div>
      `).join('') : `<div class="kb-files-empty">Записей пока нет — появятся после первых занятий в «Дневнике занятий».</div>`}
    </div>` : ''}
  `;

  const summaryHtml = `
    <div class="kb-summary">
      <div style="flex:1;min-width:220px;">
        <div class="kb-summary-title">Сводка для ученика</div>
        <div class="kb-summary-desc">Один PDF: цель, замеры, прогресс по занятиям и домашние задания — без методики и медицинских полей.</div>
      </div>
      <button type="button" class="kb-summary-btn" id="kbExportPdfBtn">Отправить PDF ученику</button>
    </div>
  `;

  c.innerHTML = `
    <div class="kb-wrap">
      <section>${generalHtml}</section>
      <section>${anamnesisHtml}</section>
      <section>${evtHtml}</section>
      <section>${qualitiesHtml}</section>
      <section>${recordHtml}</section>
      <section>${filesHtml}</section>
      <section>${summaryHtml}</section>
    </div>
  `;

  wireKabinetHandlers(s);
}

function wireKabinetHandlers(s){
  const c = document.getElementById('tabContent');

  c.querySelectorAll('[data-kb-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.kbToggle;
      state.kabinetOpen[key] = !state.kabinetOpen[key];
      const btn = document.getElementById('collapseToggleBtn');
      if(btn) btn.textContent = kbAnyOpen() ? 'Свернуть' : 'Развернуть';
      paintKabinet(s);
    };
  });

  c.querySelectorAll('select[data-kb-field]').forEach(el=>{
    el.onchange = ()=> saveKabinet(s, {[el.dataset.kbField]: el.value || null});
  });
  c.querySelectorAll('input[data-kb-field]').forEach(el=>{
    el.onchange = ()=>{
      const key = el.dataset.kbField, type = el.dataset.kbType;
      let v = el.value;
      if(type==='number') v = v===''? null : Number(v);
      saveKabinet(s, {[key]: v});
    };
  });
  c.querySelectorAll('textarea[data-kb-field]').forEach(el=>{
    el.onchange = ()=> saveKabinet(s, {[el.dataset.kbField]: el.value || null});
  });

  const compareBtn = c.querySelector('[data-kb-compare-toggle]');
  if(compareBtn) compareBtn.onclick = ()=>{ state.kabinetCompareOpen = !state.kabinetCompareOpen; paintKabinet(s); };



  // Справочник (Цель обучения / Жанр): open/close, select-toggle, pin,
  // delete-with-confirm, inline add-your-own.
  c.querySelectorAll('[data-kb-dict-toggle]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.dataset.kbDictToggle;
      const dd = state.kabinetDictDD;
      const wasOpen = dd.openKey === key && !dd.adding;
      state.kabinetDictDD = { openKey: wasOpen ? null : key, adding:false, draft:'', error:'', confirm:null };
      paintKabinet(s);
    };
  });

  c.querySelectorAll('[data-kb-dict-select]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.dataset.kbDictSelect;
      const label = el.dataset.kbValue;
      const cache = kbCache(s);
      const cur = cache.intake[key] || [];
      const idx = cur.indexOf(label);
      const next = idx>=0 ? cur.slice(0,idx).concat(cur.slice(idx+1)) : cur.concat([label]);
      saveKabinet(s, {[key]: next});
    };
  });

  c.querySelectorAll('[data-kb-dict-select-one]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.dataset.kbDictSelectOne;
      const label = el.dataset.kbValue;
      state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
      saveKabinet(s, {[key]: key === 'age' ? Number(label) : label});
    };
  });

  c.querySelectorAll('[data-kb-dict-pin]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      kbTogglePin(el.dataset.kbDictPin, el.dataset.kbValue, s);
    };
  });

  c.querySelectorAll('[data-kb-dict-delete-ask]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm: el.dataset.kbDictDeleteAsk + '::' + el.dataset.kbValue});
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-delete-cancel]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {confirm:null});
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-delete-confirm]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      kbDeleteDictOption(el.dataset.kbDictDeleteConfirm, el.dataset.kbValue, s);
    };
  });

  c.querySelectorAll('[data-kb-dict-start-add]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = { openKey: el.dataset.kbDictStartAdd, adding:true, draft:'', error:'', confirm:null };
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-cancel-add]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
      paintKabinet(s);
    };
  });
  c.querySelectorAll('[data-kb-dict-draft]').forEach(el=>{
    el.onclick = (e)=> e.stopPropagation();
    el.oninput = ()=>{ state.kabinetDictDD = Object.assign({}, state.kabinetDictDD, {draft: el.value, error:''}); };
    el.onkeydown = (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); kbCommitDictAdd(el.dataset.kbDictDraft, s); }
      if(e.key === 'Escape'){ state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null }; paintKabinet(s); }
    };
  });
  c.querySelectorAll('[data-kb-dict-commit]').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      kbCommitDictAdd(el.dataset.kbDictCommit, s);
    };
  });


  const resetBtn = c.querySelector('[data-kb-reset-structures]');
  if(resetBtn) resetBtn.onclick = ()=> saveKabinet(s, {structures: kbNeutralStructures()});
  const transferBtn = c.querySelector('[data-kb-transfer]');
  if(transferBtn) transferBtn.onclick = ()=> alert('Раздел «Дневник занятий» ещё не готов — перенос структур в занятие подключим, когда он появится.');

  c.querySelectorAll('[data-kb-structure]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const structures = Object.assign({}, kbNeutralStructures(), cache.intake.structures||{});
      structures[el.dataset.kbStructure] = el.dataset.kbValue;
      saveKabinet(s, {structures});
    };
  });

  c.querySelectorAll('[data-kb-quality]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const qualities = Object.assign({}, cache.intake.qualities||{});
      const key = el.dataset.kbQuality;
      const cur = qualities[key] || 'нет';
      qualities[key] = KB_STATES[(KB_STATES.indexOf(cur)+1) % KB_STATES.length];
      saveKabinet(s, {qualities});
    };
  });
  c.querySelectorAll('[data-kb-mode]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const modes = Object.assign({}, cache.intake.modes||{});
      const key = el.dataset.kbMode;
      const cur = modes[key] || 'нет';
      modes[key] = KB_STATES[(KB_STATES.indexOf(cur)+1) % KB_STATES.length];
      saveKabinet(s, {modes});
    };
  });
  c.querySelectorAll('[data-kb-anchor]').forEach(el=>{
    el.onclick = ()=>{
      const cache = kbCache(s);
      const anchors = Object.assign({}, cache.intake.anchors||{});
      const key = el.dataset.kbAnchor;
      anchors[key] = !anchors[key];
      saveKabinet(s, {anchors});
    };
  });

  const slider = document.getElementById('kbMetallicSlider');
  if(slider){
    slider.oninput = ()=>{
      const v = Number(slider.value);
      const valEl = document.getElementById('kbMetallicValue');
      const noteEl = document.getElementById('kbMetallicNote');
      if(valEl) valEl.textContent = v + '% металла';
      if(noteEl) noteEl.textContent = kbMetallicNote(v);
    };
    slider.onchange = ()=> saveKabinet(s, {metallicPercent: Number(slider.value)});
  }

  dnRecorderWire(s, 'kabinet_'+s.id, state.kabinetRec, 'kabinet', ()=> (kbCache(s).intake.referenceTakes||[]), (next)=>{ kbCache(s).intake.referenceTakes = next; }, null, { repaint:()=>paintKabinet(s), fileTagSuffix:'_reference', onUpload:(file)=>kbUploadFile(s, file), onKabinetSave:(next)=>kbSaveTakes(s, next) });
const pdfBtn = document.getElementById('kbExportPdfBtn');
  if(pdfBtn) pdfBtn.onclick = ()=> alert('Отправка PDF ученику — в разработке. Нужно решить отдельно: email, ссылка на скачивание или Telegram. Как определимся — подключим.');
}

function kbUploadFile(s, file){
  if(file.size > 4200000){
    alert('Файл слишком большой для сохранения в базе (лимит ~4 МБ на запись). Загрузите файл покороче.');
    return;
  }
  const reader = new FileReader();
  reader.onload = ()=>{
    const take = { id: Date.now(), name: file.name, meta: 'загружено · ' + Math.round(file.size/1024) + ' KB', dataUrl: reader.result, createdAt: new Date().toISOString() };
    const cache = kbCache(s);
    const takes = [take].concat(cache.intake.referenceTakes || []);
    kbSaveTakes(s, takes);
  };
  reader.readAsDataURL(file);
}

// Saves referenceTakes and drives the "Сохраняю…/Сохранено" status next to the
// recorder, so a successful save is visibly confirmed instead of relying on the
// take silently appearing in the list (which used to happen even before the
// server call resolved and gave no signal that the save had actually landed).
function kbSaveTakes(s, takes){
  const rec = state.kabinetRec;
  const wasSaving = rec.saving;
  if(wasSaving) paintKabinet(s);
  saveKabinet(s, {referenceTakes: takes}).then(ok=>{
    if(!wasSaving) return;
    rec.saving = false;
    rec.justSaved = ok;
    paintKabinet(s);
    if(ok){
      setTimeout(()=>{ rec.justSaved = false; paintKabinet(s); }, 2200);
    }
  });
}

function kbPad(n){ return n<10 ? '0'+n : String(n); }

// Close an open Справочник dropdown (Цель обучения / Жанр / Возраст /
// Тип голоса на слух / Жалобы / any future field using this component)
// on any click outside it.
document.addEventListener('click', ()=>{
  if(!state.kabinetDictDD.openKey) return;
  state.kabinetDictDD = { openKey:null, adding:false, draft:'', error:'', confirm:null };
  const s = state.data.students.find(x=>x.id===state.activeStudentId);
  if(!s) return;
  if(state.activeTab==='profile') paintKabinet(s);
  else if(state.activeTab==='card') paintDiary(s);
});

render();
syncStudentsFromServer();
</script>
