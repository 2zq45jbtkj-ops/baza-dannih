<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>База данных — Лаборатория звука</title>
<style>
:root{
  --terracotta:#AE5F3F; --terracotta-light:#D6A289; --terracotta-dark:#8A3324; --terracotta-bg:#FBF1EC;
  --blue:#6C91A6; --blue-light:#B8CCD9; --blue-bg:#EAF1F5;
  --cream:#F2ECE7; --ink:#2E2A27; --muted:#8A8078; --line:#E4E0DA; --white:#FFFFFF;
  --bg:var(--cream); --panel:#fff; --text:var(--ink);
  --lvlA:#AE5F3F; --lvlB:#6C91A6; --lvlC:#C9A227; --lvlD:#7A6C9E;
}
body.dark{
  --bg:#1C1A18; --panel:#26221F; --text:#EFE9E3; --line:#3A342F; --muted:#9C9188;
  --cream:#242019; --terracotta-bg:#3A2620; --blue-bg:#20303A;
}
*{box-sizing:border-box;}
button{color:inherit;font:inherit;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s;}
.app{display:flex;min-height:100vh;}
.sidebar{width:288px;background:var(--panel);border-right:1px solid var(--line);flex-shrink:0;padding:20px 0;display:flex;flex-direction:column;min-width:210px;max-width:520px;overflow-y:auto;}
.theme-toggle{border:1px solid var(--line);background:var(--bg);border-radius:20px;width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;}
.sidebar-search{padding:0 20px 14px;margin-bottom:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sidebar-search input{flex:1;min-width:0;box-sizing:border-box;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;color:var(--text);font-family:inherit;}
.sidebar-search input::placeholder{color:#B8ADA1;}
.sidebar-search input:focus{outline:2px solid #E4C9BE;outline-offset:0;}
.search-meta{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;font-size:12px;color:var(--muted);min-height:16px;flex-shrink:0;}
.search-meta button{border:none;background:none;color:#A8452C;font-size:12px;font-weight:700;cursor:pointer;padding:0;}
.search-meta button:hover{text-decoration:underline;}
.no-students{padding:18px 20px;font-size:13px;color:var(--muted);line-height:1.5;}
.student-list{padding:0 10px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.student-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;}
.student-item:hover{background:var(--bg);}
.student-item.active{background:#EDE3D8;border-color:#E0D2C2;}
.student-item.active .s-name{color:var(--ink);}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.s-name{font-size:15px;font-weight:700;}
.s-status{font-size:12.5px;font-weight:600;color:#9A8E82;}
.s-status.status-color-active{color:#6E8C6A;}
.s-status.status-color-paused{color:#9A8E82;}
.s-status.status-color-trial{color:#C96B5C;}
.mask-toggle{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;width:34px;height:34px;font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;flex-shrink:0;}
.mask-toggle.active{background:#E8DDD5;border-color:#D4C4B8;color:#A8452C;}
body.dark .mask-toggle{background:#2E2A27;border-color:#4A4038;color:#EFE9E3;}
body.dark .mask-toggle.active{background:#4A3830;border-color:#6A5040;color:#E0A080;}
.student-item.masked .s-name{filter:blur(5px);user-select:none;transition:filter 0.2s;}
.student-item.masked .avatar{filter:blur(3px);transition:filter 0.2s;}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;}
.dot-active{background:#6FA36F;} .dot-trial{background:var(--blue);} .dot-paused{background:#C7BDB2;}
.add-student-btn{margin:12px 10px 0;width:calc(100% - 20px);padding:10px;border-radius:10px;border:1px dashed var(--terracotta);background:none;color:var(--terracotta-dark);font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;}
.add-student-btn:hover{background:var(--terracotta-bg);}
.resizer{flex:none;width:6px;margin-left:-3px;margin-right:-3px;cursor:col-resize;position:relative;z-index:5;background:transparent;}
.resizer:hover, .resizer:active{background:rgba(168,69,44,0.12);}
.main{flex:1;padding:26px 32px;max-width:1160px;min-width:0;}
.chip{padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);}
.chip.status-active{background:#EAF3EA;color:#3E6B3E;border-color:#CFE4CF;}
.chip.status-trial{background:var(--blue-bg);color:var(--blue);border-color:#D3E2E9;}
.chip.status-paused{background:var(--cream);color:var(--muted);border-color:var(--line);}
.chip.flag{background:var(--terracotta-bg);color:var(--terracotta-dark);border-color:#EFD4C6;}
.editable{cursor:pointer;} .editable:hover{outline:1px dashed var(--terracotta-light);outline-offset:2px;}
.student-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:26px;}
.student-header-eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#A8452C;}
.student-header-name{margin:6px 0 0;font-size:40px;font-weight:800;letter-spacing:-.025em;cursor:pointer;}
.student-header-name:hover{outline:1px dashed var(--terracotta-light);outline-offset:4px;}
.student-header-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tg-token-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:14px;}
.tg-token-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.tg-token-val{font-family:monospace;font-size:12px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.tg-token-btn{flex-shrink:0;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tg-token-btn:hover{background:var(--line);}
.tg-token-btn.copied{background:var(--terracotta-dark);color:#fff;border-color:var(--terracotta-dark);}
.pill-select-wrap{position:relative;display:inline-flex;align-items:center;border-radius:999px;}
.pill-select{appearance:none;-webkit-appearance:none;-moz-appearance:none;border:none;border-radius:999px;padding:8px 28px 8px 15px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;color:inherit;background:transparent;}
.pill-select-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:11px;color:inherit;opacity:.75;}
.status-pill-active{background:#E6F0E3;color:#4E7047;}
.status-pill-trial{background:#F7E3DD;color:#A8452C;}
.status-pill-paused{background:#EFEAE3;color:#8A8078;}
.schedule-pill{background:var(--panel);border:1px solid var(--line);color:var(--text);}
.schedule-pill .pill-select{font-weight:600;}
.save-fab{width:37px;height:37px;border-radius:50%;border:none;background:#A8452C;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;transition:background .15s;}
.save-fab:hover{background:#8E3721;}
.save-fab.saved{background:#4E7047;}
.tabs-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tabs-row .tabs{margin-bottom:0;border-bottom:none;}
.collapse-toggle-btn{margin-left:auto;align-self:center;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
.collapse-toggle-btn:hover{background:var(--bg);}
.intake-placeholder{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.5;}
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line);}
.tab{padding:10px 16px;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--terracotta-dark);border-bottom-color:var(--terracotta);}
.section{margin-bottom:26px;}
.section-title{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px;}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.field{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:4px;}
.field select{width:100%;border:none;background:none;font-size:14.5px;font-weight:600;color:var(--text);font-family:inherit;padding:0;appearance:none;cursor:pointer;}
.field select:focus{outline:none;}
.tag-group{margin-bottom:16px;} .tag-group-title{font-size:13.5px;font-weight:600;margin-bottom:8px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.tag{padding:7px 13px;border-radius:20px;font-size:13px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted);}
.tag.selected{background:var(--terracotta);color:#fff;border-color:var(--terracotta);}
.admin-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:12px;}
.variant-switcher{display:flex;gap:6px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;}
.variant-btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;}
.variant-btn.active{background:var(--terracotta);color:#fff;}
.level-switcher{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.level-btn{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:6px;}
.level-btn.active{color:#fff;border-color:transparent;}
.level-btn .lvl-swatch{width:9px;height:9px;border-radius:50%;display:inline-block;}
.level-btn .lvl-count{font-weight:400;opacity:.8;}
.date-bar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:20px;flex-wrap:wrap;}
.date-bar .cur-date{font-size:13.5px;font-weight:600;} .date-bar .prev-date{font-size:12.5px;color:var(--muted);}
.pin-btn{margin-left:auto;padding:9px 16px;border-radius:10px;border:none;background:var(--terracotta);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}

.add-topic-wrap{position:relative;margin-bottom:18px;}
.add-topic-plus{width:38px;height:38px;border-radius:50%;border:none;background:var(--terracotta-dark);color:#fff;font-size:19px;font-weight:700;cursor:pointer;line-height:1;}
.add-topic-label{font-size:13px;color:var(--muted);margin-left:10px;}
.topic-popover{position:absolute;top:46px;left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,0.12);padding:14px;width:340px;max-width:90vw;}
.topic-popover-title{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;margin-bottom:8px;}
.topic-pick-list{max-height:220px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
.topic-pick-item{padding:6px 11px;border-radius:16px;font-size:12.5px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--text);}
.topic-pick-item:hover{border-color:var(--terracotta);background:var(--terracotta-bg);}
.topic-pick-empty{font-size:12.5px;color:var(--muted);font-style:italic;padding:4px 0 10px;}
.custom-topic-row{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px;}
.custom-topic-input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);}
.custom-topic-btn{padding:8px 12px;border-radius:8px;border:none;background:var(--terracotta);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.no-topics-note{font-size:13px;color:var(--muted);padding:8px 0;}

.topic-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.topic-row:last-child{border-bottom:none;}
.topic-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.topic-name{flex:1;font-size:13.5px;font-weight:600;cursor:pointer;}
.topic-score{font-size:14px;font-weight:700;min-width:34px;text-align:right;cursor:pointer;}
.topic-score.low{color:var(--terracotta-dark);} .topic-score.high{color:var(--blue);} .topic-score.none{color:var(--muted);font-weight:400;}
.topic-delta{font-size:11.5px;margin-left:2px;font-weight:600;}
.topic-delta.up{color:#3E6B3E;} .topic-delta.down{color:var(--terracotta-dark);}
.topic-remove{color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;flex-shrink:0;}
.topic-remove:hover{color:var(--terracotta-dark);}
.score-input{width:44px;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;text-align:center;font-family:inherit;background:var(--panel);color:var(--text);flex-shrink:0;-moz-appearance:textfield;}
.score-input::-webkit-outer-spin-button,.score-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.score-input.low{color:var(--terracotta-dark);border-color:var(--terracotta-light);}
.score-input.high{color:var(--blue);border-color:var(--blue-light);}
.score-input.none{color:var(--muted);}
.score-input:focus{outline:none;border-color:var(--terracotta);}
.score-input.nav-mode{outline:2px solid var(--blue);outline-offset:1px;}
.wheel-compare-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap;}
.legend-swatch{display:inline-flex;align-items:center;gap:5px;}
.legend-line{width:16px;height:0;border-top:2px solid var(--terracotta);display:inline-block;}
.legend-line.dashed{border-top:2px dashed var(--muted);}
.level-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 0 4px;flex-wrap:wrap;}
.bullet-row{margin-bottom:14px;}
.bullet-head{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;margin-bottom:6px;gap:8px;}
.bullet-head .bh-name{cursor:pointer;flex:1;}
.bullet-track{position:relative;background:var(--cream);border-radius:8px;height:22px;overflow:visible;cursor:pointer;}
.bullet-fill{position:absolute;top:0;left:0;bottom:0;border-radius:8px;transition:width .2s;}
.bullet-fill.none{background:var(--line) !important;}
.bullet-prev-marker{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;}
.bullet-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:3px;}
.wheel-wrap{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
.wheel-svg{flex:1 1 360px;min-width:0;}
.wheel-legend{flex:1 1 280px;min-width:280px;max-height:680px;overflow-y:auto;padding-right:6px;}
.srez-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.srez-card.compared{border-color:var(--terracotta);box-shadow:0 0 0 2px var(--terracotta-bg);}
.srez-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.srez-date{font-size:13px;color:var(--text);font-weight:700;}
.srez-actions{display:flex;gap:6px;flex-wrap:wrap;}
.srez-action-btn{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;}
.srez-action-btn.compare-active{background:var(--terracotta);color:#fff;border-color:var(--terracotta);}
.srez-action-btn.danger:hover{border-color:var(--terracotta-dark);color:var(--terracotta-dark);}
.srez-scores{display:flex;flex-wrap:wrap;gap:10px;}
.srez-score-pill{background:var(--cream);border-radius:8px;padding:5px 10px;font-size:12.5px;}
.srez-score-pill b{color:var(--terracotta-dark);}
/* ---------- РЕПЕРТУАР (список песен + тёмный плеер) ----------
   Фиксированная палитра из эталона (Репертуар.dc.html), не завязана на
   var(--bg)/--panel — как и остальные компоненты плеера на сайте. */
.rep-grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start;}
.rep-list{display:flex;flex-direction:column;gap:6px;}
.rep-list-title{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#A09488;margin:0 0 6px 4px;}
.rep-row{cursor:pointer;padding:12px 14px;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;align-items:center;gap:12px;}
.rep-row:hover{background:#fff;}
.rep-row.sel{background:#fff;border-color:#E0D6C8;}
.rep-row-main{flex:1;min-width:0;}
.rep-row-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#23201D;}
.rep-row-artist{font-size:13px;color:#8A7E74;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-status-wrap{flex:none;position:relative;}
.rep-status-btn{display:flex;align-items:center;gap:4px;border:none;cursor:pointer;font-size:11.5px;font-weight:700;padding:3px 7px 3px 8px;border-radius:6px;font-family:inherit;}
.rep-status-arrow{font-size:9px;}
.rep-status-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:150px;background:#fff;border:1px solid #E0D6C8;border-radius:10px;box-shadow:0 6px 20px rgba(35,32,29,.12);padding:4px;display:flex;flex-direction:column;gap:2px;}
.rep-status-opt{display:flex;align-items:center;gap:8px;border:none;background:transparent;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:13px;font-weight:700;color:#23201D;text-align:left;font-family:inherit;}
.rep-status-opt:hover,.rep-status-opt.on{background:#F4EFE8;}
.rep-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rep-add-btn{margin-top:6px;border:1px dashed #C9B7A4;background:none;color:#A8452C;font-size:14px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer;font-family:inherit;}
.rep-add-btn:hover{background:#EFE7DC;}
.rep-empty{background:#fff;border:1px solid #ECE5DB;border-radius:18px;padding:26px 28px;font-size:14.5px;color:#6E645A;}
.rep-card{background:#fff;border:1px solid #ECE5DB;border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:24px;}
.rep-player{background:#23201D;color:#FAF7F2;border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;}
.rep-player-head{display:flex;gap:16px;align-items:flex-start;}
.rep-title-input,.rep-artist-input{display:block;width:100%;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-7px;background:transparent;font-family:inherit;}
.rep-title-input{font-size:28px;font-weight:800;letter-spacing:-.02em;color:#FAF7F2;}
.rep-artist-input{font-size:15px;font-weight:600;color:#C9BEB2;margin-top:2px;}
.rep-title-input:hover,.rep-title-input:focus,.rep-artist-input:hover,.rep-artist-input:focus{border-color:#4A433C;outline:none;}
.rep-key-wrap{flex:none;text-align:right;}
.rep-key-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9A8E82;}
.rep-key-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:500;margin-top:2px;}
.rep-controls{display:flex;flex-direction:column;gap:14px;}
.rep-transport{display:flex;align-items:center;gap:14px;}
.rep-play-btn{flex:none;width:50px;height:50px;border-radius:50%;border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.rep-wave{flex:1;min-width:0;position:relative;height:47px;display:flex;align-items:center;gap:2px;cursor:pointer;}
.rep-bar{flex:1;min-width:0;border-radius:2px;}
.rep-pin{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:#6E9A5E;pointer-events:none;}
.rep-sub-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rep-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:#A09488;margin-right:2px;}
.rep-speed-btn{height:27px;padding:0 10px;border-radius:7px;border:1px solid #3A342E;background:transparent;color:#D8CFC5;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}
.rep-speed-btn.on{border-color:#A8452C;color:#C97B62;}
.rep-markers-row{display:flex;gap:8px;flex-wrap:wrap;}
.rep-chip{display:flex;align-items:center;background:#2E2A25;border-radius:6px;padding:0 1px 0 10px;height:27px;}
.rep-chip-text{border:none;background:none;padding:0;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:#8DB27A;}
.rep-chip-remove{border:none;background:none;padding:3px 6px;cursor:pointer;font-size:9px;color:#9A8E82;opacity:0;}
.rep-chip:hover .rep-chip-remove{opacity:1;}
.rep-marker-add{height:27px;padding:0 10px;border-radius:6px;border:1px dashed #4A433C;background:transparent;color:#8DB27A;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}
.rep-tracks{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid #3A342E;}
.rep-track-row{display:flex;align-items:center;gap:14px;min-width:0;background:#2C2824;border-radius:11px;padding:10px 14px;}
.rep-track-label{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#E2A48F;width:58px;}
.rep-track-info{flex:1;min-width:0;}
.rep-track-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-track-dur{font-family:'JetBrains Mono',monospace;font-size:11px;color:#9A8E82;margin-top:1px;}
.rep-vol{flex:none;display:flex;align-items:center;gap:10px;width:230px;}
.rep-vol-icon{font-size:13px;color:#9A8E82;}
.rep-vol input[type=range]{flex:1;min-width:0;accent-color:#E2A48F;cursor:pointer;}
.rep-vol-val{width:38px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#C9BEB2;}
.rep-track-replace{flex:none;border:none;background:none;color:#E2A48F;font-size:12px;font-weight:700;cursor:pointer;padding:2px;font-family:inherit;}
.rep-track-remove{flex:none;border:none;background:none;color:#9A8E82;font-size:14px;cursor:pointer;padding:2px;}
.rep-track-upload{flex:1;border:1px dashed #5A524A;border-radius:8px;background:none;color:#E2A48F;font-size:12.5px;font-weight:700;cursor:pointer;padding:8px 10px;text-align:left;font-family:inherit;}
.rep-fields{display:grid;grid-template-columns:110px 160px minmax(0,1fr);gap:12px;}
.rep-field-label{display:flex;flex-direction:column;gap:5px;}
.rep-field-label>span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#A09488;}
.rep-field-input{padding:9px 12px;border:1px solid #E0D6C8;border-radius:10px;font-size:14px;font-weight:700;color:#23201D;background:#fff;font-family:inherit;}
.rep-field-input.date{font-weight:600;}
.rep-link-row{display:flex;gap:8px;}
.rep-link-input{flex:1;min-width:0;padding:9px 12px;border:1px solid #E0D6C8;border-radius:10px;font-size:14px;font-weight:600;color:#23201D;background:#fff;font-family:inherit;}
.rep-link-badge{flex:none;display:flex;align-items:center;padding:0 10px;border-radius:10px;background:#F4EFE8;font-size:13px;font-weight:700;color:#A8452C;text-decoration:none;}
.rep-lyrics{display:flex;flex-direction:column;gap:10px;}
.rep-lyrics-head{display:flex;align-items:center;justify-content:space-between;}
.rep-lyrics-title{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#A09488;}
.rep-lyrics-edit-btn{border:1px solid #E4DCD1;background:#fff;color:#6E645A;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:9px;cursor:pointer;font-family:inherit;}
.rep-lyrics-edit-btn:hover{background:#F4EFE8;}
.rep-lyrics-textarea{box-sizing:border-box;width:100%;resize:vertical;padding:12px 14px;border:1px solid #E0D6C8;border-radius:12px;font-size:14px;line-height:1.55;color:#23201D;background:#fff;font-family:inherit;}
.rep-lyrics-hint{font-size:12.5px;color:#8A7E74;}
.rep-lyrics-box{background:#FAF7F2;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.rep-lyrics-lines{font-size:14.5px;line-height:1.6;color:#3A342E;}
.rep-lyrics-line{min-height:10px;}
.rep-lyrics-more{align-self:flex-start;border:none;background:none;color:#A8452C;font-size:13px;font-weight:700;cursor:pointer;padding:0;font-family:inherit;}
.rep-lyrics-add{border:1px dashed #C9B7A4;background:none;color:#A8452C;font-size:14px;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;text-align:left;font-family:inherit;}
.rep-notes-label{display:flex;flex-direction:column;gap:8px;}
.rep-notes-label>span{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#A09488;}
.rep-notes-textarea{box-sizing:border-box;width:100%;resize:vertical;padding:11px 14px;border:1px solid #E0D6C8;border-radius:12px;font-size:14px;line-height:1.5;color:#23201D;background:#fff;font-family:inherit;}
.rep-delete-row{display:flex;justify-content:flex-end;}
.rep-delete-btn{border:none;background:none;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;color:#A09488;font-family:inherit;}
.rep-delete-btn.confirm{color:#A8452C;}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}

/* ---------- CARD TAB (anamnesis + lessons) ---------- */
.card-loading{padding:30px 0;color:var(--muted);font-size:13.5px;}
.intake-empty{padding:14px 16px;background:var(--terracotta-bg);border-radius:12px;color:var(--terracotta-dark);font-size:13px;margin-bottom:16px;}
.card-error{padding:14px 16px;background:#FBEAEA;border:1px solid #EFC9C9;border-radius:12px;color:#A33A3A;font-size:13px;margin-bottom:16px;}
.btn{padding:9px 16px;border-radius:8px;border:none;background:var(--terracotta);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;}
.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);}
.btn:disabled{opacity:.55;cursor:default;}

/* ---------- KABINET (anketa accordion) ---------- */
.kb-loading{padding:30px 0;color:var(--muted);font-size:13.5px;}
.kb-wrap{display:flex;flex-direction:column;gap:34px;}
.kb-summary{display:flex;align-items:center;gap:16px;background:#EDE3D8;border:1px solid #E0D2C2;border-radius:16px;padding:16px 19px;flex-wrap:wrap;}
body.dark .kb-summary{background:#3A2F26;border-color:#4A3B2E;}
.kb-summary-title{font-size:14.5px;font-weight:800;}
.kb-summary-desc{font-size:13px;color:#7A6E62;margin-top:3px;line-height:1.45;}
body.dark .kb-summary-desc{color:#B8ADA1;}
.kb-summary-btn{padding:12px 22px;border:none;border-radius:11px;background:var(--terracotta-dark);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.kb-summary-btn:hover{background:#7A2C1D;}
.kb-sec-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.kb-sec-toggle{display:flex;align-items:center;gap:9px;border:none;background:none;padding:0;cursor:pointer;color:#A09488;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
.kb-chevron{width:20px;height:20px;border-radius:6px;background:var(--bg);color:#8A8076;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;}
.kb-sec-hint{font-size:12.5px;color:#B8ADA1;}
.kb-sec-actions{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.kb-ghost-btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
.kb-ghost-btn:hover{background:var(--bg);}
.kb-ghost-btn.active{background:#2C2724;border-color:#2C2724;color:#F7F2EB;}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:10px;}
.kb-grid-row3{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:10px;}
.kb-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;}
.kb-card.span2{grid-column:span 2;}
.kb-card label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A09488;margin-bottom:5px;}
.kb-card-note{font-size:12px;color:var(--muted);margin-top:3px;}
.kb-multi-field{position:relative;}
.kb-dict-wrap{position:relative;}
.kb-multi-trigger{width:100%;min-height:26px;border:none;background:none;padding:0;font-family:inherit;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;}
.kb-multi-chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0;}
.kb-multi-chip-tag{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text);line-height:1.3;}
.kb-multi-placeholder{font-size:16px;font-weight:400;color:#B8ADA1;}
.kb-multi-caret{font-size:10px;color:var(--muted);flex-shrink:0;margin-top:4px;}
.kb-dict-dropdown{position:absolute;left:8px;right:8px;min-width:340px;max-width:min(480px, calc(100vw - 40px));top:100%;z-index:200;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 28px rgba(35,32,29,0.16);padding:6px;display:flex;flex-direction:column;}
.kb-dict-chip-grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;max-height:308px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding:2px 10px 4px 2px;}
.kb-dict-divider{height:1px;background:#EFE7DC;margin:6px 4px;flex:none;}
.kb-chip-item{display:inline-flex;align-items:stretch;flex:none;max-width:100%;border-radius:999px;background:transparent;border:1px solid #E4DCD1;overflow:hidden;}
.kb-chip-item.selected{background:#F1EDE5;border-color:#D9CFC2;}
.kb-chip-select{padding:7px 12px;border:none;background:none;cursor:pointer;font-size:13.5px;font-weight:600;color:#23201D;white-space:normal;max-width:280px;line-height:1.3;font-family:inherit;}
.kb-chip-item.selected .kb-chip-select{font-weight:700;}
.kb-chip-pin,.kb-chip-del{border:none;border-left:1px solid #E4DCD1;background:none;cursor:pointer;font-size:12px;padding:0 8px;white-space:nowrap;font-family:inherit;}
.kb-chip-pin{color:#A8452C;}
.kb-chip-del{color:#C0B4A6;}
.kb-dict-confirm{flex-basis:100%;padding:8px 10px;background:#F6EAE5;border-radius:9px;}
.kb-select,.kb-input,.kb-textarea{width:100%;border:none;background:none;font-size:16px;font-weight:600;color:var(--text);font-family:inherit;padding:0;appearance:none;cursor:pointer;}
.kb-input,.kb-textarea{cursor:text;}
.kb-textarea{resize:vertical;min-height:44px;line-height:1.45;}
.kb-select:focus,.kb-input:focus,.kb-textarea:focus{outline:none;}
.kb-pair{display:flex;gap:18px;}
.kb-pair>div{flex:1;}
.kb-anamnesis-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:20px;}
.kb-block-title{font-size:13.5px;font-weight:700;margin-bottom:10px;}
.kb-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.kb-chip{padding:5px 11px;border-radius:8px;font-size:12.5px;line-height:1.25;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:600;}
.kb-chip.on{background:#2C2724;border-color:#2C2724;color:#F7F2EB;font-weight:700;}
.kb-chip.on.warn{background:#F6EAE5;border-color:#E8CFC5;color:var(--terracotta-dark);}
.kb-subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}
.kb-subcard{background:var(--bg);border-radius:12px;padding:13px 15px;position:relative;}
.kb-subcard label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A09488;margin-bottom:5px;}
.kb-admin-block{border-top:1px dashed var(--line);padding-top:18px;}
.kb-admin-title-row{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.kb-admin-title{font-size:13.5px;font-weight:700;}
.kb-admin-badge{padding:4px 9px;border-radius:6px;background:#F1E7E3;color:var(--terracotta-dark);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
body.dark .kb-admin-badge{background:#4A2E28;}
.kb-structure-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;}
.kb-structure-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.kb-structure-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.kb-structure-label{font-size:14.5px;font-weight:700;}
.kb-structure-hint{font-size:11.5px;color:var(--muted);font-weight:600;}
.kb-structure-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.kb-small-btn{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--bg);border:1px solid var(--line);color:var(--muted);}
.kb-small-btn.on{background:#2C2724;border-color:#2C2724;color:#F7F2EB;font-weight:700;}
.kb-small-btn.risk{background:#F6EAE5;border-color:#E0553A;color:var(--terracotta-dark);font-weight:700;}
.kb-structure-severity{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.kb-structure-severity-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--terracotta-dark);margin-bottom:6px;}
.kb-structure-severity-scale{display:flex;gap:3px;flex-wrap:wrap;}
.kb-sev-btn{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
.kb-sev-btn.on{background:var(--terracotta-dark);border-color:var(--terracotta-dark);color:#fff;}
.kb-qual-wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;}
.kb-qual-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px 21px;}
.kb-qual-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.kb-qual-hint{font-size:11.5px;color:var(--muted);}
.kb-qual-list{display:flex;flex-direction:column;gap:7px;margin-top:13px;}
.kb-state-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 15px;border-radius:12px;cursor:pointer;text-align:left;border:1px solid transparent;font-family:inherit;}
.kb-state-name{font-size:15px;font-weight:700;color:var(--text);}
.kb-state-recipe{font-size:12px;color:var(--muted);font-weight:600;margin-left:8px;}
.kb-state-badge{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
body.dark .kb-state-row[data-kb-state="есть"]{background:#1E3020!important;border-color:#2E4830!important;}
body.dark .kb-state-row[data-kb-state="частично"]{background:#3A2A14!important;border-color:#5A4020!important;}
body.dark .kb-state-row[data-kb-state="нет"]{background:var(--panel)!important;border-color:var(--line)!important;}
body.dark .kb-state-row[data-kb-state="есть"] .kb-state-badge{color:#6DA874!important;}
body.dark .kb-state-row[data-kb-state="частично"] .kb-state-badge{color:#D4A855!important;}
body.dark .kb-state-row[data-kb-state="нет"] .kb-state-badge{color:var(--muted)!important;}
body.dark .dn-grade-badge[data-tier="high"]{background:#1E3020!important;border-color:#2E4830!important;color:#6DA874!important;}
body.dark .dn-grade-badge[data-tier="mid"]{background:var(--panel)!important;border-color:var(--line)!important;color:var(--muted)!important;}
body.dark .dn-grade-badge[data-tier="low"]{background:#3A2018!important;border-color:#5A3020!important;color:#E0A899!important;}
body.dark .dn-range-changed{background:#1E3020!important;border-color:#2E4830!important;color:#6DA874!important;}
body.dark .kb-small-btn.risk{background:#3A2018;border-color:#5A3020;color:#E0A899;}
body.dark .dn-trend-area{fill:#2E2A26!important;}
body.dark .dn-trend-line{stroke:#5A5048!important;}
.kb-side-col{display:flex;flex-direction:column;gap:10px;}
.kb-modes-card{background:#F4EFE8;border:1px solid #E4DACC;border-radius:16px;padding:19px 21px;}
body.dark .kb-modes-card{background:#332A22;border-color:#4A3B2E;}
.kb-modes-title-row{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.kb-modes-title{font-size:13.5px;font-weight:700;}
.kb-modes-badge{padding:4px 9px;border-radius:6px;background:#E4D8C7;color:#6E5B48;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.kb-modes-desc{font-size:12.5px;color:#8A8076;line-height:1.45;margin-bottom:13px;}
body.dark .kb-modes-desc{color:#B8ADA1;}
.kb-modes-subtitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A09488;margin-bottom:8px;}
.kb-modes-list{display:flex;flex-direction:column;gap:6px;}
.kb-metallic-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px 21px;}
.kb-metallic-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.kb-metallic-title{font-size:13.5px;font-weight:700;}
.kb-metallic-value{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--terracotta-dark);font-weight:500;}
.kb-metallic-scale{display:flex;justify-content:space-between;font-size:12px;color:#9A8E82;font-weight:600;}
.kb-metallic-note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45;}
input[type="range"].kb-metal{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:14px 0 7px;}
input[type="range"].kb-metal::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,#E7DFD4,#D8C7B6);}
input[type="range"].kb-metal::-moz-range-track{height:8px;border-radius:999px;background:linear-gradient(90deg,#E7DFD4,#D8C7B6);}
input[type="range"].kb-metal::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-5px;border-radius:50%;background:var(--terracotta-dark);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.18);}
input[type="range"].kb-metal::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--terracotta-dark);border:3px solid #fff;}
.kb-anchors-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px 21px;}
.kb-rec-box{background:#2C2724;border-radius:18px;padding:20px 22px;}
.kb-rec-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.kb-rec-btn{padding:0 22px;height:48px;border-radius:24px;border:none;font-size:14.5px;font-weight:800;letter-spacing:.02em;cursor:pointer;background:var(--terracotta-dark);color:#fff;}
.kb-rec-btn.active{background:#E0553A;}
.kb-rec-caption{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#A2968A;}
.kb-rec-caption.saving{color:#D8A582;}
.kb-rec-caption.saved{color:#8FBF8A;}
.kb-rec-btn:disabled{opacity:.55;cursor:default;}
.kb-rec-timer{font-family:'JetBrains Mono',monospace;font-size:25px;font-weight:500;color:#F7F2EB;letter-spacing:.02em;}
.kb-rec-dot{width:11px;height:11px;border-radius:50%;background:#E0553A;animation:kbrecpulse 1.1s infinite;}
@keyframes kbrecpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.82);}}
  @keyframes recpulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.kb-rec-bars{display:flex;gap:4px;align-items:center;height:40px;}
.kb-rec-bar{width:3px;border-radius:2px;background:#5E544B;transition:height .09s;}
.kb-rec-takes{margin-top:18px;padding-top:16px;border-top:1px solid #423A34;display:flex;flex-direction:column;gap:10px;}
.kb-rec-take-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.kb-rec-take-name{font-size:14px;font-weight:700;color:#F7F2EB;min-width:168px;}
.kb-rec-take-meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:#A2968A;margin-top:2px;}
.kb-rec-take-del{border:none;background:none;color:#8A7E74;font-size:13px;font-weight:700;cursor:pointer;}
.kb-rec-take-dl{font-size:13px;font-weight:700;color:#E0A899;}
.kb-rec-error{margin-top:14px;font-size:13px;color:#E3A99A;line-height:1.45;}
.kb-upload-label{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
.kb-upload-label:hover{background:var(--bg);}
.vr-box{background:#2A2622;border-radius:16px;padding:18px 20px;font-family:inherit;}
.vr-box,.vr-take,.vr-light-row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.vr-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.vr-btn{flex:none;padding:11px 22px;border-radius:12px;border:none;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;background:#F7F3EC;color:#23201D;transition:background .15s,color .15s;}
.vr-btn.active{background:#A8452C;color:#fff;}
.vr-btn:disabled{opacity:.5;cursor:default;}
.vr-caption{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#8D8378;margin-bottom:5px;}
.vr-caption.saved{color:#8FBF8A;}
.vr-timer{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:500;color:#8D8378;letter-spacing:.02em;}
.vr-timer.live{color:#F7F3EC;}
.vr-timer.warn{color:#E0553A;}
.vr-dot{width:9px;height:9px;border-radius:50%;background:#A8452C;animation:vrpulse 1.2s ease-in-out infinite;flex-shrink:0;}
@keyframes vrpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.8);}}
.vr-select{border:1px solid #423A34;background:#231F1B;color:#D8CFC5;border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;cursor:pointer;}
.vr-check-label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#B8ADA1;cursor:pointer;user-select:none;}
.vr-bars{display:flex;gap:2px;align-items:center;height:44px;flex:1;min-width:120px;overflow:hidden;}
.vr-bar{flex:1 1 0%;border-radius:2px;background:#C97B62;transition:height .06s linear;}
.vr-ctl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
.vr-ctl-btn{padding:7px 13px;border-radius:9px;border:1px solid #423A34;background:none;color:#B8ADA1;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.vr-ctl-btn:hover{background:#332C26;}
.vr-ctl-btn.danger:hover{color:#E0A899;border-color:#5A3A30;}
.vr-marker-count{font-size:11px;opacity:.75;margin-left:3px;}
.vr-marker-chip{padding:4px 9px;border-radius:7px;background:#332C26;color:#C9BCAE;font-size:11.5px;font-family:'JetBrains Mono',monospace;}
.vr-error{margin-top:12px;font-size:12.5px;color:#E3A99A;line-height:1.45;}
.vr-save-row{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;}
.vr-save-btn{flex:none;padding:12px 20px;border-radius:11px;border:none;background:#A8452C;color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;}
.vr-save-btn:hover{background:#8E3721;}
.vr-save-btn:disabled{opacity:.55;cursor:default;}
.vr-discard-link{background:none;border:none;color:#8A7E74;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.vr-upload-label{padding:0;border:none;background:none;color:#8A7E74;font-size:11.5px;font-weight:600;text-decoration:underline;cursor:pointer;}
.vr-take{background:transparent;border:none;border-radius:0;padding:0;}
.vr-take + .vr-take{border-top:1px solid #3A342E;margin-top:12px;padding-top:12px;}
.vr-saving-phase{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#B8ADA1;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.vr-spinner{width:12px;height:12px;border-radius:50%;border:2px solid #423A34;border-top-color:#C97B62;animation:vrspin .8s linear infinite;flex-shrink:0;}
@keyframes vrspin{to{transform:rotate(360deg);}}
.vr-saving-pct{font-family:'JetBrains Mono',monospace;font-size:12px;color:#8D8378;flex-shrink:0;}
.vr-progress-track{height:6px;border-radius:3px;background:#332C26;margin-top:6px;overflow:hidden;}
.vr-progress-fill{height:100%;background:#A8452C;transition:width .06s linear;}
.vr-take-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.vr-take-title{font-size:13.5px;font-weight:700;color:#F7F3EC;cursor:text;}
.vr-take-title-input{font-size:13.5px;font-weight:700;background:#332C26;color:#F7F3EC;border:1px solid #4A4038;border-radius:6px;padding:2px 6px;font-family:inherit;}
.vr-take-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:#A2968A;margin-left:52px;}
.vr-take-wave{position:relative;display:flex;gap:1px;align-items:center;height:30px;margin-top:8px;cursor:pointer;}
.vr-take-bar{flex:1 1 0%;border-radius:2px;background:#5E544B;}
.vr-take-bar.played{background:#A8452C;}
.vr-take-pin{position:absolute;top:0;bottom:0;width:6px;border-radius:2px;background:#7C9A62;pointer-events:none;}
.vr-take-transport{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;}
.vr-tr-btn{height:30px;padding:0 10px;border-radius:8px;border:1px solid #3A342E;background:transparent;color:#B5A8A1;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;text-decoration:none;}
.vr-tr-btn:hover{background:#2C2723;}
.vr-tr-btn.on{color:#C97B62;border-color:#5A3A30;}
.vr-tr-play{background:#F7F3EC;color:#23201D;border-color:#F7F3EC;}
.vr-tr-play:hover{background:#F7F3EC;}
.vr-take-time{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#A2968A;}
.vr-take-markers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.vr-mk-chip{position:relative;padding:4px 8px;border-radius:7px;background:#332C26;color:#7C9A62;font-size:11.5px;font-family:'JetBrains Mono',monospace;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.vr-mk-chip:hover .vr-mk-del{display:inline;}
.vr-mk-del{display:none;color:#E0A899;font-weight:700;}
.vr-mk-input{font-size:11.5px;font-family:inherit;background:#231F1B;color:#F7F3EC;border:1px solid #5A3A30;border-radius:6px;padding:2px 6px;width:110px;}
.vr-light-row{display:flex;align-items:center;gap:12px;background:#FAF7F2;border:1px solid #F0EAE1;border-radius:14px;padding:9px 14px;min-height:56px;box-sizing:border-box;}
.vr-light-play{width:38px;height:38px;border-radius:50%;border:none;background:#23201D;color:#F7F3EC;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.vr-light-mid{flex:1;min-width:0;}
.vr-light-title{font-size:13px;font-weight:700;color:#23201D;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vr-light-wave{display:flex;gap:1px;align-items:center;height:26px;cursor:pointer;}
.vr-light-bar{flex:1 1 0%;border-radius:1px;background:#E4DCD1;}
.vr-light-bar.played{background:#A8452C;}
.vr-light-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:#8A8078;flex-shrink:0;}
.vr-light-rate{height:26px;padding:0 8px;border-radius:7px;border:1px solid #E4DCD1;background:#fff;color:#6E645A;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;}
.vr-light-menu-btn{width:26px;height:26px;border-radius:7px;border:1px solid #E4DCD1;background:#fff;color:#8A8078;cursor:pointer;flex-shrink:0;}
.vr-light-menu{position:absolute;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #E4DCD1;border-radius:10px;box-shadow:0 8px 20px rgba(35,32,29,.12);padding:6px;z-index:20;flex-direction:column;min-width:150px;}
.vr-light-menu button, .vr-light-menu a{padding:8px 10px;border:none;background:none;text-align:left;font-size:12.5px;color:#23201D;cursor:pointer;border-radius:6px;text-decoration:none;font-family:inherit;display:block;width:100%;box-sizing:border-box;}
.vr-light-menu button:hover, .vr-light-menu a:hover{background:#F4EEE6;}
.vr-light-menu-wrap{position:relative;}
.vr-save-row-outer{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.vr-save-btn-outer{width:100%;padding:14px;border-radius:12px;border:none;background:#A8452C;color:#fff;font-size:14px;font-weight:800;cursor:pointer;}
.vr-save-btn-outer:hover{background:#8E3721;}
.vr-save-btn-outer:disabled{opacity:.55;cursor:default;}



.kb-files-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;}
.kb-files-empty{padding:14px 10px;font-size:13px;color:var(--muted);}
.kb-file-row{display:flex;align-items:center;gap:14px;padding:11px 10px;flex-wrap:wrap;}
.kb-file-name{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;flex:1;min-width:240px;}
.kb-file-topic{font-size:13px;color:var(--muted);}
.kb-file-missing{font-size:12.5px;color:#C0B4A6;font-weight:600;}
.kb-compare-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px 19px;margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
.kb-compare-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A09488;}
.kb-compare-row{display:flex;align-items:center;gap:9px;margin-top:6px;flex-wrap:wrap;}
.kb-compare-start{font-size:15px;font-weight:600;color:#9A8E82;}
.kb-compare-arrow{font-size:13px;color:#C0B4A6;}
.kb-compare-now{font-size:15px;font-weight:700;}
.kb-compare-delta{padding:4px 9px;border-radius:7px;background:#E6F0E3;color:#4E7047;font-size:12px;font-weight:700;}
/* Fixed viewport width (see <meta name="viewport"> above) already stops
   tablets from reflowing the layout — this rule is a second safety net.
   Some touch browsers still auto-zoom the whole page when a focused
   input/select/textarea computes to less than 16px font-size, regardless
   of viewport width. Scoped to coarse-pointer (touch) devices only, so
   desktop/mouse rendering is completely untouched. */
@media (pointer: coarse) {
  input, select, textarea { font-size: 16px !important; }
}
/* Native <input type="date"> (Dnevnik zanyatiy "Дата" field) ships its own
   OS/browser-level control chrome that ignores our height/padding on some
   mobile browsers (mobile Safari especially), so it can render taller/
   differently-proportioned than the plain text inputs sitting next to it
   in the same grid row even though both share the exact same inline style.
   Resetting -webkit-appearance/appearance to none strips that native sizing
   without touching the calendar-picker-indicator icon or the native picker
   dropdown itself, which stay fully functional. */
input[type="date"] {
  -webkit-appearance: none;
  -moz-appearance: textfield;
  appearance: none;
}

/* ── Артикуляционные особенности ── */
.art-entry-card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;}
.art-entry-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.art-entry-badge{width:48px;height:48px;border-radius:50%;background:var(--terracotta-dark);color:#fff;font-weight:800;letter-spacing:-0.03em;display:flex;align-items:center;justify-content:center;flex-shrink:0;white-space:nowrap;line-height:1;}
.art-block-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.art-prep-list{margin:4px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px;}
.art-prep-list li{font-size:13px;line-height:1.4;}
.art-method-card{padding:10px 12px;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;gap:6px;}
.art-method-card.marked-ok{box-shadow:inset 0 0 0 1px #4E7047;}

body.dark .art-mark-btn.fail.active{background:#3A2018;border-color:#5A3020;color:#E0A899;}

/* ---------- password lock overlay ---------- */
#site-lock{position:fixed;inset:0;z-index:99999;background:#F2ECE7;display:flex;align-items:center;justify-content:center;}
#site-lock.hidden{display:none;}
.lock-card{background:#fff;border:1px solid #E4E0DA;border-radius:20px;padding:40px 36px;width:360px;max-width:calc(100vw - 40px);box-shadow:0 4px 32px rgba(0,0,0,.07);}
.lock-logo{font-size:28px;font-weight:800;color:#AE5F3F;letter-spacing:-.02em;margin-bottom:6px;}
.lock-sub{font-size:13px;color:#8A8078;margin-bottom:28px;}
.lock-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A8078;margin-bottom:6px;}
.lock-input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1.5px solid #E4E0DA;background:#F9F6F3;font-size:15px;color:#2E2A27;font-family:inherit;outline:none;}
.lock-input:focus{border-color:#AE5F3F;}
.lock-err{font-size:13px;color:#A8452C;margin-top:8px;min-height:18px;}
.lock-btn{width:100%;margin-top:20px;padding:14px;border-radius:14px;border:none;background:#AE5F3F;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.lock-btn:hover{background:#8A3324;}
.lock-btn:disabled{background:#C7CDD1;cursor:default;}

/* ---------- Распевки ---------- */
.wu-filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.wu-filter-label{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-right:6px;}
.wu-filter-chip{height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--panel);color:var(--muted);}
.wu-filter-chip.on{border-color:#23201D;background:#23201D;color:#FAF7F2;}
body.dark .wu-filter-chip.on{border-color:#EFE9E3;background:#EFE9E3;color:#23201D;}
.wu-total{font-size:13px;color:var(--muted);margin:0 0 18px;}
.wu-levels{display:flex;flex-direction:column;gap:14px;}
.wu-level-card{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px 18px;}
.wu-level-head{display:flex;align-items:center;gap:12px;cursor:pointer;}
.wu-level-badge{width:30px;height:30px;border-radius:9px;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;}
.wu-level-name{font-size:17px;font-weight:800;}
.wu-level-hint{font-size:13.5px;color:var(--muted);}
.wu-level-count{font-size:12.5px;font-weight:700;color:var(--muted);}
.wu-level-caret{font-size:12px;color:var(--muted);width:16px;text-align:center;}
.wu-level-body{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.wu-ex-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;}
.wu-ex-top{display:flex;align-items:center;gap:8px;}
.wu-arrow-btn{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;}
.wu-arrow-btn:hover{background:var(--bg);}
.wu-arrow-btn:disabled{opacity:.35;cursor:default;}
.wu-ex-title{flex:1;min-width:0;height:34px;border:1px solid transparent;border-radius:8px;background:none;padding:0 8px;font-size:15.5px;font-weight:700;color:var(--text);font-family:inherit;}
.wu-ex-title:hover,.wu-ex-title:focus{border-color:var(--line);outline:none;}
.wu-ex-audio-count{font-size:12.5px;color:var(--muted);white-space:nowrap;}
.wu-ex-del-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:#A8452C;font-size:14px;cursor:pointer;}
.wu-ex-del-btn:hover{background:var(--terracotta-bg);border-color:#D9A392;}
.wu-del-confirm{display:flex;align-items:center;gap:10px;background:var(--terracotta-bg);border:1px solid #E8C4B6;border-radius:10px;padding:8px 12px;}
.wu-del-confirm-text{flex:1;font-size:13px;font-weight:600;color:#7E3220;}
.wu-del-confirm-btn{height:30px;padding:0 12px;border:none;border-radius:8px;background:#A8452C;color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;}
.wu-del-cancel-btn{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
.wu-topics-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-left:68px;position:relative;}
.wu-topic-chip{display:flex;align-items:center;gap:2px;height:26px;padding:0 4px 0 10px;border-radius:13px;background:var(--bg);font-size:12.5px;font-weight:700;color:var(--muted);}
.wu-topic-remove{border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0 5px;}
.wu-topic-remove:hover{color:#A8452C;}
.wu-topic-add{height:26px;padding:0 10px;border:1px dashed var(--line);border-radius:13px;background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.wu-topic-add:hover{background:var(--bg);}
.wu-popover{position:absolute;left:0;top:calc(100% + 4px);z-index:25;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(35,32,29,0.14);padding:4px;display:flex;flex-direction:column;gap:2px;}
.wu-popover-item{border:none;background:none;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px;font-weight:700;color:var(--text);text-align:left;white-space:nowrap;font-family:inherit;}
.wu-popover-item:hover{background:var(--bg);}
.wu-audio{background:#2A2622;border-radius:12px;padding:8px 10px 8px 8px;display:flex;flex-direction:column;gap:8px;}
.wu-audio-top{display:flex;align-items:center;gap:8px;}
.wu-play-btn{width:34px;height:34px;flex:none;border-radius:50%;border:none;background:#C97B62;color:#fff;font-size:12px;cursor:pointer;}
.wu-audio-name{width:150px;flex:none;height:26px;border:1px solid transparent;border-radius:6px;background:none;padding:0 6px;font-size:12.5px;font-weight:700;color:#E8B9A6;font-family:inherit;}
.wu-audio-name:hover,.wu-audio-name:focus{border-color:#3A342E;outline:none;}
.wu-wave{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:1px;cursor:pointer;overflow:hidden;}
.wu-bar{flex:1;min-width:1px;background:#5A524B;border-radius:1px;}
.wu-bar.played{background:#C97B62;}
.wu-audio-time{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#B8ADA1;white-space:nowrap;}
.wu-star-btn{width:26px;height:26px;flex:none;border:none;background:none;color:#D9A520;font-size:16px;cursor:pointer;}
.wu-gear-btn{height:26px;width:32px;flex:none;border-radius:7px;border:1px solid #3A342E;background:none;color:#E8E1D8;font-size:14px;cursor:pointer;}
.wu-gear-btn.on{background:#3A342E;}
.wu-gear-panel{border-top:1px solid #3A342E;padding:10px 4px 2px 6px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 28px;}
.wu-gear-col{display:flex;flex-direction:column;gap:8px;}
.wu-gear-head{display:flex;align-items:center;gap:8px;}
.wu-gear-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B8ADA1;}
.wu-gear-base{font-size:12px;color:#8A7E74;}
.wu-gear-base-input{width:40px;height:22px;border:1px solid #3A342E;border-radius:6px;background:none;color:#E8E1D8;font-size:11px;text-align:center;font-family:'JetBrains Mono',monospace;}
.wu-gear-base-select{height:22px;border:1px solid #3A342E;border-radius:6px;background:#2A2622;color:#E8E1D8;font-size:11px;font-family:inherit;}
.wu-reset-btn{height:22px;padding:0 8px;border:1px solid #3A342E;border-radius:6px;background:none;color:#B8ADA1;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.wu-gear-row{display:flex;align-items:center;gap:10px;}
.wu-mini-btn{width:28px;height:28px;border:1px solid #3A342E;border-radius:7px;background:none;color:#E8E1D8;font-size:14px;font-weight:800;cursor:pointer;}
.wu-mini-btn:hover{background:#332E29;}
.wu-gear-val{min-width:66px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#E8E1D8;white-space:nowrap;}
.wu-gear-hint{grid-column:1 / -1;font-size:11px;color:#8A7E74;margin-top:-4px;}
.wu-gear-actions{grid-column:1 / -1;display:flex;gap:6px;}
.wu-gear-action-btn{height:26px;padding:0 10px;border:1px solid #3A342E;border-radius:7px;background:none;color:#E8E1D8;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.wu-gear-action-btn:hover{background:#332E29;}
.wu-gear-action-btn.danger{color:#E8A08A;}
.wu-rec-row{background:#2A2622;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:12px;}
.wu-rec-dot{width:10px;height:10px;border-radius:50%;background:#E0563A;margin-left:6px;flex:none;animation:wuRecPulse 1.1s infinite;}
@keyframes wuRecPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.wu-rec-label{font-size:13px;font-weight:700;color:#E8E1D8;}
.wu-rec-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:#B8ADA1;}
.wu-rec-stop{height:30px;padding:0 12px;border:none;border-radius:8px;background:#C97B62;color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;}
.wu-rec-cancel{height:30px;padding:0 12px;border:1px solid #3A342E;border-radius:8px;background:none;color:#E8E1D8;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.wu-add-audio-wrap{position:relative;align-self:flex-start;}
.wu-add-audio-btn{height:30px;padding:0 12px;border:1px dashed var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.wu-add-audio-btn:hover{background:var(--bg);}
.wu-add-audio-menu-item{display:flex;align-items:center;gap:8px;}
.wu-rec-dot-sm{width:8px;height:8px;border-radius:50%;background:#E0563A;flex:none;}
.wu-add-ex-btn{align-self:flex-start;height:34px;padding:0 14px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.wu-add-ex-btn:hover{background:var(--panel);}
.wu-empty-filtered{font-size:13px;color:var(--muted);padding:4px 2px;}
.wu-pick-box{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:5px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;position:relative;}
.wu-pick-chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:8px;background:var(--bg);font-size:13px;font-weight:700;color:var(--text);}
.wu-pick-chip-lvl{font-size:11px;font-weight:800;color:#fff;border-radius:5px;padding:1px 5px;}
.wu-pick-chip-remove{border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 4px;}
.wu-pick-chip-remove:hover{color:#A8452C;}
.wu-pick-add{height:30px;padding:0 10px;border:none;border-radius:8px;background:none;color:#A8452C;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.wu-pick-add:hover{background:var(--terracotta-bg);}
.wu-pick-menu{position:absolute;left:0;top:calc(100% + 4px);z-index:30;min-width:150px;width:100%;max-height:300px;overflow-y:auto;scrollbar-gutter:stable;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(35,32,29,0.14);padding:10px 12px;display:flex;flex-direction:column;gap:10px;}
.wu-pick-group-label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.wu-pick-items{display:flex;flex-wrap:wrap;gap:6px;}
.wu-pick-item{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.wu-pick-item.taken{background:var(--bg);color:var(--muted);cursor:default;}
.wu-pick-empty{font-size:12px;color:var(--muted);}
</style>

<body>

<div id="site-lock">
  <div class="lock-card">
    <div class="lock-logo">Лаборатория звука</div>
    <div class="lock-sub">Введи пароль для доступа к базе данных</div>
    <div class="lock-label">Пароль</div>
    <input id="lock-input" class="lock-input" type="password" placeholder="••••••••••••••••••••" autocomplete="current-password">
    <div id="lock-err" class="lock-err"></div>
    <button id="lock-btn" class="lock-btn" disabled>Войти</button>
  </div>
</div>

<script>
(function() {
  var MAX_AGE = 30 * 24 * 3600 * 1000; // 30 дней
  var ts = parseInt(localStorage.getItem('bd_auth_ts') || '0', 10);
  var onProduction = location.hostname === 'baza-dannih.vercel.app';
  if (!onProduction || Date.now() - ts < MAX_AGE) {
    document.getElementById('site-lock').classList.add('hidden');
    return;
  }
  var input = document.getElementById('lock-input');
  var btn   = document.getElementById('lock-btn');
  var err   = document.getElementById('lock-err');
  input.addEventListener('input', function() { btn.disabled = !input.value.trim(); err.textContent = ''; });
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !btn.disabled) btn.click(); });
  btn.addEventListener('click', function() {
    var pw = input.value.trim();
    if (!pw) return;
    btn.disabled = true; btn.textContent = 'Проверяем…';
    fetch('/api/site-login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pw})
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.ok) {
        localStorage.setItem('bd_auth_ts', String(Date.now()));
        document.getElementById('site-lock').classList.add('hidden');
      } else {
        err.textContent = 'Неверный пароль.';
        btn.disabled = false; btn.textContent = 'Войти';
        input.select();
      }
    })
    .catch(function(){
      err.textContent = 'Нет соединения — попробуй ещё раз.';
      btn.disabled = false; btn.textContent = 'Войти';
    });
  });
  setTimeout(function(){ input.focus(); }, 50);
})();
</script>

  ['#C9D9E4','#3F6B85'], ['#E4D0C9','#9A5A3E'], ['#D8D6C0','#6B6B3E']

function avatarColor(id){
  const idx = state.data.students.findIndex(s=>s.id===id);
  return AVATAR_PALETTE[(idx<0?0:idx) % AVATAR_PALETTE.length];

function pluralRu(n, forms){
  const mod10 = n%10, mod100 = n%100;
  if(mod10===1 && mod100!==11) return forms[0];
  if(mod10>=2 && mod10<=4 && !(mod100>=12 && mod100<=14)) return forms[1];
  return forms[2];
}
function lessonsLabel(n){ return n + ' ' + pluralRu(n, ['занятие','занятия','занятий']); }
function invalidateLessonCount(s){
  // Badge count is fetched once and cached; call this after any lesson
  // add/delete so the sidebar and card-header counts stay in sync with
  // the actual rows instead of showing a stale number until page reload.
  delete state.lessonCounts[s.id];
  ensureLessonCounts();
}
function ensureLessonCounts(){
  state.data.students.forEach(s=>{
    if(state.lessonCounts[s.id]!==undefined) return;
    state.lessonCounts[s.id] = null;
    fetch('/api/lessons?studentId=' + encodeURIComponent(s.id))
      .then(r=> r.ok ? r.json() : Promise.reject(new Error('http '+r.status)))
      .then(data=>{
        state.lessonCounts[s.id] = (data.lessons||[]).length;
        renderStudentList();
        if(state.activeStudentId===s.id){
          const eyebrow = document.getElementById('studentEyebrow');
          if(eyebrow) eyebrow.textContent = 'Карточка ученика · ' + lessonsLabel(state.lessonCounts[s.id]);
        }
      })
      .catch(()=>{ delete state.lessonCounts[s.id]; });
  });
}
function renderStudentList(){
  const wrap = document.getElementById('studentListWrap');
  if(!wrap) return;
  const q = (state.search||'').trim().toLowerCase();
  const all = state.data.students.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  const filtered = q ? all.filter(s=>s.name.toLowerCase().indexOf(q)>=0) : all;
  const metaEl = document.getElementById('searchMeta');
  if(metaEl){
    metaEl.innerHTML = q ? `<span>${filtered.length===1?'найден 1 ученик':'найдено: '+filtered.length}</span><button type="button" id="searchResetBtn">Сбросить</button>` : '';
    const rb = document.getElementById('searchResetBtn');
    if(rb) rb.onclick = ()=>{
      state.search = '';
      const inp = document.getElementById('studentSearch');
      if(inp) inp.value = '';
      renderStudentList();
      if(inp) inp.focus();
    };
  }
  if(filtered.length===0){
    wrap.innerHTML = `<div class="no-students">Никто не найден. Попробуйте часть имени или фамилии.</div>`;
    return;
  }
  wrap.innerHTML = filtered.map(s=>{
    const av = avatarColor(s.id);
    const count = state.lessonCounts[s.id];
    const meta = s.status==='trial'
      ? 'Пробный · анкета не заполнена'
      : (statusLabel(s.status) + (count!=null ? ' · ' + lessonsLabel(count) : ''));
    const statusColorClass = s.status==='active' ? 'status-color-active' : s.status==='trial' ? 'status-color-trial' : 'status-color-paused';
    const isMasked = _maskActive && s.id !== state.activeStudentId;
    return `<div class="student-item ${s.id===state.activeStudentId?'active':''}${isMasked?' masked':''}" data-id="${s.id}">
            <div class="avatar" style="background:${av[0]};color:${av[1]};">${initials(s.name)}</div>
            <div>
              <div class="s-name">${s.name}</div>
              <div class="s-status ${statusColorClass}">${meta}</div>
            </div>
          </div>`;
  }).join('');
  wrap.querySelectorAll('.student-item').forEach(el=>{
    el.onclick = ()=>{
      if(state.activeStudentId !== el.dataset.id){
        state.kabinetOpen = { general:true, articulatory:true, anamnesis:true, evt:true, qualities:true, record:true, files:true };
      }
      setActiveStudentId(el.dataset.id);
      state.openSliderTopicIndex=null; state.topicPickerOpen=false; state.compareIds=[];
      scheduleAutoMask();
      render();
    };
  });
}

function statusLabel(s){ return OPTIONS.status.find(x=>x[0]===s)?.[1] || s; }
function scoreClass(score){ if(score===null||score===undefined) return 'none'; return score<5 ? 'low' : 'high'; }
function scoreColor(score){ if(score===null||score===undefined) return '#C7BFB6'; return score<5 ? '#AE5F3F' : '#6C91A6'; }
function lastSrez(s){ return s.srezy.length ? s.srezy[s.srezy.length-1] : null; }
function prevScoreFor(s, name){ const prev = lastSrez(s); if(!prev) return null; const t = prev.topics.find(x=>x.name===name); return t ? t.score : null; }
function topicsForLevel(s, level){
  if(level==='ALL') return s.topics.slice().sort((a,b)=> LEVEL_ORDER.indexOf(a.level)-LEVEL_ORDER.indexOf(b.level));
  return s.topics.filter(t=>t.level===level);
}
function availableToAdd(s, level){
  const added = new Set(s.topics.filter(t=>t.level===level).map(t=>t.name));
  return catalogNames(level).filter(n=>!added.has(n));
}

      const w = Math.max(210, Math.min(520, startW + (ev.clientX - startX)));
      state.sidebarWidth = w;
      sidebarEl.style.width = w + 'px';
    }
    function up(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
  resizer.ondblclick = ()=>{
    state.sidebarWidth = 288;
    document.getElementById('sidebarEl').style.width = '288px';
  };

  renderMain(active);
}

async function addStudent(){
  const name = prompt('Имя и фамилия ученика:');
  if(!name || !name.trim()) return;
  const trimmed = name.trim();
  let id = 's' + Date.now();
  let telegramToken = null;
  try{
    const resp = await apiSend('/api/students', 'POST', { name: trimmed, status: 'trial' });
    if(resp && resp.student && resp.student.id) id = resp.student.id;
    if(resp && resp.student && resp.student.telegramToken) telegramToken = resp.student.telegramToken;
  }catch(e){
    alert('Не удалось сохранить ученика в базе данных: ' + (e.message||e) + '\nУченик добавлен только локально и пропадёт при следующей загрузке с другого устройства.');
  }
  state.data.students.push({
    id, name: trimmed, status: 'trial', telegramToken,
    org: { schedule:'—', format:'Онлайн', source:'Прочее', freq:'Пробное занятие' },
    voice: { type:'', vibrato:'', breathType:'', support:'', attack:'', larynx:'' },
    range: { bottom:'', top:'', tessBottom:'', tessTop:'', passaggio1:'', passaggio2:'' },
    timbre: [], problems: [], compensations: [], flags: [],
    topics: [],
    srezDate: null, srezy: [],
    repertoire: { current:'', future:[] }
  });
  setActiveStudentId(id);
  saveData(); render();
}
async function deleteStudent(s){
  if(!s) return;
  if(!confirm('Удалить ученика «'+s.name+'»?\nВсе данные (дневник, срезы, записи) будут удалены без возможности восстановления.')) return;
  try{
    await apiSend('/api/students?id=' + encodeURIComponent(s.id), 'DELETE');
  }catch(e){
    alert('Не удалось удалить ученика из базы: ' + (e.message||e));
    return;
  }
  state.data.students = state.data.students.filter(x=>x.id!==s.id);
  if(state.activeStudentId===s.id){
    setActiveStudentId(state.data.students[0] ? state.data.students[0].id : null);
  }
  saveData(); render();
}
async function syncStudentsFromServer(){
  try{
    const data = await apiGet('/api/students');
    const serverList = (data && data.students) || [];
    if(!serverList.length) return;
    const localById = {};
    state.data.students.forEach(s=>{ localById[s.id] = s; });
    const merged = serverList.map(srv=>{
      const loc = localById[srv.id];
      if(loc){
        loc.name = srv.name;
        loc.status = srv.status;
        if(srv.schedule){ loc.org.freq = srv.schedule; }
        if(srv.telegramToken) loc.telegramToken = srv.telegramToken;
        loc.packageSize = srv.packageSize;
        loc.packageStartDate = srv.packageStartDate;
        return loc;
      }
      return {
        id: srv.id, name: srv.name, status: srv.status,
        telegramToken: srv.telegramToken || null,
        packageSize: srv.packageSize, packageStartDate: srv.packageStartDate,
        org: { schedule:'—', format:'Онлайн', source:'Прочее', freq: srv.schedule || 'Пробное занятие' },
        voice: { type:'', vibrato:'', breathType:'', support:'', attack:'', larynx:'' },
        range: { bottom:'', top:'', tessBottom:'', tessTop:'', passaggio1:'', passaggio2:'' },
        timbre: [], problems: [], compensations: [], flags: [],
        topics: [], srezDate: null, srezy: [],
        repertoire: { current:'', future:[] }
      };
    });
    state.data.students = merged;
    if(!state.activeStudentId || !merged.find(s=>s.id===state.activeStudentId)){
      setActiveStudentId(merged[0] ? merged[0].id : null);
    }
    state.lessonCounts = {};
    saveData();
    render();
  }catch(e){
    // БД не подключена или недоступна — остаёмся на локальных/дефолтных данных
  }
}

function selectField(label, options, value, fieldKey){
  const [group, key] = fieldKey.split('-');
